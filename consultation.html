<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script src="config.js"></script>
<script src="i18n.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuSang Vision — 單獨問事</title>
<style>
  /* Landing 專屬（共用樣式由 consultation-common.js 注入）*/
  .lp-hero { text-align: center; padding: 24px 0 8px; }
  .lp-eyebrow {
    font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 16px;
  }
  .lp-title {
    font-family: var(--font-serif-zh); font-weight: 500;
    font-size: clamp(30px, 6vw, 46px); line-height: 1.2; color: var(--ink-darkest);
    letter-spacing: 0.01em; margin-bottom: 16px;
  }
  .lp-sub {
    font-family: var(--font-serif-en); font-style: italic; font-size: 17px;
    color: var(--ink-light); max-width: 460px; margin: 0 auto;
  }
  .lp-rule { margin: 28px auto 0; width: 64px; height: 1px; background: var(--gold); opacity: 0.6; }

  .lp-section { margin: 44px 0; }
  .lp-lead {
    font-family: var(--font-serif-zh); font-size: 17px; line-height: 2;
    color: var(--ink-dark); text-align: center; max-width: 560px; margin: 0 auto;
  }

  .lp-features {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 40px 0;
  }
  @media (max-width: 640px) { .lp-features { grid-template-columns: 1fr; } }
  .lp-feat {
    position: relative; background: var(--bg-card); border: 1px solid var(--rule);
    border-radius: 4px; padding: 24px 22px; overflow: hidden;
  }
  .lp-feat::before {
    content: ''; position: absolute; top: 0; right: 0; width: 30px; height: 30px;
    border-top: 1px solid var(--gold); border-right: 1px solid var(--gold);
    opacity: 0.4; border-top-right-radius: 4px;
  }
  .lp-feat-n {
    font-family: var(--font-serif-en); font-style: italic; font-size: 15px;
    color: var(--gold); margin-bottom: 10px;
  }
  .lp-feat-h {
    font-family: var(--font-serif-zh); font-weight: 500; font-size: 17px;
    color: var(--ink-darkest); margin-bottom: 8px;
  }
  .lp-feat-p {
    font-family: var(--font-serif-zh); font-size: 13.5px; line-height: 1.8;
    color: var(--ink-mid);
  }

  .lp-media {
    width: 100%; border-radius: 6px; overflow: hidden; margin: 40px 0;
    border: 1px solid var(--rule); background: var(--bg-soft-2);
    aspect-ratio: 16 / 7; display: flex; align-items: center; justify-content: center;
  }
  .lp-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lp-media-ph {
    font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.1em;
    color: var(--ink-faint); text-transform: uppercase;
  }

  .lp-price { text-align: center; margin: 40px 0 12px; }
  .lp-price-tag { font-family: var(--font-serif-zh); font-size: 15px; color: var(--ink-mid); }
  .lp-price-tag strong {
    font-family: var(--font-serif-en); font-size: 32px; color: var(--ink-darkest);
    font-weight: 500; font-style: normal; margin: 0 4px;
  }

  .lp-actions {
    display: flex; flex-direction: column; gap: 12px; max-width: 380px; margin: 28px auto 0;
  }
  .lp-note {
    font-family: var(--font-sans); font-size: 12px; color: var(--ink-light);
    text-align: center; margin-top: 16px; line-height: 1.7;
  }
</style>
</head>
<body>

<div id="site-header"></div>

<div class="fs-page">
  <div class="cons-wrap">

    <div class="lp-hero">
      <div class="lp-eyebrow" id="lp-eyebrow">Personal Consultation</div>
      <h1 class="lp-title" id="lp-title">單獨問事</h1>
      <div class="lp-sub" id="lp-sub">A human reading of your chart, for one question that matters.</div>
      <div class="lp-rule"></div>
    </div>

    <div class="lp-section">
      <p class="lp-lead" id="lp-lead">
        當你有一個真正重要、想要被慎重對待的問題，單獨問事是為你一個人準備的一次解讀。
      </p>
    </div>

    <div class="lp-media">
      <!-- <img src="你的素材圖.jpg" alt="FuSang Vision" /> -->
      <span class="lp-media-ph" id="lp-media-ph">Your image here</span>
    </div>

    <div class="lp-features" id="lp-features"></div>

    <div class="lp-price">
      <div class="lp-price-tag" id="lp-price"><strong>US$68</strong></div>
    </div>

    <div id="lp-loading" class="cons-loading" style="padding:40px 20px;">載入中…</div>
    <div class="lp-actions" id="lp-actions" style="display:none;"></div>
    <div class="lp-note" id="lp-note" style="display:none;"></div>

  </div>
</div>

<div id="site-footer"></div>

<script type="module">
  window.FS_ACTIVE_PAGE = 'consultation';
  import {
    initConsult,
    pick, getMyTickets, findActive,
    el,
  } from './consultation-common.js';

  document.getElementById('lp-eyebrow').textContent = pick('單獨問事', 'Personal Consultation');
  document.getElementById('lp-title').textContent   = pick('單獨問事', 'Personal Consultation');
  document.getElementById('lp-sub').textContent     = pick('一個真正重要的問題，由真人為你解盤。', 'A human reading of your chart, for one question that matters.');
  document.getElementById('lp-lead').textContent    = pick(
    '當你有一個真正重要、想要被慎重對待的問題，單獨問事是為你一個人準備的一次解讀。',
    'When you have a question that truly matters and deserves care, a personal consultation is a reading prepared for you alone.'
  );
  document.getElementById('lp-media-ph').textContent = pick('圖片素材（待放入）', 'Your image here');

  const FEATURES = [
    { n: '01', zh_h: '真人解盤', en_h: 'Answered by a human', zh_p: '由 RS Chen 親自解讀你的命盤，針對你的處境書面回覆。', en_p: 'RS Chen personally reads your chart and replies in writing to your situation.' },
    { n: '02', zh_h: '為你個別撰寫', en_h: 'Written for you', zh_p: '每一則諮詢都是針對你的問題單獨準備，不是罐頭答案。', en_p: 'Each consultation is prepared individually for your question — never a template.' },
    { n: '03', zh_h: '可追問一次', en_h: 'One follow-up', zh_p: '收到回覆後，7 天內可再追問一次，把想釐清的地方問清楚。', en_p: 'After the reply, you may ask one follow-up within 7 days to clarify further.' },
  ];
  document.getElementById('lp-features').innerHTML = FEATURES.map((f) =>
    `<div class="lp-feat"><div class="lp-feat-n">${f.n}</div>` +
    `<div class="lp-feat-h">${pick(f.zh_h, f.en_h)}</div>` +
    `<div class="lp-feat-p">${pick(f.zh_p, f.en_p)}</div></div>`
  ).join('');

  (async () => {
    const session = await initConsult('home');
    if (!session) return;

    const tickets = await getMyTickets();
    const active = findActive(tickets);

    document.getElementById('lp-loading').style.display = 'none';
    const actions = document.getElementById('lp-actions');
    const note = document.getElementById('lp-note');
    actions.style.display = 'flex';

    if (active) {
      actions.innerHTML =
        `<button class="cons-btn" id="btn-active">${pick('查看進行中的諮詢', 'View your active consultation')}</button>` +
        `<button class="cons-btn ghost" id="btn-list">${pick('我的問事紀錄', 'My consultations')}</button>`;
      actions.querySelector('#btn-active').addEventListener('click', () => { window.location.href = `consultation-detail.html?id=${active.id}`; });
      note.style.display = 'block';
      note.textContent = pick('你目前有一則進行中的諮詢。同一時間僅能進行一則。', 'You have one consultation in progress. Only one at a time.');
    } else {
      actions.innerHTML =
        `<button class="cons-btn" id="btn-new">${pick('提交新的問事', 'New consultation')}</button>` +
        `<button class="cons-btn ghost" id="btn-list">${pick('我的問事紀錄', 'My consultations')}</button>`;
      actions.querySelector('#btn-new').addEventListener('click', () => { window.location.href = 'consultation-form.html'; });
    }
    actions.querySelector('#btn-list').addEventListener('click', () => { window.location.href = 'consultation-list.html'; });
  })();
</script>

</body>
</html>
