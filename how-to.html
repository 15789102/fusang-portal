<!DOCTYPE html>

<script>
  // ── how-to 專屬 UI 字典(策略 B;位置索引見 i18n.js 檔頭)──

    // ── 第二步 ──
    'ht.s2Label': { 'zh-TW': '第二步', 'zh-CN': '第二步', 'en': 'Step 2' },
    'ht.s2Title': { 'zh-TW': '開啟大限、流年、流月', 'zh-CN': '开启大限、流年、流月', 'en': 'Open Decade, Annual, and Monthly' },
    'ht.s2Body':  { 'zh-TW': '本命盤完成後，「命盤」選單會出現其餘三層的入口——這是很多人容易錯過的地方：如果你只看了本命，別忘了還有三層可以開啟。而且這三層可以同時開啟，不必照順序。', 'zh-CN': '本命盘完成后，「命盘」菜单会出现其余三层的入口——这是很多人容易错过的地方：如果你只看了本命，别忘了还有三层可以开启。而且这三层可以同时开启，不必按顺序。', 'en': 'Once your Natal chart is complete, the Charts menu reveals the other three layers \u2014 this is where many people miss out: if you\u2019ve only read your Natal chart, don\u2019t forget there are three more layers to open. And these three can be opened at the same time, in any order.' },

    // ── 三層卡片(名稱與路徑必須等同 nav 現值,見檔頭警告)──

  });
</script>
<style>
  .ht-wrap { max-width: 760px; margin: 0 auto; padding: 44px 32px 64px; }
  @media (max-width: 640px) { .ht-wrap { padding: 32px 20px 48px; } }

  .ht-hero { text-align: center; margin-bottom: 40px; }
  .ht-eyebrow { font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent-soft); opacity: 0.75; margin-bottom: 14px; }
  .ht-title { font-family: var(--font-serif-zh); font-weight: 700; font-size: clamp(30px, 5vw, 44px); color: var(--ink-darkest); letter-spacing: 0.02em; margin-bottom: 14px; }
  .ht-sub { font-family: var(--font-serif-zh); font-size: 15px; color: var(--ink-mid); line-height: 1.8; max-width: 520px; margin: 0 auto; }

  /* ── 順序規則帶 ── */
  .ht-rule { display: flex; align-items: flex-start; gap: 16px; padding: 22px 26px; background: var(--bg-soft-2); border-radius: 14px; margin-bottom: 40px; }
  .ht-rule-label { flex: 0 0 auto; font-family: var(--font-sans); font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-soft); opacity: 0.85; padding-top: 4px; }
  .ht-rule-text { font-family: var(--font-serif-zh); font-size: 14.5px; line-height: 1.9; color: var(--ink-dark); }
  @media (max-width: 640px) { .ht-rule { flex-direction: column; gap: 8px; padding: 20px; } .ht-rule-label { padding-top: 0; } }

  /* ── 步驟卡 ── */
  .ht-steps { display: flex; flex-direction: column; gap: 20px; }
  .ht-step { background: #ffffff; border: 1px solid var(--rule); border-radius: 12px; padding: 28px 30px; }
  @media (max-width: 640px) { .ht-step { padding: 24px 20px; } }
  .ht-step-label { font-family: var(--font-sans); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-soft); opacity: 0.85; margin-bottom: 10px; }
  .ht-step-title { font-family: var(--font-serif-zh); font-size: 19px; font-weight: 600; color: var(--ink-darkest); letter-spacing: 0.02em; margin-bottom: 14px; }
  .ht-step-body { font-family: var(--font-serif-zh); font-size: 14.5px; line-height: 1.9; color: var(--ink-mid); }

  /* ── 查看方式清單 ── */
  .ht-how { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule-soft-2); }
  .ht-how-label { font-family: var(--font-sans); font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 14px; }
  .ht-how-list { list-style: none; display: flex; flex-direction: column; gap: 11px; }
  .ht-how-list li { display: flex; align-items: flex-start; gap: 12px; font-family: var(--font-serif-zh); font-size: 14.5px; line-height: 1.8; color: var(--ink-mid); }
  .ht-how-n { flex: 0 0 auto; width: 21px; height: 21px; margin-top: 2px; border-radius: 50%; background: var(--bg-soft); color: var(--accent-soft); font-family: var(--font-sans); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  .ht-step-foot { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule-soft-2); font-family: var(--font-serif-zh); font-size: 14px; line-height: 1.85; color: var(--ink-dark); }

  /* ── 三層卡片 ── */
  .ht-layers { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
  .ht-layer { border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; background: var(--bg-card); }
  .ht-layer.is-key { border-color: var(--accent-pale); background: linear-gradient(180deg, var(--wash-teal) 0%, #ffffff 60%); }
  .ht-layer-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .ht-layer-name { font-family: var(--font-serif-zh); font-size: 16px; font-weight: 600; color: var(--ink-darkest); letter-spacing: 0.03em; }
  .ht-layer-tag { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold-soft); border-radius: 999px; padding: 3px 9px; }
  .ht-layer-path { font-family: var(--font-sans); font-size: 11.5px; letter-spacing: 0.06em; color: var(--silver-deep); background: var(--bg-soft); border-radius: 999px; padding: 4px 11px; }
  .ht-layer-body { font-family: var(--font-serif-zh); font-size: 14.5px; line-height: 1.9; color: var(--ink-mid); }
</style>
</head>

<body>

<script>window.FS_ACTIVE_PAGE = 'howto';</script>

<div id="site-header"></div>

<div class="fs-page">
  <div class="ht-wrap">

    <div class="ht-hero">
      <div class="ht-eyebrow">How to Use</div>
      <h1 class="ht-title" data-i18n="ht.title"></h1>
      <div class="ht-sub" data-i18n="ht.sub"></div>
    </div>

    <div class="ht-rule">
      <div class="ht-rule-label" data-i18n="ht.ruleLabel"></div>
      <div class="ht-rule-text" data-i18n="ht.rule"></div>
    </div>

    <div class="ht-steps">

      <!-- 第一步 -->
      <section class="ht-step">
        <div class="ht-step-label" data-i18n="ht.s1Label"></div>
        <h2 class="ht-step-title" data-i18n="ht.s1Title"></h2>
        <div class="ht-step-body" data-i18n="ht.s1Body"></div>

        <div class="ht-how">
          <div class="ht-how-label" data-i18n="ht.s1HowLabel"></div>
          <ul class="ht-how-list">
            <li><span class="ht-how-n">1</span><span data-i18n="ht.s1How1"></span></li>
            <li><span class="ht-how-n">2</span><span data-i18n="ht.s1How2"></span></li>
            <li><span class="ht-how-n">3</span><span data-i18n="ht.s1How3"></span></li>
          </ul>
        </div>

        <div class="ht-step-foot" data-i18n="ht.s1Foot"></div>
      </section>

      <!-- 第二步 -->
      <section class="ht-step">
        <div class="ht-step-label" data-i18n="ht.s2Label"></div>
        <h2 class="ht-step-title" data-i18n="ht.s2Title"></h2>
        <div class="ht-step-body" data-i18n="ht.s2Body"></div>

        <div class="ht-layers">

          <div class="ht-layer">
            <div class="ht-layer-head">
              <span class="ht-layer-name" data-i18n="ht.lyDecadeName"></span>
              <span class="ht-layer-path" data-i18n="ht.lyDecadePath"></span>
            </div>
            <div class="ht-layer-body" data-i18n="ht.lyDecadeBody"></div>
          </div>

          <div class="ht-layer">
            <div class="ht-layer-head">
              <span class="ht-layer-name" data-i18n="ht.lyAnnualName"></span>
              <span class="ht-layer-path" data-i18n="ht.lyAnnualPath"></span>
            </div>
            <div class="ht-layer-body" data-i18n="ht.lyAnnualBody"></div>
          </div>

          <div class="ht-layer is-key">
            <div class="ht-layer-head">
              <span class="ht-layer-name" data-i18n="ht.lyMonthlyName"></span>
              <span class="ht-layer-tag" data-i18n="ht.lyMonthlyTag"></span>
              <span class="ht-layer-path" data-i18n="ht.lyMonthlyPath"></span>
            </div>
            <div class="ht-layer-body" data-i18n="ht.lyMonthlyBody"></div>
          </div>

        </div>
      </section>

    </div>
  </div>
</div>

<div id="site-footer"></div>

<script type="module">
  // 純說明頁:不呼叫 requireAuth(PM 決策 D4,未登入可直達;供 Brevo 再行銷信連入)。
  // 僅以 side-effect import 觸發 components.js 的 initComponents(header / footer / 背景層)。
  import './components.js';

  const F = window.FSI18N;

  // 靜態內容(data-i18n)由 i18n.js 的 applyI18n 自動填入與重譯;
  // 此處只補非 data-i18n 的 document.title。
  function applyLangUi() {
    document.title = F.t('ht.docTitle');
  }
  applyLangUi();
  document.addEventListener('DOMContentLoaded', applyLangUi);
  window.addEventListener('i18n:changed', applyLangUi);
</script>

</body>
</html>
