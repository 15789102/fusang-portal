    // ── 順序規則帶 ──

    // ── 第一步 ──
    'ht.s1Label':    { 'zh-TW': '第一步', 'zh-CN': '第一步', 'en': 'Step 1', 'ja': 'ステップ1', 'ko': '1단계' },

    'ht.s1Body':     { 'zh-TW': '填寫出生資料（日期、時間、地點）後，系統會生成你的本命盤，約需 15–20 分鐘。完成後我們會寄信通知你，就可以開始查看。', 'zh-CN': '填写出生资料（日期、时间、地点）后，系统会生成你的本命盘，约需 15–20 分钟。完成后我们会寄信通知你，就可以开始查看。', 'en': 'After you enter your birth details (date, time, and place), the system generates your Natal chart. This takes about 15 to 20 minutes. We will email you when it is ready, and you can start reading.', 'ja': '出生データ（日付・時刻・場所）を入力すると、あなたの本命盤が作成されます。所要時間は約15〜20分です。完成したらメールでお知らせしますので、そこから読み始められます。', 'ko': '출생 정보(날짜, 시간, 장소)를 입력하면 시스템이 본명반을 생성해요. 약 15–20분이 걸려요. 완료되면 메일로 알려 드리니 그때부터 확인할 수 있어요.' },

    'ht.s1How4':     { 'zh-TW': '再從摘要進入該宮位的完整解讀', 'zh-CN': '再从摘要进入该宫位的完整解读', 'en': 'From the summary, open the full reading for that palace', 'ja': '概要から、その宮の詳しい解説へ進みます', 'ko': '요약에서 그 궁의 전체 해석으로 들어가요' },
    'ht.s1Foot':     { 'zh-TW': '本命盤是一切的基礎，也是解鎖其餘三層的第一步。', 'zh-CN': '本命盘是一切的基础，也是解锁其余三层的第一步。', 'en': 'The Natal chart is the foundation of everything, and the first step to unlocking the other three layers.', 'ja': '本命盤はすべての土台であり、ほかの三つの層をひらく最初のステップです。', 'ko': '본명반은 모든 것의 기초이자, 나머지 세 가지를 여는 첫걸음이에요.' },

    'ht.lyDecadePath': { 'zh-TW': '命盤 → 大限', 'zh-CN': '命盘 → 大限', 'en': 'Charts → Decade', 'ja': '命盤 → 大限', 'ko': '명반 → 대한' },
    'ht.lyDecadeBody': { 'zh-TW': '開啟每個十年的解讀，看見你人生不同十年階段的重心與節奏。', 'zh-CN': '开启每个十年的解读，看见你人生不同十年阶段的重心与节奏。', 'en': 'Open the reading for each ten-year period, and see the focus and rhythm of each decade of your life.', 'ja': '10年ごとの解説をひらき、人生のそれぞれの10年間の重心とリズムを見てみましょう。', 'ko': '10년 단위의 해석을 열어, 인생의 각 10년 시기마다 중심과 리듬이 어디에 있는지 살펴보세요.' },

    'ht.lyAnnualName': { 'zh-TW': '流年', 'zh-CN': '流年', 'en': 'Annual', 'ja': '流年', 'ko': '유년' },

    'ht.lyMonthlyName': { 'zh-TW': '流月', 'zh-CN': '流月', 'en': 'Monthly', 'ja': '流月', 'ko': '유월' },

    'ht.lyMonthlyBody': { 'zh-TW': '這是最個人化的一層。開啟每月流月後，每月 1 號會為你生成新一期的解讀並寄到你的信箱，看見當月的重心；解鎖四化後，流月同樣包含完整的四化解讀。你也可以為宮位設定想追蹤的議題，每期的「追蹤議題解析」會持續回應它。', 'zh-CN': '这是最个人化的一层。开启每月流月后，每月 1 号会为你生成新一期的解读并寄到你的邮箱，看见当月的重心；解锁四化后，流月同样包含完整的四化解读。你也可以为宫位设定想追踪的议题，每期的「追踪议题解析」会持续回应它。', 'en': 'This is the most personal layer. Once you turn on monthly readings, a new reading is generated on the 1st of each month and sent to your inbox, showing where that month is focused. After unlocking the four transformations, Monthly includes the full transformation reading too. You can also set a focus you want to track for a palace, and each issue of Your Tracked Focus will keep responding to it.', 'ja': 'もっとも個人に寄り添った層です。毎月の流月をオンにすると、毎月1日に新しい解説が作成されてメールで届き、その月の重心がわかります。四化を解除すると、流月にも四化の完全な解説が含まれます。また、宮ごとに追跡したいテーマを設定でき、毎号の「追跡テーマの解説」がそのテーマに継続して応えていきます。', 'ko': '가장 개인적인 리포트예요. 유월을 열면 매월 1일에 새 해석이 생성되어 메일로 발송되고, 그달의 중심을 살펴볼 수 있어요. 사화를 잠금 해제하면 유월에도 사화 해석이 모두 포함돼요. 궁별로 살펴보고 싶은 주제를 설정할 수도 있으며, 매 회차의 ‘관심 주제 분석’이 그 주제에 계속 답해 드려요.' },
    'ht.lyMonthlyNote': { 'zh-TW': '流月依農曆月份計算，所以每期的適用期間不會剛好是國曆的 1 號到月底。流月頁上會標出實際適用的國曆日期。', 'zh-CN': '流月依农历月份计算，所以每期的适用期间不会刚好是公历的 1 号到月底。流月页上会标出实际适用的公历日期。', 'en': 'Monthly readings follow the lunar calendar, so each period does not run exactly from the 1st to the end of a calendar month. The Monthly page shows the exact dates each reading covers.', 'ja': '流月は旧暦の月で計算するため、各号の対象期間は西暦の1日から月末までとぴったり一致しません。流月ページには、実際に対象となる西暦の日付が表示されます。', 'ko': '유월은 음력 달을 기준으로 계산하기 때문에, 각 회차의 적용 기간이 양력 1일부터 말일까지와 정확히 일치하지 않아요. 유월 페이지에 실제 적용되는 양력 날짜가 표시돼요.' },

    'ht.s3Title': { 'zh-TW': '更進一步', 'zh-CN': '更进一步', 'en': 'Go further', 'ja': 'さらに深く', 'ko': '한 걸음 더' },

    'ht.xSihuaName':  { 'zh-TW': '解鎖四化', 'zh-CN': '解锁四化', 'en': 'Unlock the four transformations', 'ja': '四化を解除する', 'ko': '사화 잠금 해제' },
    'ht.xSihuaBody':  { 'zh-TW': '一次解鎖，本命、大限、流年、流月都會加上四化解讀，看懂能量如何流動、該往哪裡使力。', 'zh-CN': '一次解锁，本命、大限、流年、流月都会加上四化解读，看懂能量如何流动、该往哪里使力。', 'en': 'One unlock adds the transformation reading to Natal, Decade, Annual, and Monthly, so you can see how your energy moves and where to put your effort.', 'ja': '一度の解除で、本命・大限・流年・流月のすべてに四化の解説が加わり、エネルギーがどう流れ、どこに力を注ぐべきかが見えてきます。', 'ko': '한 번 잠금 해제하면 본명, 대한, 유년, 유월 모두에 사화 해석이 더해져, 에너지가 어떻게 흐르고 어디에 힘을 쏟으면 좋을지 알 수 있어요.' },
    'ht.xSihuaCta':   { 'zh-TW': '查看方案', 'zh-CN': '查看方案', 'en': 'View plans', 'ja': 'プランを見る', 'ko': '요금제 보기' },
    'ht.xSihuaOwned': { 'zh-TW': '你已解鎖全部四化，四層報告都已包含四化解讀。', 'zh-CN': '你已解锁全部四化，四层报告都已包含四化解读。', 'en': 'You have unlocked all four transformations. Every layer already includes them.', 'ja': '四化はすべて解除済みです。四つの層のレポートすべてに四化の解説が含まれています。', 'ko': '사화를 모두 잠금 해제하셨어요. 네 가지 리포트 모두에 사화 해석이 포함되어 있어요.' },
    'ht.xConsultName': { 'zh-TW': '單獨問事', 'zh-CN': '单独问事', 'en': 'Individual Session', 'ja': '個別相談', 'ko': '1:1 상담' },
    'ht.xConsultBody': { 'zh-TW': '選定主題、說明處境，由 R.S. Chen 親自解讀你的命盤並書面回覆，收到回覆後 7 天內可追問一次。', 'zh-CN': '选定主题、说明处境，由 R.S. Chen 亲自解读你的命盘并书面回复，收到回复后 7 天内可追问一次。', 'en': 'Choose a topic and describe your situation. R.S. Chen reads your chart personally and replies in writing, and you may ask one follow-up within 7 days.', 'ja': 'テーマを選び、状況をお伝えください。R.S. Chen があなたの命盤を直接読み解き、書面でお答えします。回答の受け取りから7日以内に、追加質問が1回できます。', 'ko': '주제를 정하고 상황을 설명하면 R.S. Chen이 직접 명반을 해석해 서면으로 답변해 드려요. 답변을 받은 뒤 7일 이내에 한 번 추가 질문할 수 있어요.' },
    'ht.xConsultCta':  { 'zh-TW': '前往問事', 'zh-CN': '前往问事', 'en': 'Go to consultation', 'ja': '個別相談へ', 'ko': '상담하러 가기' }
  });

<script type="module">
  // 純說明頁:不呼叫 requireAuth(PM 決策 D4,未登入可直達;供 Brevo 再行銷信連入)。
  import { supabase, getSession } from './components.js';

  const F = window.FSI18N;

  // 靜態內容(data-i18n)由 i18n.js 的 applyI18n 自動填入與重譯;此處只補 document.title。
  function applyLangUi() { document.title = F.t('ht.docTitle'); }
  applyLangUi();
  document.addEventListener('DOMContentLoaded', applyLangUi);
  window.addEventListener('i18n:changed', applyLangUi);

  // 單獨問事：CONSULT_ENABLED 明確為 true 才顯示入口，否則顯示「即將推出」(fail-closed)
  const consultOn = !!(window.CFG && window.CFG.CONSULT_ENABLED === true);
  document.getElementById(consultOn ? 'ht-consult-act' : 'ht-consult-soon').hidden = false;

  // 四化：已登入且已解鎖 → 改顯示說明。只讀；未登入或讀取失敗 → 維持「查看方案」。
  (async () => {
    try {
      const session = await getSession();
      if (!session) return;
      const { data, error } = await supabase
        .from('user_profiles').select('sihua_unlocked')
        .eq('id', session.user.id).maybeSingle();
      if (!error && data && data.sihua_unlocked === true) {
        document.getElementById('ht-sihua-act').hidden = true;
        document.getElementById('ht-sihua-owned').hidden = false;
      }
    } catch (e) {
      console.warn('[how-to] sihua check skipped:', e?.message || e);
    }
  })();
</script>
