  // ── how-to 專屬 UI 字典(策略 B;位置索引見 i18n.js 檔頭)──
  //   ⚠ 介面用語一致原則(PM 決策 D3):文案中提到 nav 下拉的四層時,
  //     一律使用 i18n.js 共用區 navChart / navDecade / navAnnual / navMonthly / navCharts
  //     的「現值」,不自創別名(例:nav 現值為「大限」,不可寫成「大限盤」)。
  //     日後若共用區那些 key 的值有變動,本檔對應字串必須同步更新。
  //   ⚠ 流月用語對齊 monthly.html：「開啟每月流月」(mo.enableTitle)、「追蹤議題解析」(mo.personalTitle)。
  //   裝飾性英文 eyebrow 刻意保留靜態(比照 support.html)。
  //   2026-09-24 v2 改版：內容對齊現行流程(生成時間/寄信/兩段式宮位/追蹤議題/農曆適用日期)+ 第三步。
  window.FSI18N.addUI({
    'ht.docTitle': { 'zh-TW': '怎麼使用 FuSang - FuSang Vision', 'zh-CN': '如何使用 FuSang - FuSang Vision', 'en': 'How to Use FuSang - FuSang Vision' },
    'ht.title':    { 'zh-TW': '怎麼使用 FuSang', 'zh-CN': '如何使用 FuSang', 'en': 'How to Use FuSang' },
    'ht.sub':      { 'zh-TW': 'FuSang 提供四層報告：本命、大限、流年、流月。這頁說明怎麼一步步使用。', 'zh-CN': 'FuSang 提供四层报告：本命、大限、流年、流月。这页说明怎么一步步使用。', 'en': 'FuSang offers four layers of reading: Natal, Decade, Annual, and Monthly. This page walks you through each step.' },

    // ── 順序規則帶 ──
    'ht.ruleLabel': { 'zh-TW': '順序', 'zh-CN': '顺序', 'en': 'Order' },
    'ht.rule':      { 'zh-TW': '使用上只有一個順序：先完成本命盤，其餘三層才能開啟。本命完成後，大限、流年、流月可以同時開啟，不必照順序。', 'zh-CN': '使用上只有一个顺序：先完成本命盘，其余三层才能开启。本命完成后，大限、流年、流月可以同时开启，不必按顺序。', 'en': 'There is only one rule of order. Complete your Natal chart first, and the other three unlock. After that, Decade, Annual, and Monthly can all be opened at once, in any order.' },

    // ── 第一步 ──
    'ht.s1Label':    { 'zh-TW': '第一步', 'zh-CN': '第一步', 'en': 'Step 1' },
    'ht.s1Title':    { 'zh-TW': '生成並查看你的本命盤', 'zh-CN': '生成并查看你的本命盘', 'en': 'Generate and read your Natal chart' },
    'ht.s1Body':     { 'zh-TW': '填寫出生資料（日期、時間、地點）後，系統會生成你的本命盤，約需 15–20 分鐘。完成後我們會寄信通知你，就可以開始查看。', 'zh-CN': '填写出生资料（日期、时间、地点）后，系统会生成你的本命盘，约需 15–20 分钟。完成后我们会寄信通知你，就可以开始查看。', 'en': 'After you enter your birth details (date, time, and place), the system generates your Natal chart. This takes about 15 to 20 minutes. We will email you when it is ready, and you can start reading.' },
    'ht.s1HowLabel': { 'zh-TW': '查看方式', 'zh-CN': '查看方式', 'en': 'How to view it' },
    'ht.s1How1':     { 'zh-TW': '在上方導覽列打開「命盤」選單', 'zh-CN': '在上方导航栏打开「命盘」菜单', 'en': 'Open the Charts menu in the top navigation' },
    'ht.s1How2':     { 'zh-TW': '命盤 → 本命盤', 'zh-CN': '命盘 → 本命盘', 'en': 'Charts → Natal' },
    'ht.s1How3':     { 'zh-TW': '點擊宮位，命盤中間會先顯示該宮位的摘要', 'zh-CN': '点击宫位，命盘中间会先显示该宫位的摘要', 'en': 'Click a palace, and its summary appears in the center of the chart' },
    'ht.s1How4':     { 'zh-TW': '再從摘要進入該宮位的完整解讀', 'zh-CN': '再从摘要进入该宫位的完整解读', 'en': 'From the summary, open the full reading for that palace' },
    'ht.s1Foot':     { 'zh-TW': '本命盤是一切的基礎，也是解鎖其餘三層的第一步。', 'zh-CN': '本命盘是一切的基础，也是解锁其余三层的第一步。', 'en': 'The Natal chart is the foundation of everything, and the first step to unlocking the other three layers.' },

    // ── 第二步 ──
    'ht.s2Label': { 'zh-TW': '第二步', 'zh-CN': '第二步', 'en': 'Step 2' },
    'ht.s2Title': { 'zh-TW': '開啟大限、流年、流月', 'zh-CN': '开启大限、流年、流月', 'en': 'Open Decade, Annual, and Monthly' },
    'ht.s2Body':  { 'zh-TW': '本命盤完成後，「命盤」選單會出現其餘三層的入口。這是很多人容易錯過的地方：如果你只看了本命，別忘了還有三層可以開啟，而且可以同時開啟，不必照順序。', 'zh-CN': '本命盘完成后，「命盘」菜单会出现其余三层的入口。这是很多人容易错过的地方：如果你只看了本命，别忘了还有三层可以开启，而且可以同时开启，不必按顺序。', 'en': 'Once your Natal chart is complete, the Charts menu shows the other three layers. Many people miss this step. If you have only read your Natal chart, there are three more layers waiting, and you can open them all at once, in any order.' },

    // ── 三層卡片(名稱與路徑必須等同 nav 現值,見檔頭警告)──
    'ht.lyDecadeName': { 'zh-TW': '大限', 'zh-CN': '大限', 'en': 'Decade' },
    'ht.lyDecadePath': { 'zh-TW': '命盤 → 大限', 'zh-CN': '命盘 → 大限', 'en': 'Charts → Decade' },
    'ht.lyDecadeBody': { 'zh-TW': '開啟每個十年的解讀，看見你人生不同十年階段的重心與節奏。', 'zh-CN': '开启每个十年的解读，看见你人生不同十年阶段的重心与节奏。', 'en': 'Open the reading for each ten-year period, and see the focus and rhythm of each decade of your life.' },

    'ht.lyAnnualName': { 'zh-TW': '流年', 'zh-CN': '流年', 'en': 'Annual' },
    'ht.lyAnnualPath': { 'zh-TW': '命盤 → 流年', 'zh-CN': '命盘 → 流年', 'en': 'Charts → Annual' },
    'ht.lyAnnualBody': { 'zh-TW': '開啟當前年度的解讀，看見這一年哪些領域比較活躍、重心落在哪裡。', 'zh-CN': '开启当前年度的解读，看见这一年哪些领域比较活跃、重心落在哪里。', 'en': 'Open the reading for the current year, and see which areas are more active and where the focus lies.' },

    'ht.lyMonthlyName': { 'zh-TW': '流月', 'zh-CN': '流月', 'en': 'Monthly' },
    'ht.lyMonthlyTag':  { 'zh-TW': '最重要', 'zh-CN': '最重要', 'en': 'Most important' },
    'ht.lyMonthlyPath': { 'zh-TW': '命盤 → 流月', 'zh-CN': '命盘 → 流月', 'en': 'Charts → Monthly' },
    'ht.lyMonthlyBody': { 'zh-TW': '這是最個人化的一層。開啟每月流月後，每月 1 號會為你生成新一期的解讀並寄到你的信箱，看見當月的重心；解鎖四化後，流月同樣包含完整的四化解讀。你也可以為宮位設定想追蹤的議題，每期的「追蹤議題解析」會持續回應它。', 'zh-CN': '这是最个人化的一层。开启每月流月后，每月 1 号会为你生成新一期的解读并寄到你的邮箱，看见当月的重心；解锁四化后，流月同样包含完整的四化解读。你也可以为宫位设定想追踪的议题，每期的「追踪议题解析」会持续回应它。', 'en': 'This is the most personal layer. Once you turn on monthly readings, a new reading is generated on the 1st of each month and sent to your inbox, showing where that month is focused. After unlocking the four transformations, Monthly includes the full transformation reading too. You can also set a focus you want to track for a palace, and each issue of Your Tracked Focus will keep responding to it.' },
    'ht.lyMonthlyNote': { 'zh-TW': '流月依農曆月份計算，所以每期的適用期間不會剛好是國曆的 1 號到月底。流月頁上會標出實際適用的國曆日期。', 'zh-CN': '流月依农历月份计算，所以每期的适用期间不会刚好是公历的 1 号到月底。流月页上会标出实际适用的公历日期。', 'en': 'Monthly readings follow the lunar calendar, so each period does not run exactly from the 1st to the end of a calendar month. The Monthly page shows the exact dates each reading covers.' },

    // ── 第三步：更進一步 ──
    'ht.s3Label': { 'zh-TW': '第三步', 'zh-CN': '第三步', 'en': 'Step 3' },
    'ht.s3Title': { 'zh-TW': '更進一步', 'zh-CN': '更进一步', 'en': 'Go further' },
    'ht.s3Body':  { 'zh-TW': '四層都看過之後，如果想看得更完整，或有一個想慎重處理的問題，可以從這裡開始。', 'zh-CN': '四层都看过之后，如果想看得更完整，或有一个想慎重处理的问题，可以从这里开始。', 'en': 'After reading all four layers, start here if you want the complete picture, or if you have one question that deserves careful attention.' },
    'ht.xSihuaName':  { 'zh-TW': '解鎖四化', 'zh-CN': '解锁四化', 'en': 'Unlock the four transformations' },
    'ht.xSihuaBody':  { 'zh-TW': '一次解鎖，本命、大限、流年、流月都會加上四化解讀，看懂能量如何流動、該往哪裡使力。', 'zh-CN': '一次解锁，本命、大限、流年、流月都会加上四化解读，看懂能量如何流动、该往哪里使力。', 'en': 'One unlock adds the transformation reading to Natal, Decade, Annual, and Monthly, so you can see how your energy moves and where to put your effort.' },
    'ht.xSihuaCta':   { 'zh-TW': '查看方案', 'zh-CN': '查看方案', 'en': 'View plans' },
    'ht.xSihuaOwned': { 'zh-TW': '你已解鎖全部四化，四層報告都已包含四化解讀。', 'zh-CN': '你已解锁全部四化，四层报告都已包含四化解读。', 'en': 'You have unlocked all four transformations. Every layer already includes them.' },
    'ht.xConsultName': { 'zh-TW': '單獨問事', 'zh-CN': '单独问事', 'en': 'Individual Session' },
    'ht.xConsultBody': { 'zh-TW': '選定主題、說明處境，由 R.S. Chen 親自解讀你的命盤並書面回覆，收到回覆後 7 天內可追問一次。', 'zh-CN': '选定主题、说明处境，由 R.S. Chen 亲自解读你的命盘并书面回复，收到回复后 7 天内可追问一次。', 'en': 'Choose a topic and describe your situation. R.S. Chen reads your chart personally and replies in writing, and you may ask one follow-up within 7 days.' },
    'ht.xConsultCta':  { 'zh-TW': '前往問事', 'zh-CN': '前往问事', 'en': 'Go to consultation' }
  });
</script>

              <li><span class="ht-how-n">3</span><span data-i18n="ht.s1How3"></span></li>

            <div class="ht-card">
              <div class="ht-card-head"><h3 class="ht-card-name" data-i18n="ht.lyDecadeName"></h3></div>

            <div class="ht-card">

<script type="module">
  // 純說明頁:不呼叫 requireAuth(PM 決策 D4,未登入可直達;供 Brevo 再行銷信連入)。
  import { supabase, getSession } from './components.js';

  const F = window.FSI18N;

  // 靜態內容(data-i18n)由 i18n.js 的 applyI18n 自動填入與重譯;此處只補 document.title。
  function applyLangUi() { document.title = F.t('ht.docTitle'); }
  applyLangUi();
  document.addEventListener('DOMContentLoaded', applyLangUi);
  window.addEventListener('i18n:changed', applyLangUi);

  // 單獨問事：CONSULT_ENABLED 明確為 true 才顯示入口，否則顯示「即將推出」(fail-closed)
  const consultOn = !!(window.CFG && window.CFG.CONSULT_ENABLED === true);
  document.getElementById(consultOn ? 'ht-consult-act' : 'ht-consult-soon').hidden = false;

  // 四化：已登入且已解鎖 → 改顯示說明。只讀；未登入或讀取失敗 → 維持「查看方案」。
  (async () => {
    try {
      const session = await getSession();
      if (!session) return;
      const { data, error } = await supabase
        .from('user_profiles').select('sihua_unlocked')
        .eq('id', session.user.id).maybeSingle();
      if (!error && data && data.sihua_unlocked === true) {
        document.getElementById('ht-sihua-act').hidden = true;
        document.getElementById('ht-sihua-owned').hidden = false;
      }
    } catch (e) {
      console.warn('[how-to] sihua check skipped:', e?.message || e);
    }
  })();
</script>
