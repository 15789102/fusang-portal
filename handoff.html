      'hf.workingSub': { 'zh-TW': '請稍候，馬上就好。', 'zh-CN': '请稍候，马上就好。', 'en': 'One moment. This only takes a second.', 'ja': '少々お待ちください。すぐに完了します。', 'ko': '잠시만 기다려 주세요. 곧 끝나요.' },
      'hf.errTitle':   { 'zh-TW': '你的帳號已建立', 'zh-CN': '你的账号已建立', 'en': 'Your account is ready', 'ja': 'アカウント作成済み', 'ko': '계정이 만들어졌어요' },
      'hf.errBody':    {
        'zh-TW': '這個登入連結無法使用。你的帳號與命盤都已建立完成，請以註冊時的電子郵件與密碼登入。',
        'zh-CN': '这个登录链接无法使用。你的账号与命盘都已建立完成，请以注册时的电子邮件与密码登录。',
        'en':    'This sign-in link cannot be used. Your account and chart are both ready, so please log in with the email and password you signed up with.',
        'ja':    'このログインリンクはご利用いただけません。アカウントと命盤はすでに作成されていますので、ご登録時のメールアドレスとパスワードでログインしてください。', 'ko': '이 로그인 링크는 사용할 수 없어요. 계정과 명반은 모두 만들어졌으니, 가입할 때 사용한 이메일과 비밀번호로 로그인해 주세요.'
      },
      'hf.errCta':     { 'zh-TW': '前往登入', 'zh-CN': '前往登录', 'en': 'Go to log in', 'ja': 'ログインへ進む', 'ko': '로그인하러 가기' },
      // v2 版型：左側品牌語
      'hf.craft':      { 'zh-TW': '紫微斗數', 'zh-CN': '紫微斗数', 'en': 'Zi Wei Dou Shu', 'ja': '紫微斗数', 'ko': '자미두수' },
      'hf.introTitle': { 'zh-TW': '歡迎來到 FuSang Vision', 'zh-CN': '欢迎来到 FuSang Vision', 'en': 'Welcome to FuSang Vision', 'ja': 'FuSang Vision へようこそ', 'ko': 'FuSang Vision에 오신 것을 환영해요' },
      'hf.introLead':  { 'zh-TW': '你的帳號已建立，接下來會帶你查看命盤的準備進度。', 'zh-CN': '你的账号已建立，接下来会带你查看命盘的准备进度。', 'en': 'Your account is set up. Next, we will show you how your chart is coming along.', 'ja': 'アカウントが作成されました。続いて、命盤の準備状況をご案内します。', 'ko': '계정이 만들어졌어요. 이제 명반 준비 진행 상황을 보여 드릴게요.' }
    });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FuSang Vision — 登入中</title>

  <!-- v2 視覺（共用版型 §10 公開頁）-->
  <link rel="stylesheet" href="fs-v2.css" />
  <style>
    /* ════════════════════════════════════════════════════════
       handoff — Shopify 註冊後的一次性登入過場頁
       使用者停留約一秒，故：不放 footer、不放語言切換（切完就跳走了）；
       只保留品牌列 + 主視覺 + 卡片（版型在 fs-v2.css §10）。
       ════════════════════════════════════════════════════════ */
    .fs-v2 .hf-state { display: none; }
    .fs-v2 .hf-state.active { display: block; }
    .fs-v2 .hf-spinner {
      width: 32px; height: 32px; margin: 0 0 24px;
      border: 2px solid var(--v2-blue-line); border-top-color: var(--v2-blue); border-radius: 50%;
      animation: hfSpin .85s linear infinite;
    }
    @keyframes hfSpin { to { transform: rotate(360deg); } }
    /* 減少動態：仍保留慢速旋轉（fs-v2.css §7 會關掉動畫，這裡刻意放回，避免看起來像當掉）*/
    @media (prefers-reduced-motion: reduce) { body.fs-v2 .hf-spinner { animation: hfSpin 2.4s linear infinite !important; } }
    .fs-v2 a.v2-auth-submit { text-decoration: none; }
    body.fs-v2 .hf-page { min-height: calc(100svh - 88px); }
    @media (max-width: 899px) { body.fs-v2 .hf-page { min-height: 0; align-content: start; } }
  </style>
</head>
<body class="hf-body fs-v2">

<!-- 品牌列（過場頁：不放語言切換）-->
<header class="v2-auth-bar">
  <span class="v2-auth-brand">
    <img src="assets/fusangvision_trans_graph_only_0706.png" alt="" />
    <span class="v2-auth-brand-name">FuSang Vision</span>
  </span>
</header>

<main class="fs-page v2-auth-stage hf-page" id="fs-main" tabindex="-1">

  <!-- 左：品牌語 -->
  <div class="v2-auth-intro">
    <p class="v2-auth-eyebrow"><span data-i18n="hf.craft">紫微斗數</span> · FuSang Vision</p>
    <h2 class="v2-auth-headline" data-i18n="hf.introTitle">歡迎來到 FuSang Vision</h2>
    <p class="v2-auth-lead" data-i18n="hf.introLead">你的帳號已建立，接下來會帶你查看命盤的準備進度。</p>
  </div>

  <!-- 右：卡片 -->
  <div class="v2-auth-card hf-card">

    <!-- 進行中(預設顯示) -->
    <div class="hf-state active" id="hf-working">
      <div class="hf-spinner" role="status" aria-live="polite"></div>
      <h1 class="v2-auth-title" data-i18n="hf.working">Signing you in…</h1>
      <p class="v2-auth-sub" data-i18n="hf.workingSub">One moment — this only takes a second.</p>
    </div>

    <!-- 失敗 -->
    <div class="hf-state" id="hf-error">
      <p class="v2-auth-card-eyebrow">Sign-in Link</p>
      <h1 class="v2-auth-title" data-i18n="hf.errTitle">Your account is ready</h1>
      <p class="v2-auth-sub" data-i18n="hf.errBody">This sign-in link can't be used.</p>
      <a class="v2-auth-submit" href="login.html" data-i18n="hf.errCta">Go to log in</a>
    </div>

  </div>
</main>

<script type="module">
  // ════════════════════════════════════════════════════════════════
  // handoff — 一次性 token → portal session
  // ════════════════════════════════════════════════════════════════
  //
  // 為什麼需要這一頁：
  //   session 存在 localStorage(supabase-js v2 預設)，而 localStorage 依
  //   origin 隔離 —— fusang-vision.com(Shopify) 與 portal.fusang-vision.com
  //   是兩個不同 origin，Shopify 端無論如何都寫不進 portal 的 session。
  //   故必須讓使用者的瀏覽器實際落在 portal 這個 origin 上，由 portal 自己的
  //   程式碼呼叫 verifyOtp，session 才會寫進 portal 讀得到的那把 key。
  //   這一頁就是那個落點。
  //
  // ⚠ supabase client 必須從 components.js 取(不可在此另外 createClient)——
  //   同一個 client 才會用同一個 storageKey，session 才被 portal 其他頁讀到。
  //
  // URL 契約：
  //   handoff.html?job_id=<uuid>#t=<hashed_token>
  //   · token 放 hash → 不送往伺服器、不進 Referer、不進 GitHub Pages /
  //     Cloudflare 存取日誌
  //   · job_id 放 query → 只是參考編號 UUID，非個資
  //   · email 不放 URL → verifyOtp 成功後由 session 取得，
  //     故 email 完全不跨越 Shopify → portal 的網域邊界
  //
  // 本頁不修改任何既有檔案：login.html / submitted.html / components.js
  // 皆維持原狀（submitted.html 既有的 ?job_id= & ?email= 契約直接沿用）。
  import { supabase } from './components.js';

  const F = window.FSI18N;
  document.title = F.t('hf.docTitle');

  const workingBox = document.getElementById('hf-working');
  const errorBox = document.getElementById('hf-error');

  function showError() {
    workingBox.classList.remove('active');
    errorBox.classList.add('active');
  }

  // ── 讀 token，並「立刻」把 hash 清掉 ────────────────────────────
  //   刻意在驗證之前就清 —— 若排在驗證之後，驗證失敗或網路卡住的那段期間
  //   token 仍留在網址列，可能被使用者複製分享或留進瀏覽歷程。
  //   token 等同一次性登入憑證，能早一刻移除就早一刻移除。
  function takeToken() {
    const hash = window.location.hash || '';
    const m = hash.match(/[#&]t=([^&]+)/);
    const token = m ? decodeURIComponent(m[1]) : null;
    if (hash) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    return token;
  }

  (async () => {
    const token = takeToken();
    const jobId = new URLSearchParams(window.location.search).get('job_id');

    // 失敗一律走同一條路徑，不區分「無 token / 過期 / 已使用」——
    // 對使用者而言處置完全相同（去登入），且不必對外透露 token 狀態。
    if (!token) {
      console.warn('[handoff] no token in URL');
      showError();
      return;
    }

    let session = null;
    try {
      // ⚠ supabase-js v2 的 auth 方法不 throw，錯誤在回傳物件裡 → 顯式檢查。
      const { data, error } = await supabase.auth.verifyOtp({
        token_hash: token,
        type: 'email',
      });
      if (error) throw error;
      session = data?.session ?? null;
    } catch (e) {
      // ⚠ 只記失敗事由，絕不記 token 本身。
      console.warn('[handoff] verifyOtp failed:', e?.message || e);
      showError();
      return;
    }

    if (!session) {
      console.warn('[handoff] verifyOtp returned no session');
      showError();
      return;
    }

    // ── 成功：session 已寫入 portal 的 localStorage ────────────────
    //   email 由 session 取得（不從 URL 帶），再交給 submitted.html 顯示。
    const email = session.user?.email ?? '';

    const params = new URLSearchParams();
    // 決策 5-A 的延續：只在有值時帶入，避免 "null" 字串繞過下游 falsy 守衛。
    if (jobId) params.set('job_id', jobId);
    if (email) params.set('email', email);

    const qs = params.toString();
    window.location.replace('submitted.html' + (qs ? '?' + qs : ''));
  })();
</script>

<script type="module" src="components.js"></script>

</body>
</html>
