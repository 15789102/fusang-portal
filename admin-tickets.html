<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="config.js"></script>
<script src="i18n.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>扶桑晨曦 · 單獨問事</title>
<style>
  /* tokens / topbar / 狀態面板由 admin-common.js 提供 */

  /* 篩選列 */
  .filterbar{ margin-bottom:16px; display:flex; flex-direction:column; gap:10px; }
  .fbar-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .search-input{
    flex:1 1 220px; min-width:180px;
    border:1px solid var(--hair-strong); border-radius:var(--radius-sm);
    padding:9px 14px; font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
  }
  .search-input:focus-visible{ outline:2px solid var(--dawn); outline-offset:1px; border-color:var(--dawn); }
  .sel{
    border:1px solid var(--hair-strong); border-radius:var(--radius-sm);
    padding:9px 12px; font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface); cursor:pointer;
  }
  .sel:focus-visible{ outline:2px solid var(--dawn); outline-offset:1px; }
  .date-sep{ color:var(--faint); }
  .chip{
    border:1px solid var(--hair-strong); background:var(--surface); color:var(--muted);
    padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:500; transition:all .15s ease; user-select:none;
  }
  .chip:hover{ border-color:var(--dawn); color:var(--dawn); }
  .chip.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .chip:focus-visible{ outline:2px solid var(--dawn); outline-offset:2px; }
  .more-toggle, .clear-btn{
    border:1px solid var(--hair-strong); background:var(--surface); color:var(--muted);
    padding:7px 14px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:500; transition:all .15s ease;
  }
  .more-toggle:hover, .clear-btn:hover{ border-color:var(--dawn); color:var(--dawn); }
  .autoclose-btn{
    border:1px solid var(--hair-strong); background:var(--surface); color:var(--muted);
    padding:7px 14px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:500; transition:all .15s ease; margin-left:auto;
  }
  .autoclose-btn:hover:not(:disabled){ border-color:var(--wait); color:var(--wait); }
  .autoclose-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .autoclose-msg{ font-size:12px; color:var(--muted); }
  .autoclose-msg.ok{ color:var(--ok); }
  .autoclose-msg.err{ color:var(--fail); }
  .more-panel{
    display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end;
    padding:16px; background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius-sm);
  }
  .more-field{ display:flex; flex-direction:column; gap:6px; }
  .more-field > label{ font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .consent-check{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); cursor:pointer; }
  .consent-check input{ width:15px; height:15px; accent-color:var(--dawn); cursor:pointer; }

  /* 統計條 */
  .stats{
    display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;
    margin-bottom:18px; padding:12px 16px;
    background:var(--surface); border:1px solid var(--hair); border-radius:var(--radius-sm); box-shadow:var(--shadow);
  }
  .stat-total{ font-size:14px; color:var(--ink); }
  .stat-total strong{ font-size:17px; color:var(--dawn); font-feature-settings:"tnum" 1; }
  .stat-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .stat-glabel{ font-size:10.5px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase; }
  .stat-chip{
    font-size:12px; color:var(--muted); background:#F4F5F7; padding:3px 10px; border-radius:999px;
    font-feature-settings:"tnum" 1;
  }

  /* ticket 卡 */
  .tk-list{display:flex;flex-direction:column;gap:12px;}
  .tk{
    background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .tk.is-action{border-color:var(--dawn);}
  .tk-head{
    display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;
    transition:background .15s ease;
  }
  .tk-head:hover{background:#FBFBFC;}
  .tk-dot{
    flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:transparent;
  }
  .tk.is-action .tk-dot{background:var(--dawn);}
  .tk-subject{font-weight:600;font-size:14px;flex:0 0 auto;}
  .tk-ref{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace;flex:0 0 auto;}
  .tk-email{
    color:var(--muted);font-size:13px;flex:1 1 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tk-date{font-size:11.5px;color:var(--faint);flex:0 0 auto;font-feature-settings:"tnum" 1;}
  .tk-chevron{flex:0 0 auto;color:var(--faint);transition:transform .2s ease;}
  .tk.is-open .tk-chevron{transform:rotate(90deg);}

  .tk-body{display:none;padding:0 18px 18px;border-top:1px solid var(--hair);}
  .tk.is-open .tk-body{display:block;}

  .seg{margin-top:16px;}
  .seg-label{
    font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin-bottom:7px;
  }
  .seg-text{
    font-size:14px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  }
  .seg-meta{font-size:11.5px;color:var(--faint);margin-top:6px;}
  .seg-box{
    background:var(--gold-soft);border:1px solid #ECD9B0;border-radius:var(--radius-sm);
    padding:13px 15px;
  }
  .seg-box.q{background:#F4F5F7;border-color:var(--hair-strong);}

  .meta-row{
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--hair-strong);
    font-size:12px;color:var(--muted);
  }
  .meta-row code{font-size:11px;color:var(--faint);background:#F4F5F7;padding:2px 6px;border-radius:4px;}

  /* 回覆框 */
  .reply{margin-top:18px;}
  textarea.reply-input{
    width:100%;min-height:120px;border:1px solid var(--hair-strong);border-radius:var(--radius-sm);
    padding:12px 14px;font-family:inherit;font-size:14px;line-height:1.75;color:var(--ink);
    background:var(--surface);resize:vertical;
  }
  textarea.reply-input:focus-visible{outline:2px solid var(--dawn);outline-offset:1px;border-color:var(--dawn);}
  .reply-actions{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .btn-send{
    border:none;background:var(--dawn);color:#fff;font-weight:600;font-size:13.5px;
    padding:10px 20px;border-radius:var(--radius-sm);transition:filter .15s ease;
  }
  .btn-send:hover:not(:disabled){filter:brightness(.94);}
  .btn-send:disabled{opacity:.45;cursor:not-allowed;}
  .reply-hint{font-size:12px;color:var(--faint);}
  .reply-msg{font-size:12.5px;display:none;padding:8px 12px;border-radius:6px;margin-top:10px;}
  .reply-msg.show{display:block;}
  .reply-msg.err{background:var(--fail-soft);color:var(--fail);}
  .reply-msg.ok{background:var(--ok-soft);color:var(--ok);}

  /* 狀態膠囊 */
  .st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;flex:0 0 auto;}
  .st .dot{width:6px;height:6px;border-radius:50%;}
  .st-paid{background:var(--dawn-soft);color:var(--dawn);} .st-paid .dot{background:var(--dawn);}
  .st-followup{background:var(--wait-soft);color:var(--wait);} .st-followup .dot{background:var(--wait);}
  .st-answered{background:var(--ok-soft);color:var(--ok);} .st-answered .dot{background:var(--ok);}
  .st-closed{background:#F0F1F3;color:var(--faint);} .st-closed .dot{background:var(--faint);}

  .note{
    font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:14px;
    padding:10px 14px;background:#F4F5F7;border-radius:var(--radius-sm);
  }
  .note strong{color:var(--ink);}

  /* 關閉此單 */
  .close-block{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--hair-strong); }
  .close-toggle{
    border:1px solid var(--hair-strong); background:var(--surface); color:var(--fail);
    padding:7px 14px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:500; transition:all .15s ease;
  }
  .close-toggle:hover{ border-color:var(--fail); background:var(--fail-soft); }
  .close-form{ margin-top:12px; }
  .close-actions{ display:flex; gap:10px; margin-top:10px; }
  .btn-close-confirm{
    border:none; background:var(--fail); color:#fff; font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:var(--radius-sm); transition:filter .15s ease;
  }
  .btn-close-confirm:hover:not(:disabled){ filter:brightness(.94); }
  .btn-close-confirm:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-close-cancel{
    border:1px solid var(--hair-strong); background:var(--surface); color:var(--muted);
    font-size:13px; padding:9px 16px; border-radius:var(--radius-sm);
  }
  .close-msg{ font-size:12.5px; display:none; padding:8px 12px; border-radius:6px; margin-top:10px; }
  .close-msg.show{ display:block; }
  .close-msg.err{ background:var(--fail-soft); color:var(--fail); }
  .close-msg.ok{ background:var(--ok-soft); color:var(--ok); }

  /* admin 關閉顯示 */
  .cancel-shown{
    margin-top:14px; padding:14px 16px;
    background:var(--fail-soft); border:1px solid #F0C9C9; border-radius:var(--radius-sm);
  }
  .cancel-reason{ font-size:14px; line-height:1.75; color:var(--ink); white-space:pre-wrap; word-break:break-word; margin-top:4px; }

  /* 客戶資料區塊 */
  .cust{
    margin-top:16px;padding:14px 16px;
    background:var(--dawn-soft);border:1px solid #F2D3CC;border-radius:var(--radius-sm);
  }
  .cust-lang{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--dawn);color:#fff;font-weight:700;font-size:12px;
    padding:4px 12px;border-radius:999px;margin-bottom:10px;letter-spacing:.02em;
  }
  .cust-lang .lbl{font-weight:500;opacity:.85;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;}
  .cust-grid{
    display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--ink);
  }
  .cust-grid .k{color:var(--muted);font-size:11.5px;margin-right:5px;}
  .cust-grid .v{font-feature-settings:"tnum" 1;}

  /* 客戶回饋 */
  .fb{
    margin-top:16px;padding:14px 16px;
    background:#F4F5F7;border:1px solid var(--hair);border-radius:var(--radius-sm);
  }
  .fb-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .fb-rating{
    display:inline-flex;align-items:center;gap:6px;
    font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px;
  }
  .fb-rating.r-good{background:var(--ok-soft);color:var(--ok);}
  .fb-rating.r-mid{background:var(--wait-soft);color:var(--wait);}
  .fb-rating.r-low{background:var(--fail-soft);color:var(--fail);}
  .fb-consent-tag{
    font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;
    background:var(--dawn-soft);color:var(--dawn);
  }
  .fb-consent-no{
    font-size:11px;padding:3px 10px;border-radius:999px;
    background:#F0F1F3;color:var(--faint);
  }
  .fb-text{font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .fb-empty{font-size:12.5px;color:var(--faint);}
</style>
</head>
<body>

  <main class="fa-wrap">
    <div class="fa-page-head">
      <h1 class="fa-page-title">單獨問事</h1>
      <p class="fa-page-sub">客戶諮詢工單 · 首覆 / 追問 / 結案</p>
    </div>

    <div class="filterbar" id="filterbar">
      <div class="fbar-row">
        <input type="text" id="f-email" class="search-input" placeholder="搜尋 Email 或諮詢編號…" autocomplete="off" />
        <select id="f-time" class="sel">
          <option value="all">全部時間</option>
          <option value="7d">近 7 天</option>
          <option value="30d">近 30 天</option>
          <option value="90d">近 90 天</option>
          <option value="custom">自訂區間…</option>
        </select>
      </div>
      <div class="fbar-row date-row fa-hidden" id="date-row">
        <input type="date" id="f-from" class="sel" />
        <span class="date-sep">→</span>
        <input type="date" id="f-to" class="sel" />
      </div>
      <div class="fbar-row" id="status-chips">
        <span class="chip" data-status="paid" tabindex="0">待首覆</span>
        <span class="chip" data-status="answered" tabindex="0">已首覆</span>
        <span class="chip" data-status="followup" tabindex="0">追問待覆</span>
        <span class="chip" data-status="closed" tabindex="0">已結案</span>
      </div>
      <div class="fbar-row">
        <button class="more-toggle" id="more-toggle" type="button">更多篩選 ▾</button>
        <button class="clear-btn" id="clear-btn" type="button">清除篩選</button>
        <button class="autoclose-btn" id="autoclose-btn" type="button">處理逾期結案</button>
        <span class="autoclose-msg" id="autoclose-msg"></span>
      </div>
      <div class="more-panel fa-hidden" id="more-panel">
        <div class="more-field">
          <label>主題</label>
          <select id="f-subject" class="sel">
            <option value="all">全部主題</option>
            <option value="career">事業與工作</option>
            <option value="relationship">感情與關係</option>
            <option value="wealth">財運與理財</option>
            <option value="family">人際與家庭</option>
            <option value="self">自我與方向</option>
            <option value="other">其他／綜合</option>
          </select>
        </div>
        <div class="more-field">
          <label>建議語言</label>
          <select id="f-lang" class="sel">
            <option value="all">全部語言</option>
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="more-field">
          <label>性別</label>
          <select id="f-gender" class="sel">
            <option value="all">全部</option>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="more-field">
          <label>回饋</label>
          <div class="chip-row" id="rating-chips">
            <span class="chip" data-rating="none" tabindex="0">未回饋</span>
            <span class="chip" data-rating="helpful" tabindex="0">有幫助</span>
            <span class="chip" data-rating="somewhat" tabindex="0">還好</span>
            <span class="chip" data-rating="not_helpful" tabindex="0">沒有幫助</span>
          </div>
        </div>
        <label class="consent-check"><input type="checkbox" id="f-consent" /> 僅顯示同意引用</label>
        <label class="consent-check"><input type="checkbox" id="f-admin-closed" /> 僅顯示 admin 關閉</label>
      </div>
    </div>

    <div class="stats fa-hidden" id="stats"></div>

    <div id="loadState" class="fa-state fa-hidden">
      <div class="fa-spinner"></div>
      <div class="fa-state-title">讀取中…</div>
    </div>
    <div id="emptyState" class="fa-state fa-hidden">
      <div class="fa-state-title">目前沒有工單</div>
      <div id="emptyHint">沒有符合條件的諮詢。</div>
    </div>
    <div id="errorState" class="fa-state is-error fa-hidden">
      <div class="fa-state-title">讀取失敗</div>
      <div id="errorMsg"></div>
    </div>

    <div class="tk-list" id="list"></div>
  </main>

  <script type="module">
    import { supabase, initAdmin } from './admin-common.js';

    const $ = (id) => document.getElementById(id);
    const FOLLOWUP_DAYS = 7;

    const SUBJECT_LABEL = {
      career:'事業與工作', relationship:'感情與關係', wealth:'財運與理財',
      family:'人際與家庭', self:'自我與方向', other:'其他／綜合',
    };
    const STATUS = {
      paid:     { cls:'st-paid',     label:'待首覆' },
      answered: { cls:'st-answered', label:'已首覆' },
      followup: { cls:'st-followup', label:'追問待覆' },
      closed:   { cls:'st-closed',   label:'已結案' },
    };
    const LANG_LABEL = { 'zh-TW':'繁體中文', 'zh-CN':'简体中文', 'en':'English' };
    const GENDER_LABEL = { male:'男', female:'女' };
    const RATING_LABEL = { helpful:'有幫助', somewhat:'還好', not_helpful:'沒有幫助' };
    const RATING_CLS   = { helpful:'r-good', somewhat:'r-mid', not_helpful:'r-low' };

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDT = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso); if (isNaN(d)) return '—';
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };
    const fmtD = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso); if (isNaN(d)) return '—';
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    };
    const inFollowupWindow = (t) =>
      t.status === 'answered' && t.answered_at &&
      new Date(t.answered_at).getTime() + FOLLOWUP_DAYS*864e5 > Date.now();

    let allTickets = [];
    let openIds = new Set();   // 保留展開狀態跨重載

    // 篩選狀態
    const F = {
      email: '', time: 'all', from: '', to: '',
      statuses: new Set(), subject: 'all', lang: 'all', gender: 'all',
      ratings: new Set(), consentOnly: false, adminClosedOnly: false,
    };

    async function load(){
      $('loadState').classList.remove('fa-hidden');
      $('emptyState').classList.add('fa-hidden');
      $('errorState').classList.add('fa-hidden');
      $('list').innerHTML = '';
      $('stats').classList.add('fa-hidden');

      const { data, error } = await supabase.rpc('admin_list_tickets', { p_filter: 'all' });
      $('loadState').classList.add('fa-hidden');

      if (error){
        $('errorMsg').textContent = error.message || String(error);
        $('errorState').classList.remove('fa-hidden');
        return;
      }
      allTickets = data || [];
      apply();
    }

    const ratingBucket = (t) => t.rating || 'none';

    // 搜尋比對：email 或 ticket id 片段（客戶報的諮詢編號）
    function matchSearch(t, q){
      const s = q.toLowerCase();
      return String(t.user_email || '').toLowerCase().includes(s)
          || String(t.id || '').toLowerCase().includes(s);
    }

    function matchTime(t){
      if (F.time === 'all') return true;
      const created = new Date(t.created_at).getTime();
      if (F.time === 'custom'){
        if (F.from && created < new Date(F.from + 'T00:00:00').getTime()) return false;
        if (F.to   && created > new Date(F.to   + 'T23:59:59').getTime()) return false;
        return true;
      }
      const days = F.time === '7d' ? 7 : F.time === '30d' ? 30 : 90;
      return created >= Date.now() - days * 864e5;
    }

    function apply(){
      const filtered = allTickets.filter((t) => {
        if (F.email && !matchSearch(t, F.email)) return false;
        if (!matchTime(t)) return false;
        if (F.statuses.size && !F.statuses.has(t.status)) return false;
        if (F.subject !== 'all' && t.subject !== F.subject) return false;
        if (F.lang !== 'all' && t.cust_lang !== F.lang) return false;
        if (F.gender !== 'all' && t.gender !== F.gender) return false;
        if (F.ratings.size && !F.ratings.has(ratingBucket(t))) return false;
        if (F.consentOnly && t.feedback_consent !== true) return false;
        if (F.adminClosedOnly && t.closed_by_admin !== true) return false;
        return true;
      });

      renderStats(filtered);
      renderList(filtered);

      if (!filtered.length){
        $('emptyHint').textContent = allTickets.length ? '沒有符合條件的工單。' : '尚無任何已付款諮詢。';
        $('emptyState').classList.remove('fa-hidden');
      } else {
        $('emptyState').classList.add('fa-hidden');
      }
    }

    function renderStats(rows){
      const s = $('stats');
      s.classList.remove('fa-hidden');

      const byStatus = { paid:0, answered:0, followup:0, closed:0 };
      const bySubject = {};
      const byRating = { helpful:0, somewhat:0, not_helpful:0, none:0 };
      rows.forEach((t) => {
        if (byStatus[t.status] !== undefined) byStatus[t.status]++;
        bySubject[t.subject] = (bySubject[t.subject] || 0) + 1;
        byRating[ratingBucket(t)]++;
      });

      const statusChips = ['paid','answered','followup','closed']
        .filter((k) => byStatus[k])
        .map((k) => `<span class="stat-chip">${STATUS[k].label} ${byStatus[k]}</span>`).join('');
      const subjChips = Object.keys(bySubject)
        .map((k) => `<span class="stat-chip">${SUBJECT_LABEL[k] || k} ${bySubject[k]}</span>`).join('');
      const rated = byRating.helpful + byRating.somewhat + byRating.not_helpful;
      const ratingChips = rated
        ? ['helpful','somewhat','not_helpful'].filter((k) => byRating[k])
            .map((k) => `<span class="stat-chip">${RATING_LABEL[k]} ${byRating[k]}</span>`).join('')
        : '';

      s.innerHTML =
        `<div class="stat-total">符合 <strong>${rows.length}</strong> 筆</div>` +
        (statusChips ? `<div class="stat-group"><span class="stat-glabel">狀態</span>${statusChips}</div>` : '') +
        (subjChips ? `<div class="stat-group"><span class="stat-glabel">主題</span>${subjChips}</div>` : '') +
        (ratingChips ? `<div class="stat-group"><span class="stat-glabel">回饋</span>${ratingChips}</div>` : '');
    }

    function renderList(rows){
      const list = $('list');
      list.innerHTML = '';
      rows.forEach(t => list.appendChild(renderTicket(t)));
    }

    function renderTicket(t){
      const wrap = document.createElement('div');
      wrap.className = 'tk' + (t.needs_action ? ' is-action' : '') + (openIds.has(t.id) ? ' is-open' : '');
      const st = STATUS[t.status] || { cls:'st-closed', label:t.status };

      wrap.innerHTML = `
        <div class="tk-head">
          <span class="tk-dot"></span>
          <span class="tk-subject">${esc(SUBJECT_LABEL[t.subject] || t.subject)}</span>
          <span class="tk-ref">#${esc(String(t.id).slice(0,8))}</span>
          <span class="tk-email" title="${esc(t.user_email)}">${esc(t.user_email)}</span>
          <span class="st ${st.cls}"><span class="dot"></span>${st.label}</span>
          <span class="tk-date">${fmtD(t.created_at)}</span>
          <svg class="tk-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="tk-body">${renderBody(t)}</div>`;

      const head = wrap.querySelector('.tk-head');
      head.addEventListener('click', () => {
        wrap.classList.toggle('is-open');
        if (wrap.classList.contains('is-open')) openIds.add(t.id); else openIds.delete(t.id);
      });

      bindReply(wrap, t);
      bindClose(wrap, t);
      return wrap;
    }

    function renderBody(t){
      let h = '';

      // 客戶資料（建議語言 + 出生資訊）
      h += renderCust(t);

      // 客戶原問題
      h += `<div class="seg"><div class="seg-label">客戶問題</div>` +
           `<div class="seg-text">${esc(t.content)}</div>` +
           `<div class="seg-meta">提交於 ${fmtDT(t.created_at)}</div></div>`;

      // 首覆內容（已覆才有）
      if (t.answer){
        h += `<div class="seg"><div class="seg-label">首覆</div>` +
             `<div class="seg-box"><div class="seg-text">${esc(t.answer)}</div></div>` +
             `<div class="seg-meta">回覆於 ${fmtDT(t.answered_at)}</div></div>`;
      }

      // 追問
      if (t.followup_question){
        h += `<div class="seg"><div class="seg-label">客戶追問</div>` +
             `<div class="seg-box q"><div class="seg-text">${esc(t.followup_question)}</div></div>` +
             `<div class="seg-meta">提交於 ${fmtDT(t.followup_at)}</div></div>`;
      }

      // 再覆
      if (t.followup_answer){
        h += `<div class="seg"><div class="seg-label">再覆（結案）</div>` +
             `<div class="seg-box"><div class="seg-text">${esc(t.followup_answer)}</div></div>` +
             `<div class="seg-meta">回覆於 ${fmtDT(t.followup_answered_at)}</div></div>`;
      }

      // 操作區（依狀態）
      if (t.status === 'paid'){
        h += replyForm(t.id, 'first', '撰寫首覆', '送出首覆');
      } else if (t.status === 'followup'){
        h += replyForm(t.id, 'second', '撰寫再覆（送出後結案）', '送出再覆並結案');
      } else if (t.status === 'answered'){
        const deadline = t.answered_at
          ? fmtD(new Date(new Date(t.answered_at).getTime() + FOLLOWUP_DAYS*864e5).toISOString())
          : '—';
        h += inFollowupWindow(t)
          ? `<div class="note">已首覆。客戶可於 <strong>${deadline}</strong> 前追問一次；逾期自動結案，無需處理。</div>`
          : `<div class="note">已首覆，追問窗（至 ${deadline}）已過，客戶未追問。此諮詢視為完成。</div>`;
      } else if (t.status === 'closed'){
        if (t.closed_by_admin){
          h += `<div class="cancel-shown"><div class="seg-label">已由管理者關閉</div>` +
               `<div class="cancel-reason">${esc(t.close_reason || '（未填原因）')}</div>` +
               `<div class="seg-meta">關閉於 ${fmtDT(t.closed_at)}</div></div>`;
        } else {
          h += `<div class="note">本諮詢已結案。</div>`;
          h += renderFeedback(t);
        }
      }

      // 關閉此單（未結案才可）
      if (t.status !== 'closed'){
        h += closeBlock(t.id);
      }

      // 技術 meta
      h += `<div class="meta-row"><span>命盤 <code>${esc(t.chart_session_id || '—')}</code></span>` +
           `<span>付款 <code>${esc(t.stripe_session_id || '—')}</code></span></div>`;

      return h;
    }

    function closeBlock(id){
      return `<div class="close-block" data-close="${id}">
        <button class="close-toggle" type="button">關閉此單…</button>
        <div class="close-form fa-hidden">
          <div class="seg-label">關閉原因（客戶會收到此說明）</div>
          <textarea class="reply-input close-reason-input" placeholder="說明關閉原因，例如：此問題超出紫微斗數命理諮詢範圍，款項將於數個工作天內退回。如有疑問請與我們聯繫。"></textarea>
          <div class="close-actions">
            <button class="btn-close-confirm" type="button" disabled>確認關閉並通知客戶</button>
            <button class="btn-close-cancel" type="button">取消</button>
          </div>
          <div class="close-msg"></div>
        </div>
      </div>`;
    }

    function renderCust(t){
      const lang = t.cust_lang || null;
      const langName = LANG_LABEL[lang] || lang || '未設定';

      // 出生日期時間
      let birth = '—';
      if (t.birth_year){
        const mm = String(t.birth_month ?? 0).padStart(2,'0');
        const dd = String(t.birth_day ?? 0).padStart(2,'0');
        const hh = String(t.birth_hour ?? 0).padStart(2,'0');
        const mi = String(t.birth_minute ?? 0).padStart(2,'0');
        birth = `${t.birth_year}/${mm}/${dd} ${hh}:${mi}`;
      }
      const gender = GENDER_LABEL[t.gender] || t.gender || '—';
      const place = [t.birth_city, t.birth_country].filter(Boolean).join(', ') || '—';
      const tz = t.birth_timezone || '—';
      const name = t.cust_name || '—';

      const items = [
        ['姓名', name],
        ['生日', birth],
        ['性別', gender],
        ['出生地', place],
        ['時區', tz],
      ].map(([k,v]) => `<span><span class="k">${k}</span><span class="v">${esc(v)}</span></span>`).join('');

      return `<div class="cust">
        <div class="cust-lang"><span class="lbl">建議回覆語言</span>${esc(langName)}</div>
        <div class="cust-grid">${items}</div>
      </div>`;
    }

    function renderFeedback(t){
      if (!t.rating){
        return `<div class="fb"><div class="seg-label">客戶回饋</div><div class="fb-empty">客戶尚未提供回饋。</div></div>`;
      }
      const rlabel = RATING_LABEL[t.rating] || t.rating;
      const rcls = RATING_CLS[t.rating] || '';
      const consentTag = t.feedback_consent
        ? `<span class="fb-consent-tag">✓ 同意匿名引用</span>`
        : `<span class="fb-consent-no">未同意引用</span>`;
      const textPart = t.feedback
        ? `<div class="fb-text">${esc(t.feedback)}</div>`
        : `<div class="fb-empty">（未留言）</div>`;
      return `<div class="fb">
        <div class="seg-label">客戶回饋</div>
        <div class="fb-head">
          <span class="fb-rating ${rcls}">${esc(rlabel)}</span>
          ${consentTag}
        </div>
        ${textPart}
      </div>`;
    }

    function replyForm(id, kind, placeholder, btnLabel){
      return `<div class="reply" data-reply="${kind}">
        <div class="seg-label">${esc(placeholder)}</div>
        <textarea class="reply-input" placeholder="在此撰寫回覆…"></textarea>
        <div class="reply-actions">
          <button class="btn-send" disabled>${esc(btnLabel)}</button>
          <span class="reply-hint">送出後將寄送 Email 通知客戶</span>
        </div>
        <div class="reply-msg"></div>
      </div>`;
    }

    function bindReply(wrap, t){
      const box = wrap.querySelector('.reply');
      if (!box) return;
      const kind = box.getAttribute('data-reply');
      const input = box.querySelector('.reply-input');
      const btn = box.querySelector('.btn-send');
      const msg = box.querySelector('.reply-msg');

      const refresh = () => { btn.disabled = input.value.trim().length < 1; };
      input.addEventListener('input', refresh);
      refresh();

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        msg.className = 'reply-msg';
        const answer = input.value.trim();
        const rpc = kind === 'first' ? 'admin_answer_ticket' : 'admin_answer_followup';

        const { error } = await supabase.rpc(rpc, { p_ticket_id: t.id, p_answer: answer });
        if (error){
          msg.textContent = mapErr(error.message || '');
          msg.classList.add('show','err');
          refresh();
          return;
        }

        // best-effort：寄信通知客戶（失敗不影響已完成的回覆）
        const notifyEvent = kind === 'first' ? 'answered' : 'closed';
        try {
          await supabase.functions.invoke('notify-ticket', {
            body: { event: notifyEvent, ticket_id: t.id },
          });
        } catch (e) {
          console.warn('[notify-ticket] 通知寄送失敗（不影響回覆）：', e);
        }

        msg.textContent = '已送出。';
        msg.classList.add('show','ok');
        openIds.add(t.id);          // 重載後保持展開
        setTimeout(load, 600);
      });
    }

    function bindClose(wrap, t){
      const block = wrap.querySelector('.close-block');
      if (!block) return;
      const toggle = block.querySelector('.close-toggle');
      const form = block.querySelector('.close-form');
      const input = block.querySelector('.close-reason-input');
      const confirm = block.querySelector('.btn-close-confirm');
      const cancel = block.querySelector('.btn-close-cancel');
      const msg = block.querySelector('.close-msg');

      toggle.addEventListener('click', () => {
        form.classList.toggle('fa-hidden');
        toggle.classList.toggle('open');
      });
      cancel.addEventListener('click', () => {
        form.classList.add('fa-hidden');
        toggle.classList.remove('open');
      });
      input.addEventListener('input', () => { confirm.disabled = input.value.trim().length < 1; });

      confirm.addEventListener('click', async () => {
        confirm.disabled = true;
        msg.className = 'close-msg';
        const reason = input.value.trim();

        const { error } = await supabase.rpc('admin_close_ticket', { p_ticket_id: t.id, p_reason: reason });
        if (error){
          msg.textContent = mapCloseErr(error.message || '');
          msg.classList.add('show','err');
          confirm.disabled = false;
          return;
        }

        // best-effort：寄關閉通知信給客戶
        try {
          await supabase.functions.invoke('notify-ticket', { body: { event: 'cancelled', ticket_id: t.id } });
        } catch (e) {
          console.warn('[notify-ticket] 關閉通知寄送失敗（不影響關閉）：', e);
        }

        msg.textContent = '已關閉並通知客戶。';
        msg.classList.add('show','ok');
        openIds.add(t.id);
        setTimeout(load, 700);
      });
    }

    function mapCloseErr(m){
      if (m.includes('not_admin'))       return '權限不足。';
      if (m.includes('already_closed'))  return '此工單已結案，將重新整理。';
      if (m.includes('empty_reason'))    return '請填寫關閉原因。';
      if (m.includes('ticket_not_found')) return '找不到此工單。';
      return '關閉失敗，請稍後再試。';
    }

    function mapErr(m){
      if (m.includes('not_admin'))      return '權限不足。';
      if (m.includes('not_answerable')) return '此工單目前無法回覆（狀態已變更），將重新整理。';
      if (m.includes('ticket_not_found')) return '找不到此工單。';
      if (m.includes('empty_answer'))   return '請填寫回覆內容。';
      return '送出失敗，請稍後再試。';
    }

    function toggleChip(set, val, chip){
      if (set.has(val)){ set.delete(val); chip.classList.remove('on'); }
      else { set.add(val); chip.classList.add('on'); }
    }

    function bindFilters(){
      $('f-email').addEventListener('input', (e) => { F.email = e.target.value.trim(); apply(); });
      $('f-time').addEventListener('change', (e) => {
        F.time = e.target.value;
        $('date-row').classList.toggle('fa-hidden', F.time !== 'custom');
        apply();
      });
      $('f-from').addEventListener('change', (e) => { F.from = e.target.value; apply(); });
      $('f-to').addEventListener('change', (e) => { F.to = e.target.value; apply(); });
      $('f-subject').addEventListener('change', (e) => { F.subject = e.target.value; apply(); });
      $('f-lang').addEventListener('change', (e) => { F.lang = e.target.value; apply(); });
      $('f-gender').addEventListener('change', (e) => { F.gender = e.target.value; apply(); });
      $('f-consent').addEventListener('change', (e) => { F.consentOnly = e.target.checked; apply(); });
      $('f-admin-closed').addEventListener('change', (e) => { F.adminClosedOnly = e.target.checked; apply(); });

      document.querySelectorAll('#status-chips .chip').forEach((c) => {
        const act = () => { toggleChip(F.statuses, c.dataset.status, c); apply(); };
        c.addEventListener('click', act);
        c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
      });
      document.querySelectorAll('#rating-chips .chip').forEach((c) => {
        const act = () => { toggleChip(F.ratings, c.dataset.rating, c); apply(); };
        c.addEventListener('click', act);
        c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
      });

      $('more-toggle').addEventListener('click', () => { $('more-panel').classList.toggle('fa-hidden'); });
      $('clear-btn').addEventListener('click', clearFilters);
      $('autoclose-btn').addEventListener('click', runAutoClose);
    }

    async function runAutoClose(){
      const btn = $('autoclose-btn');
      const msg = $('autoclose-msg');
      btn.disabled = true;
      msg.className = 'autoclose-msg';
      msg.textContent = '處理中…';

      const { data, error } = await supabase.rpc('auto_close_expired');
      if (error){
        msg.className = 'autoclose-msg err';
        msg.textContent = (error.message || '').includes('not_admin') ? '權限不足。' : '處理失敗，請稍後再試。';
        btn.disabled = false;
        return;
      }

      const count = data?.closed_count || 0;
      const ids = Array.isArray(data?.ticket_ids) ? data.ticket_ids : [];

      // 對每筆結案的 ticket 補發感謝信（best-effort，無 followup_answer → 純祝福版）
      let sent = 0;
      for (const id of ids){
        try {
          await supabase.functions.invoke('notify-ticket', { body: { event: 'closed', ticket_id: id } });
          sent++;
        } catch (e) {
          console.warn('[notify-ticket] 逾期結案感謝信寄送失敗：', id, e);
        }
      }

      msg.className = 'autoclose-msg ok';
      msg.textContent = count
        ? `已結案 ${count} 筆，感謝信已送出 ${sent} 封。`
        : '沒有逾期待結案的工單。';
      btn.disabled = false;
      if (count) setTimeout(load, 800);   // 重載清單反映新狀態
    }

    function clearFilters(){
      F.email = ''; F.time = 'all'; F.from = ''; F.to = '';
      F.statuses.clear(); F.subject = 'all'; F.lang = 'all'; F.gender = 'all';
      F.ratings.clear(); F.consentOnly = false; F.adminClosedOnly = false;
      $('f-email').value = ''; $('f-time').value = 'all'; $('f-from').value = ''; $('f-to').value = '';
      $('f-subject').value = 'all'; $('f-lang').value = 'all'; $('f-gender').value = 'all';
      $('f-consent').checked = false;
      $('f-admin-closed').checked = false;
      $('date-row').classList.add('fa-hidden');
      document.querySelectorAll('.chip.on').forEach((c) => c.classList.remove('on'));
      apply();
    }

    (async function init(){
      const ok = await initAdmin('tickets');
      if (!ok) return;
      bindFilters();
      await load();
    })();
  </script>
</body>
</html>
