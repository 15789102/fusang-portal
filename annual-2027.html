<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="y27-i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 年報 - FuSang Vision</title>
<link rel="stylesheet" href="fs-v2.css" />
<!--
  PT-006 2027 專區 + 年報索取入口（A 版版面：2026-10-17）
  - 版面：hero 內含索取按鈕 → 介紹 → 三張卡片（年報會告訴你）→ 三步驟（怎麼做出來的）→ 頁尾索取區
  - 狀態：loading → idle（未索取）/ done（已索取）/ error（可重試）；hero 與頁尾兩處同步
  - 讀取：annual_report_requests（RLS 只讀自己）
  - 索取：RPC request_annual_report(2027, uiLang)，冪等；created=true 才呼叫 EF notify-annual-request
  - 通知寄送失敗不影響索取結果
-->
<style>
  body.y27-page.fs-v2 { background: #ffffff; }
  .fs-v2 .y27-wrap { width: calc(100% - 2 * var(--v2-gutter)); max-width: var(--v2-max); margin: 0 auto; padding: 32px 0 96px; }

  /* ── hero（含索取按鈕）── */
  .fs-v2 .y27-hero {
    position: relative; margin: 0 0 56px; padding: 48px; overflow: hidden;
    background: #ffffff url('assets/v2/banner.webp') center / cover no-repeat;
  }
  .fs-v2 .y27-eyebrow { margin: 0 0 8px; font-family: var(--v2-font-latin); font-size: 12px; line-height: 20px; text-transform: uppercase; color: var(--v2-muted); }
  .fs-v2 .y27-title { margin: 0 0 8px; font-family: var(--v2-font-cjk); font-size: 40px; line-height: 56px; font-weight: 500; color: var(--v2-ink); }
  .fs-v2 .y27-sub { max-width: 560px; margin: 0 0 28px; font-family: var(--v2-font-cjk); font-size: 16px; line-height: 29px; color: var(--v2-muted); }
  .fs-v2 .y27-hero .y27-done { max-width: 560px; background: rgba(255,255,255,.92); }

  /* ── 分區 ── */
  .fs-v2 .y27-section { display: grid; grid-template-columns: 240px minmax(0, 1fr); column-gap: 48px; padding: 40px 0; border-top: 1px solid var(--v2-line); }
  .fs-v2 .y27-label { margin: 0; font-family: var(--v2-font-cjk); font-size: 18px; line-height: 28px; font-weight: 500; color: var(--v2-ink); }
  .fs-v2 .y27-text { max-width: 820px; margin: 0 0 12px; font-family: var(--v2-font-cjk); font-size: 15px; line-height: 28px; color: var(--v2-muted); }
  .fs-v2 .y27-text:last-child { margin-bottom: 0; }

  /* ── 三張卡片 ── */
  .fs-v2 .y27-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0 0 20px; padding: 0; list-style: none; }
  .fs-v2 .y27-card { padding: 24px; border: 1px solid var(--v2-line); background: #ffffff; transition: border-color .2s; }
  .fs-v2 .y27-card:hover { border-color: var(--v2-blue-line); }
  .fs-v2 .y27-card-ic { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: 0 0 16px; background: var(--v2-tint); color: var(--v2-blue); }
  .fs-v2 .y27-card-ic svg { width: 24px; height: 24px; }
  .fs-v2 .y27-card-tx { font-family: var(--v2-font-cjk); font-size: 14px; line-height: 25px; color: var(--v2-muted); }
  .fs-v2 .y27-card-tx b { display: block; margin: 0 0 6px; font-size: 16px; line-height: 26px; font-weight: 500; color: var(--v2-ink); }

  /* ── 三步驟 ── */
  .fs-v2 .y27-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin: 0; padding: 0; list-style: none; counter-reset: y27step; }
  .fs-v2 .y27-step { position: relative; padding-top: 4px; }
  .fs-v2 .y27-step-head { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; }
  .fs-v2 .y27-step-num {
    flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--v2-blue-line); font-family: var(--v2-font-latin); font-size: 14px; color: var(--v2-blue); background: #ffffff;
  }
  .fs-v2 .y27-step-avatar { flex: none; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: center top; border: 1px solid var(--v2-blue-line); }
  .fs-v2 .y27-step-title { font-family: var(--v2-font-cjk); font-size: 16px; line-height: 26px; font-weight: 500; color: var(--v2-ink); }
  .fs-v2 .y27-step-desc { margin: 0; font-family: var(--v2-font-cjk); font-size: 14px; line-height: 25px; color: var(--v2-muted); }

  /* ── 索取區（hero / 頁尾共用）── */
  .fs-v2 .y27-action { min-height: 48px; }
  .fs-v2 .y27-state[hidden], .fs-v2 .y27-err[hidden] { display: none; }
  .fs-v2 .y27-err { margin: 0 0 16px; font-family: var(--v2-font-cjk); font-size: 14px; line-height: 24px; color: #b42318; }
  .fs-v2 .y27-btn { box-sizing: border-box; }
  .fs-v2 .y27-btn[aria-busy="true"] { cursor: progress; }
  .fs-v2 .y27-note { max-width: 820px; margin: 16px 0 0; font-family: var(--v2-font-cjk); font-size: 13px; line-height: 22px; color: var(--v2-faint); }
  .fs-v2 .y27-done { display: flex; gap: 16px; align-items: flex-start; padding: 20px 24px; background: var(--v2-tint-soft); border: 1px solid var(--v2-blue-line); }
  .fs-v2 .y27-done-ic { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--v2-blue); color: #ffffff; }
  .fs-v2 .y27-done-ic svg { width: 18px; height: 18px; }
  .fs-v2 .y27-done-main { min-width: 0; }
  .fs-v2 .y27-done-title { margin: 0 0 6px; font-family: var(--v2-font-cjk); font-size: 18px; line-height: 28px; font-weight: 500; color: var(--v2-ink); }
  .fs-v2 .y27-done-body { margin: 0 0 4px; font-family: var(--v2-font-cjk); font-size: 15px; line-height: 26px; color: var(--v2-ink); overflow-wrap: anywhere; }
  .fs-v2 .y27-done-date { margin: 0 0 12px; font-family: var(--v2-font-cjk); font-size: 13px; line-height: 22px; color: var(--v2-faint); }
  .fs-v2 .y27-done-link { font-family: var(--v2-font-cjk); font-size: 14px; line-height: 22px; color: var(--v2-blue); text-decoration: none; border-bottom: 1px solid var(--v2-blue-line); }
  .fs-v2 .y27-done-link:hover { border-bottom-color: var(--v2-blue); }

  /* 頁尾索取區 */
  .fs-v2 .y27-final { margin-top: 16px; padding: 40px; background: var(--v2-tint-soft); border: 1px solid var(--v2-line); }
  .fs-v2 .y27-final-title { margin: 0 0 20px; font-family: var(--v2-font-cjk); font-size: 22px; line-height: 32px; font-weight: 500; color: var(--v2-ink); }
  .fs-v2 .y27-final .y27-done { background: #ffffff; }

  @media (max-width: 999px) {
    .fs-v2 .y27-cards, .fs-v2 .y27-steps { grid-template-columns: minmax(0, 1fr); }
    .fs-v2 .y27-steps { gap: 24px; }
  }
  @media (max-width: 799px) {
    .fs-v2 .y27-wrap { padding-top: 16px; }
    .fs-v2 .y27-hero { padding: 28px 24px; margin-bottom: 40px; background-position: 60% center; }
    .fs-v2 .y27-title { font-size: 28px; line-height: 42px; }
    .fs-v2 .y27-sub { font-size: 14px; line-height: 24px; margin-bottom: 20px; }
    .fs-v2 .y27-section { grid-template-columns: minmax(0, 1fr); padding: 28px 0; }
    .fs-v2 .y27-label { margin: 0 0 16px; font-size: 16px; line-height: 26px; }
    .fs-v2 .y27-btn { width: 100%; }
    .fs-v2 .y27-final { padding: 24px; }
    .fs-v2 .y27-final-title { font-size: 18px; line-height: 28px; }
    .fs-v2 .y27-done { padding: 16px; gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .fs-v2 .y27-card { transition: none; } }
</style>
</head>

<body class="y27-page fs-v2">

<script>window.FS_ACTIVE_PAGE = 'annual-2027';</script>

<div id="site-header"></div>

<!-- 索取區模板：hero 與頁尾各放一份，由 render() 同步狀態 -->
<template id="y27-action-tpl">
  <div class="y27-action" aria-live="polite">
    <div class="y27-state y27-idle" hidden>
      <p class="y27-err" data-i18n="y27.err" hidden></p>
      <button type="button" class="v2-btn v2-btn--primary y27-btn" data-i18n="y27.btn">免費索取我的 2027 年報</button>
    </div>
    <div class="y27-state y27-done" hidden>
      <span class="y27-done-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <div class="y27-done-main">
        <p class="y27-done-title" data-i18n="y27.doneTitle">已收到你的索取</p>
        <p class="y27-done-body"></p>
        <p class="y27-done-date"></p>
        <a class="y27-done-link" href="dashboard.html" data-i18n="btnBackDashboard">返回儀表板</a>
      </div>
    </div>
  </div>
</template>

<div class="fs-page">
  <main class="y27-wrap">
    <div class="y27-hero">
      <div class="y27-eyebrow" data-i18n="y27.eyebrow">2027 年報</div>
      <h1 class="y27-title" data-i18n="y27.title">你的 2027 年報</h1>
      <p class="y27-sub" data-i18n="y27.sub">依你的命盤，看見 2027 這一年的重心。</p>
      <div class="y27-slot" data-slot="hero"></div>
    </div>

    <section class="y27-section">
      <h2 class="y27-label" data-i18n="y27.eyebrow">2027 年報</h2>
      <div>
        <p class="y27-text" data-i18n="y27.intro1"></p>
        <p class="y27-text" data-i18n="y27.intro2"></p>
      </div>
    </section>

    <section class="y27-section">
      <h2 class="y27-label" data-i18n="y27.whatTitle">年報會告訴你</h2>
      <div>
        <ul class="y27-cards">
          <li class="y27-card">
            <span class="y27-card-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></span>
            <div class="y27-card-tx" data-i18n-html="y27.what1"></div>
          </li>
          <li class="y27-card">
            <span class="y27-card-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L19.5 10.5l-5.3 2.2L12 18l-2.2-5.3L4.5 10.5l5.3-2.2L12 3z"/><path d="M19 17l.8 1.7 1.7.8-1.7.8L19 22l-.8-1.7-1.7-.8 1.7-.8L19 17z"/></svg></span>
            <div class="y27-card-tx" data-i18n-html="y27.what2"></div>
          </li>
          <li class="y27-card">
            <span class="y27-card-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg></span>
            <div class="y27-card-tx" data-i18n-html="y27.what3"></div>
          </li>
        </ul>
        <p class="y27-text" data-i18n="y27.what4"></p>
      </div>
    </section>

    <section class="y27-section">
      <h2 class="y27-label" data-i18n="y27.howTitle">怎麼做出來的</h2>
      <ol class="y27-steps">
        <li class="y27-step">
          <div class="y27-step-head"><span class="y27-step-num" aria-hidden="true">1</span><span class="y27-step-title" data-i18n="y27.step1">索取</span></div>
          <p class="y27-step-desc" data-i18n="y27.step1d"></p>
        </li>
        <li class="y27-step">
          <div class="y27-step-head"><img class="y27-step-avatar" src="assets/rs-fusang.webp" alt="R.S. Chen" width="32" height="32"><span class="y27-step-title" data-i18n="y27.step2">判讀與確認</span></div>
          <p class="y27-step-desc" data-i18n="y27.how"></p>
        </li>
        <li class="y27-step">
          <div class="y27-step-head"><span class="y27-step-num" aria-hidden="true">3</span><span class="y27-step-title" data-i18n="y27.step3">寄到你的信箱</span></div>
          <p class="y27-step-desc" data-i18n="y27.step3d"></p>
        </li>
      </ol>
    </section>

    <div class="y27-final">
      <h2 class="y27-final-title" data-i18n="y27.title">你的 2027 年報</h2>
      <div class="y27-slot" data-slot="final"></div>
      <p class="y27-note" data-i18n="y27.note"></p>
    </div>
  </main>
</div>

<div id="site-footer"></div>

<script type="module">
  import { supabase, requireAuth } from './components.js';

  const YEAR = 2027;
  const I18N = window.FSI18N;
  const DATE_LOCALE = { 'zh-TW': 'zh-TW', 'zh-CN': 'zh-CN', 'en': 'en-US', 'ja': 'ja-JP', 'ko': 'ko-KR' };

  // 兩處索取區由模板產生
  const tpl = document.getElementById('y27-action-tpl');
  document.querySelectorAll('.y27-slot').forEach((slot) => slot.appendChild(tpl.content.cloneNode(true)));
  I18N.applyI18n(document);
  const all = (sel) => document.querySelectorAll(sel);

  let current = null;   // 已索取的那一筆（null = 未索取）
  let busy = false;

  function fmtDate(iso) {
    const L = I18N.getUILang();
    try {
      return new Date(iso).toLocaleDateString(DATE_LOCALE[L] || 'zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch (_) { return String(iso).slice(0, 10); }
  }

  function render() {
    document.title = I18N.t('y27.docTitle');
    all('.y27-idle').forEach((el) => { el.hidden = !!current; });
    all('.y27-done').forEach((el) => { el.hidden = !current; });
    if (!current) return;
    const body = I18N.t('y27.doneBody').replace('{email}', current.user_email || '');
    const date = I18N.t('y27.doneDate').replace('{date}', fmtDate(current.requested_at));
    all('.y27-done-body').forEach((el) => { el.textContent = body; I18N.tagKo(el); });
    all('.y27-done-date').forEach((el) => { el.textContent = date; I18N.tagKo(el); });
  }

  function showError(on) { all('.y27-err').forEach((el) => { el.hidden = !on; }); }

  function setBusy(on) {
    busy = on;
    all('.y27-btn').forEach((b) => {
      b.disabled = on;
      b.setAttribute('aria-busy', on ? 'true' : 'false');
    });
  }

  async function load() {
    const { data, error } = await supabase
      .from('annual_report_requests')
      .select('id, user_email, ui_lang, status, requested_at')
      .eq('target_year', YEAR)
      .maybeSingle();
    if (error) throw error;
    current = data || null;
  }

  async function request() {
    if (busy) return;
    setBusy(true);
    showError(false);
    try {
      const { data, error } = await supabase.rpc('request_annual_report', {
        p_year: YEAR,
        p_ui_lang: I18N.getUILang(),
      });
      if (error || !data) throw error || new Error('empty_response');
      current = data;
      if (data.created === true) {
        // 通知寄送失敗不影響索取
        supabase.functions.invoke('notify-annual-request', { body: { request_id: data.id } })
          .then(({ error: e }) => { if (e) console.warn('[notify-annual-request] 通知寄送失敗（不影響索取）：', e); })
          .catch((e) => console.warn('[notify-annual-request] 通知寄送失敗（不影響索取）：', e));
      }
      render();
    } catch (e) {
      console.error('[y27] 索取失敗：', e);
      showError(true);
    } finally {
      setBusy(false);
    }
  }

  all('.y27-btn').forEach((b) => b.addEventListener('click', request));
  window.addEventListener('i18n:changed', render);
  document.title = I18N.t('y27.docTitle');

  (async () => {
    const session = await requireAuth();
    if (!session) return;
    try {
      await load();
    } catch (e) {
      // 讀取失敗：顯示錯誤 + 按鈕；索取 RPC 冪等，重按也不會重複建立
      console.error('[y27] 讀取索取紀錄失敗：', e);
      showError(true);
    }
    render();
  })();
</script>

</body>
</html>
