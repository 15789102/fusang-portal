<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>扶桑晨曦 · 服務運作總覽</title>
<style>
  /* ── A1 專屬樣式（tokens / topbar / 狀態面板由 admin-common.js 提供）── */

  /* 控制列 */
  .controls{
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;
    background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow);
  }
  .presets{display:flex;gap:6px;flex-wrap:wrap;}
  .preset{
    border:1px solid var(--hair-strong);background:var(--surface);color:var(--muted);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;
    transition:all .15s ease;
  }
  .preset:hover{border-color:var(--dawn);color:var(--dawn);}
  .preset.is-active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .preset:focus-visible{outline:2px solid var(--dawn);outline-offset:2px;}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .field input[type="date"]{
    border:1px solid var(--hair-strong);border-radius:var(--radius-sm);
    padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--surface);
  }
  .field input[type="date"]:focus-visible{outline:2px solid var(--dawn);outline-offset:1px;border-color:var(--dawn);}

  .btn-apply{
    border:none;background:var(--dawn);color:#fff;font-weight:600;font-size:13px;
    padding:9px 18px;border-radius:var(--radius-sm);transition:filter .15s ease;
  }
  .btn-apply:hover{filter:brightness(.94);}
  .btn-apply:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn-ghost{
    border:1px solid var(--hair-strong);background:var(--surface);color:var(--muted);
    font-weight:500;font-size:13px;padding:9px 14px;border-radius:var(--radius-sm);
  }
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

  .range-spacer{flex:1 1 auto;}
  .range-label{font-size:12px;color:var(--faint);align-self:flex-end;white-space:nowrap;}

  /* 彙總卡 */
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:26px;}
  .card{
    background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
    padding:16px 16px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .card.is-primary::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dawn);}
  .card-label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:8px;}
  .card-num{
    font-family:"Fraunces",serif;font-weight:600;font-size:30px;line-height:1;
    letter-spacing:-.01em;font-feature-settings:"tnum" 1;
  }
  .card-num.tone-fail{color:var(--fail);}
  .card-num.tone-dawn{color:var(--dawn);}
  .card-num.tone-gold{color:var(--gold);}
  .card-foot{font-size:11px;color:var(--faint);margin-top:6px;}

  /* 表格 */
  .table-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .table-title{font-size:14px;font-weight:600;}
  .table-count{font-size:12px;color:var(--muted);}
  .table-scroll{
    background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:980px;}
  thead th{
    text-align:left;font-weight:600;font-size:11px;color:var(--faint);
    letter-spacing:.05em;text-transform:uppercase;
    padding:13px 14px;border-bottom:1px solid var(--hair);white-space:nowrap;
    background:var(--surface);position:sticky;top:0;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:middle;white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFBFC;}
  .col-email{font-weight:500;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  .col-name{color:var(--muted);}
  .num{font-feature-settings:"tnum" 1;}
  .dim{color:var(--faint);}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;}
  .badge .dot{width:6px;height:6px;border-radius:50%;}
  .b-ok{background:var(--ok-soft);color:var(--ok);} .b-ok .dot{background:var(--ok);}
  .b-fail{background:var(--fail-soft);color:var(--fail);} .b-fail .dot{background:var(--fail);}
  .b-wait{background:var(--wait-soft);color:var(--wait);} .b-wait .dot{background:var(--wait);}
  .b-none{background:#F0F1F3;color:var(--faint);} .b-none .dot{background:var(--faint);}

  .tier{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;}
  .tier-monthly{background:var(--dawn-soft);color:var(--dawn);}
  .tier-buyout{background:var(--gold-soft);color:var(--gold);}
  .tier-free{background:#F0F1F3;color:var(--muted);}

  .check{color:var(--ok);font-weight:700;}
  .cross{color:var(--faint);}
  .job-cell{display:flex;align-items:center;gap:8px;}
  .job-layer{font-size:11px;color:var(--muted);min-width:30px;}
  .job-time{font-size:11px;color:var(--faint);}

  @media (max-width:1100px){ .cards{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .cards{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

  <main class="fa-wrap">
    <div class="fa-page-head">
      <h1 class="fa-page-title">服務運作總覽</h1>
      <p class="fa-page-sub">A1 · 帳號狀態、訂閱分布與報告生成健康度（已排除 admin 帳號）</p>
    </div>

    <!-- 時間區間控制 -->
    <section class="controls">
      <div class="field">
        <label>快速區間</label>
        <div class="presets" id="presets">
          <button class="preset" data-days="7">近 7 天</button>
          <button class="preset is-active" data-days="30">近 30 天</button>
          <button class="preset" data-days="90">近 90 天</button>
          <button class="preset" data-days="all">全部</button>
        </div>
      </div>
      <div class="field">
        <label for="fromDate">起（含）</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label for="toDate">迄（含）</label>
        <input type="date" id="toDate" />
      </div>
      <button class="btn-apply" id="applyBtn">套用</button>
      <button class="btn-ghost" id="refreshBtn">重新整理</button>
      <span class="range-spacer"></span>
      <span class="range-label" id="rangeLabel"></span>
    </section>

    <!-- 彙總卡 -->
    <section class="cards">
      <div class="card is-primary">
        <div class="card-label">帳號總數</div>
        <div class="card-num" id="c_total">—</div>
        <div class="card-foot">不含 admin</div>
      </div>
      <div class="card">
        <div class="card-label">月訂閱</div>
        <div class="card-num tone-dawn" id="c_monthly">—</div>
        <div class="card-foot">active / trialing</div>
      </div>
      <div class="card">
        <div class="card-label">買斷</div>
        <div class="card-num tone-gold" id="c_buyout">—</div>
        <div class="card-foot">未過期</div>
      </div>
      <div class="card">
        <div class="card-label">免費</div>
        <div class="card-num" id="c_free">—</div>
        <div class="card-foot">無有效付費</div>
      </div>
      <div class="card">
        <div class="card-label">四化解鎖</div>
        <div class="card-num" id="c_sihua">—</div>
        <div class="card-foot">sihua_unlocked</div>
      </div>
      <div class="card">
        <div class="card-label">失敗 Job</div>
        <div class="card-num tone-fail" id="c_failed">—</div>
        <div class="card-foot">區間內</div>
      </div>
    </section>

    <!-- 帳號表 -->
    <div class="table-head">
      <span class="table-title">帳號明細</span>
      <span class="table-count" id="tableCount"></span>
    </div>

    <div id="tableState" class="fa-state fa-hidden">
      <div class="fa-spinner"></div>
      <div class="fa-state-title">讀取中…</div>
    </div>

    <div id="emptyState" class="fa-state fa-hidden">
      <div class="fa-state-title">此區間內沒有帳號</div>
      <div>調整起迄日期，或選「全部」查看所有帳號。</div>
    </div>

    <div id="errorState" class="fa-state is-error fa-hidden">
      <div class="fa-state-title">讀取失敗</div>
      <div id="errorMsg"></div>
    </div>

    <div class="table-scroll" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Email</th><th>名稱</th><th>命盤狀態</th><th>月報</th><th>報告日</th>
            <th>訂閱層</th><th>到期</th><th>四化</th><th>最新 Job</th><th>註冊</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { supabase, initAdmin } from './admin-common.js';

    const $ = (id) => document.getElementById(id);

    const fmtDate = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return '—';
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    };
    const fmtDateTime = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return '—';
      return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };
    const toInputDate = (d) =>
      `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const LAYER_LABEL = { chart:'本命', decade:'大限', annual:'流年', monthly:'流月' };

    const chartStatusBadge = (s) => {
      const map = {
        done:['b-ok','完成'], failed:['b-fail','失敗'], interpreting:['b-wait','生成中'],
        pending:['b-wait','等待中'], processing:['b-wait','處理中'], none:['b-none','無'],
      };
      const [cls,label] = map[s] || ['b-none', s || '無'];
      return `<span class="badge ${cls}"><span class="dot"></span>${esc(label)}</span>`;
    };
    const jobStatusBadge = (s) => {
      const map = { ok:['b-ok','成功'], fail:['b-fail','失敗'], pending:['b-wait','進行中'] };
      const [cls,label] = map[s] || ['b-none','—'];
      return `<span class="badge ${cls}"><span class="dot"></span>${label}</span>`;
    };
    const tierBadge = (t) => {
      const map = { monthly:['tier-monthly','月訂閱'], buyout:['tier-buyout','買斷'], free:['tier-free','免費'] };
      const [cls,label] = map[t] || ['tier-free','免費'];
      return `<span class="tier ${cls}">${label}</span>`;
    };

    function setRange(days){
      const to = new Date();
      let from;
      if (days === 'all') from = new Date('2020-01-01T00:00:00');
      else { from = new Date(); from.setDate(from.getDate() - Number(days)); }
      $('fromDate').value = toInputDate(from);
      $('toDate').value = toInputDate(to);
    }
    function activePreset(days){
      document.querySelectorAll('.preset').forEach(b =>
        b.classList.toggle('is-active', b.dataset.days === String(days)));
    }
    function readRangeISO(){
      const fromStr = $('fromDate').value, toStr = $('toDate').value;
      const from = fromStr ? new Date(fromStr + 'T00:00:00') : new Date('2020-01-01T00:00:00');
      const to   = toStr   ? new Date(toStr   + 'T23:59:59') : new Date();
      return { from: from.toISOString(), to: to.toISOString() };
    }

    async function loadData(){
      $('tableState').classList.remove('fa-hidden');
      $('tableWrap').classList.add('fa-hidden');
      $('emptyState').classList.add('fa-hidden');
      $('errorState').classList.add('fa-hidden');

      const { from, to } = readRangeISO();
      $('rangeLabel').textContent = `區間：${fmtDate(from)} – ${fmtDate(to)}`;

      const { data, error } = await supabase.rpc('admin_dashboard_overview', { p_from: from, p_to: to });

      $('tableState').classList.add('fa-hidden');

      if (error){
        $('errorMsg').textContent = error.message || String(error);
        $('errorState').classList.remove('fa-hidden');
        return;
      }
      renderSummary(data?.summary || {});
      renderTable(data?.accounts || []);
    }

    function renderSummary(s){
      $('c_total').textContent   = s.total_accounts ?? 0;
      $('c_monthly').textContent = s.monthly_count ?? 0;
      $('c_buyout').textContent  = s.buyout_count ?? 0;
      $('c_free').textContent    = s.free_count ?? 0;
      $('c_sihua').textContent   = s.sihua_count ?? 0;
      $('c_failed').textContent  = s.failed_jobs ?? 0;
    }

    function renderTable(rows){
      const tbody = $('tbody');
      $('tableCount').textContent = `${rows.length} 個帳號`;

      if (!rows.length){
        $('tableWrap').classList.add('fa-hidden');
        $('emptyState').classList.remove('fa-hidden');
        tbody.innerHTML = '';
        return;
      }
      $('emptyState').classList.add('fa-hidden');
      $('tableWrap').classList.remove('fa-hidden');

      tbody.innerHTML = rows.map(r => {
        const jobLayer = r.latest_job_layer ? (LAYER_LABEL[r.latest_job_layer] || r.latest_job_layer) : '';
        const jobCell = r.latest_job_status
          ? `<div class="job-cell"><span class="job-layer">${esc(jobLayer)}</span>${jobStatusBadge(r.latest_job_status)}<span class="job-time">${fmtDateTime(r.latest_job_at)}</span></div>`
          : `<span class="dim">無</span>`;
        const monthly = r.monthly_active ? `<span class="check">✓</span>` : `<span class="cross">—</span>`;
        const sihua = r.sihua_unlocked ? `<span class="check">✓</span>` : `<span class="cross">—</span>`;

        return `<tr>
          <td class="col-email" title="${esc(r.email)}">${esc(r.email)}</td>
          <td class="col-name">${esc(r.display_name) || '<span class="dim">—</span>'}</td>
          <td>${chartStatusBadge(r.chart_status)}</td>
          <td>${monthly}</td>
          <td class="num">${r.preferred_report_day ?? '<span class="dim">—</span>'}</td>
          <td>${tierBadge(r.subscription_tier)}</td>
          <td class="num dim">${fmtDate(r.access_expires_at)}</td>
          <td>${sihua}</td>
          <td>${jobCell}</td>
          <td class="num dim">${fmtDate(r.created_at)}</td>
        </tr>`;
      }).join('');
    }

    function bindEvents(){
      document.querySelectorAll('.preset').forEach(btn => {
        btn.addEventListener('click', () => {
          const days = btn.dataset.days;
          setRange(days); activePreset(days); loadData();
        });
      });
      $('applyBtn').addEventListener('click', () => { activePreset(null); loadData(); });
      $('refreshBtn').addEventListener('click', loadData);
    }

    /* ── 啟動：admin-common 把關 + 注入導航；通過才載入 ── */
    (async function init(){
      const ok = await initAdmin('overview');
      if (!ok) return;
      setRange(30);
      activePreset(30);
      bindEvents();
      await loadData();
    })();
  </script>
</body>
</html>
