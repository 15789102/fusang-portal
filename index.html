<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuSang Vision — Zi Wei Chart</title>
  <meta name="description" content="Generate your personalized Zi Wei Dou Shu chart with FuSang Vision." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">

    <header class="brand">
      <div class="brand-mark">FuSang Vision</div>
    </header>

    <section class="view view-active">

      <h1 class="title">Discover Your Inner Gift</h1>
      <p class="subtitle">Generate your personalized Zi Wei Dou Shu chart</p>

      <div class="divider"></div>

      <form id="chart-form" class="form" novalidate>

        <!-- Display Name -->
        <div class="field">
          <label for="display_name">Name</label>
          <input
            type="text"
            id="display_name"
            name="display_name"
            placeholder="Your full name"
            required
            autocomplete="name"
          />
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <!-- Date of Birth -->
        <div class="field">
          <label>Date of Birth (Solar Calendar)</label>
          <div class="row-three">
            <select id="birth_year" name="birth_year" required>
              <option value="">Year</option>
            </select>
            <select id="birth_month" name="birth_month" required>
              <option value="">Month</option>
            </select>
            <select id="birth_day" name="birth_day" required>
              <option value="">Day</option>
            </select>
          </div>
        </div>

        <!-- Birth Hour -->
        <div class="field">
          <label for="birth_hour">Birth Hour</label>
          <select id="birth_hour" name="birth_hour" required>
            <option value="">Select birth hour</option>
            <option value="0">子 Zi · 00:00 – 00:59</option>
            <option value="1">丑 Chou · 01:00 – 02:59</option>
            <option value="3">寅 Yin · 03:00 – 04:59</option>
            <option value="5">卯 Mao · 05:00 – 06:59</option>
            <option value="7">辰 Chen · 07:00 – 08:59</option>
            <option value="9">巳 Si · 09:00 – 10:59</option>
            <option value="11">午 Wu · 11:00 – 12:59</option>
            <option value="13">未 Wei · 13:00 – 14:59</option>
            <option value="15">申 Shen · 15:00 – 16:59</option>
            <option value="17">酉 You · 17:00 – 18:59</option>
            <option value="19">戌 Xu · 19:00 – 20:59</option>
            <option value="21">亥 Hai · 21:00 – 22:59</option>
            <option value="23">晚子 Late Zi · 23:00 – 23:59</option>
          </select>
        </div>

        <!-- Gender -->
        <div class="field">
          <label>Gender</label>
          <div class="toggle-group" role="radiogroup" aria-label="Gender">
            <button type="button" class="toggle-btn" data-name="gender" data-value="female">Female</button>
            <button type="button" class="toggle-btn" data-name="gender" data-value="male">Male</button>
          </div>
          <input type="hidden" id="gender" name="gender" required />
        </div>

        <!-- Newsletter consent -->
        <div class="consent-box">
          <input type="checkbox" id="newsletter_consent" name="newsletter_consent" required />
          <label for="newsletter_consent">
            <span class="consent-main">
              I agree to receive insights and updates from FuSang Vision via email
              <span class="required-mark">*</span>
            </span>
            <span class="consent-sub">Required to receive your personalized report</span>
          </label>
        </div>

        <!-- Error message area -->
        <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

        <!-- Submit -->
        <button type="submit" id="submit-btn" class="btn-primary">
          <span class="btn-text">Generate My Chart</span>
          <span class="btn-arrow">→</span>
        </button>

        <p class="footnote">Your report will be delivered to your inbox within 5 minutes.</p>

      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 FuSang Vision · Ancient wisdom for a modern life</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
