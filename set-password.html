<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuSang Vision — 設定密碼</title>

  <style>
    .sp-page {
      --gold: #b8945c;
      --gold-soft: #d4b888;
      min-height: calc(100vh - 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--bg-primary);
      position: relative;
    }
    .sp-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(184, 148, 92, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(21, 54, 58, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .sp-card {
      background: var(--bg-card);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      position: relative;
      box-shadow: 0 4px 24px rgba(21, 54, 58, 0.06);
      z-index: 1;
    }
    .sp-card::before {
      content: '';
      position: absolute;
      top: 24px; right: 24px;
      width: 32px; height: 32px;
      border-top: 1px solid var(--gold-soft);
      border-right: 1px solid var(--gold-soft);
    }
    .sp-card::after {
      content: '';
      position: absolute;
      bottom: 24px; left: 24px;
      width: 32px; height: 32px;
      border-bottom: 1px solid var(--gold-soft);
      border-left: 1px solid var(--gold-soft);
    }

    .sp-eyebrow {
      font-family: var(--font-serif-en);
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 12px;
    }
    .sp-title {
      font-family: var(--font-serif-zh);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-align: center;
      color: var(--ink-darkest);
      margin-bottom: 8px;
    }
    .sp-sub {
      font-family: var(--font-serif-zh);
      font-size: 13px;
      color: var(--ink-mid);
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .sp-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 20px 0 36px;
    }
    .sp-divider::before, .sp-divider::after {
      content: '';
      width: 32px; height: 1px;
      background: var(--gold-soft);
    }
    .sp-divider span {
      font-family: var(--font-serif-en);
      font-style: italic;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--gold);
    }

    .sp-message {
      display: none;
      padding: 12px 14px;
      margin-bottom: 20px;
      border-radius: 2px;
      font-size: 13px;
      font-family: var(--font-serif-zh);
      line-height: 1.6;
    }
    .sp-message.error { background: #fdecea; border: 1px solid #f5c2be; color: #c0392b; }
    .sp-message.success { background: var(--t-lu-bg); border: 1px solid var(--t-lu); color: var(--t-lu); }
    .sp-message.active { display: block; }

    .sp-field { display: flex; flex-direction: column; margin-bottom: 22px; }
    .sp-field label {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: 8px;
    }
    .sp-field input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--bg-soft-2);
      font-size: 15px;
      font-family: var(--font-serif-zh);
      color: var(--ink-darkest);
      transition: all 0.2s;
    }
    .sp-field input:hover { border-color: var(--silver-deep); }
    .sp-field input:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px rgba(184, 148, 92, 0.12);
    }
    .sp-hint {
      font-family: var(--font-serif-zh);
      font-size: 11px;
      color: var(--ink-light);
      letter-spacing: 0.05em;
      margin-top: 6px;
      line-height: 1.6;
    }

    .sp-btn {
      width: 100%;
      height: 50px;
      background: var(--ink-darkest);
      color: var(--bg-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .sp-btn:hover:not(:disabled) { background: var(--accent-soft); }
    .sp-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sp-altcta {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px dashed var(--rule);
      text-align: center;
      font-family: var(--font-serif-zh);
      font-size: 13px;
      color: var(--ink-mid);
      line-height: 1.8;
    }
    .sp-altcta a {
      color: var(--ink-darkest);
      border-bottom: 1px solid var(--gold);
      padding-bottom: 1px;
    }

    /* Loading state */
    .sp-loading {
      text-align: center;
      padding: 40px 0;
    }
    .sp-loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .sp-loading-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold-soft);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .sp-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .sp-loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
    .sp-loading-text {
      font-family: var(--font-serif-zh);
      font-size: 14px;
      color: var(--ink-mid);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<div id="site-header"></div>

<div class="fs-page sp-page">

  <div class="sp-card">

    <!-- View: Loading(驗證 recovery token)-->
    <div id="view-loading" class="sp-view">
      <div class="sp-loading">
        <div class="sp-loading-dots"><span></span><span></span><span></span></div>
        <div class="sp-loading-text">正在驗證連結...</div>
      </div>
    </div>

    <!-- View: Form(設定新密碼)-->
    <div id="view-form" class="sp-view" style="display:none;">
      <div class="sp-eyebrow">Set Your Password</div>
      <h1 class="sp-title">設定密碼</h1>
      <p class="sp-sub" id="sp-sub-text">為您的帳戶設定一組新密碼</p>
      <div class="sp-divider"><span>✦</span></div>

      <div id="sp-error" class="sp-message error"></div>

      <form id="sp-form" novalidate>
        <div class="sp-field">
          <label for="password">新密碼</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
          <div class="sp-hint">至少 8 個字元</div>
        </div>

        <div class="sp-field">
          <label for="password2">確認新密碼</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8" />
        </div>

        <button type="submit" id="sp-btn" class="sp-btn">
          <span id="sp-btn-text">確認設定</span>
        </button>
      </form>
    </div>

    <!-- View: Success -->
    <div id="view-success" class="sp-view" style="display:none;">
      <div class="sp-eyebrow">All Set</div>
      <h1 class="sp-title">密碼已更新</h1>
      <p class="sp-sub">您現在可以使用新密碼登入。</p>
      <div class="sp-divider"><span>✦</span></div>

      <button id="goto-dashboard-btn" class="sp-btn">前往儀表板</button>

      <div class="sp-altcta">
        或 <a href="login.html">回登入頁</a>
      </div>
    </div>

    <!-- View: Invalid link -->
    <div id="view-invalid" class="sp-view" style="display:none;">
      <div class="sp-eyebrow">Link Issue</div>
      <h1 class="sp-title">連結無效或已過期</h1>
      <p class="sp-sub" id="invalid-detail">您的重設密碼連結可能已過期(24 小時)或已使用過。</p>
      <div class="sp-divider"><span>✦</span></div>

      <div class="sp-altcta">
        <a href="login.html">回登入頁重新請求 →</a>
      </div>
    </div>

  </div>

</div>

<div id="site-footer"></div>

<script type="module">
  import { supabase } from './components.js';

  function showView(id) {
    document.querySelectorAll('.sp-view').forEach(v => v.style.display = 'none');
    document.getElementById(id).style.display = '';
  }
  function showError(msg) {
    const box = document.getElementById('sp-error');
    box.textContent = msg;
    box.classList.add('active');
  }
  function clearError() {
    document.getElementById('sp-error').classList.remove('active');
  }
  function setLoading(loading) {
    const btn = document.getElementById('sp-btn');
    const txt = document.getElementById('sp-btn-text');
    btn.disabled = loading;
    txt.textContent = loading ? '設定中...' : '確認設定';
  }

  // ─── 初始化:檢查 recovery session ──────────────────
  async function init() {
    // Supabase 會自動處理 URL 裡的 access_token,給它一點時間
    await new Promise(r => setTimeout(r, 600));

    const { data: { session }, error } = await supabase.auth.getSession();

    if (error) {
      console.error('Session error:', error);
      document.getElementById('invalid-detail').textContent =
        '無法驗證連結:' + (error.message || '未知錯誤');
      showView('view-invalid');
      return;
    }

    if (!session) {
      // 沒 session → 連結無效
      showView('view-invalid');
      return;
    }

    // 顯示給使用者看是哪個 email
    const email = session.user?.email;
    if (email) {
      document.getElementById('sp-sub-text').innerHTML =
        `為 <strong style="color: var(--ink-darkest);">${escapeHtml(email)}</strong> 設定新密碼`;
    }

    // 清掉 URL hash
    if (window.location.hash) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    showView('view-form');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── Form submit ─────────────────────────────────
  document.getElementById('sp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password.length < 8) { showError('密碼至少 8 個字元'); return; }
    if (password !== password2) { showError('兩次輸入的密碼不一致'); return; }

    setLoading(true);

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      console.error('Update password error:', error);
      let msg = '設定失敗,請稍後再試';
      if (error.message?.toLowerCase().includes('same as')) {
        msg = '新密碼不能與舊密碼相同';
      } else if (error.message?.toLowerCase().includes('weak')) {
        msg = '密碼強度不足';
      }
      showError(msg);
      setLoading(false);
      return;
    }

    showView('view-success');
  });

  // ─── Success → dashboard ─────────────────────────
  document.getElementById('goto-dashboard-btn').addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });

  init();
</script>

<script type="module" src="components.js"></script>

</body>
</html>
