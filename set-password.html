<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定密碼 - FuSang Vision</title>
  <script>
    // ── set-password 專屬 UI 字典(策略 B;位置索引見 i18n.js 檔頭)──
    //   裝飾性英文 eyebrow(Set Your Password / All Set / Link Issue)刻意保留為靜態,不翻譯。
    window.FSI18N.addUI({
      'sp.docTitle':        { 'zh-TW': '設定密碼 - FuSang Vision', 'zh-CN': '设置密码 - FuSang Vision', 'en': 'Set Password - FuSang Vision' },
      'sp.verifying':       { 'zh-TW': '正在驗證連結…', 'zh-CN': '正在验证链接…', 'en': 'Verifying your link…' },
      'sp.formTitle':       { 'zh-TW': '設定密碼', 'zh-CN': '设置密码', 'en': 'Set Password' },
      'sp.formSubGeneric':  { 'zh-TW': '為您的帳戶設定一組新密碼', 'zh-CN': '为您的账户设置一组新密码', 'en': 'Set a new password for your account' },
      'sp.formSubEmail':    { 'zh-TW': '為 {email} 設定新密碼', 'zh-CN': '为 {email} 设置新密码', 'en': 'Set a new password for {email}' },
      'sp.newPassword':     { 'zh-TW': '新密碼', 'zh-CN': '新密码', 'en': 'New Password' },
      'sp.hint8':           { 'zh-TW': '至少 8 個字元', 'zh-CN': '至少 8 个字符', 'en': 'At least 8 characters' },
      'sp.confirmPassword': { 'zh-TW': '確認新密碼', 'zh-CN': '确认新密码', 'en': 'Confirm New Password' },
      'sp.submit':          { 'zh-TW': '確認設定', 'zh-CN': '确认设置', 'en': 'Set Password' },
      'sp.submitting':      { 'zh-TW': '設定中…', 'zh-CN': '设置中…', 'en': 'Setting…' },
      'sp.successTitle':    { 'zh-TW': '密碼已更新', 'zh-CN': '密码已更新', 'en': 'Password Updated' },
      'sp.successSub':      { 'zh-TW': '您現在可以使用新密碼登入。', 'zh-CN': '您现在可以使用新密码登录。', 'en': 'You can now sign in with your new password.' },
      'sp.gotoDashboard':   { 'zh-TW': '前往儀表板', 'zh-CN': '前往仪表板', 'en': 'Go to Dashboard' },
      'sp.orText':          { 'zh-TW': '或', 'zh-CN': '或', 'en': 'or' },
      'sp.backToLogin':     { 'zh-TW': '回登入頁', 'zh-CN': '回登录页', 'en': 'back to login' },
      'sp.invalidTitle':    { 'zh-TW': '連結無效或已過期', 'zh-CN': '链接无效或已过期', 'en': 'Link Invalid or Expired' },
      'sp.invalidDefault':  { 'zh-TW': '您的重設密碼連結可能已過期（24 小時）或已使用過。', 'zh-CN': '您的重置密码链接可能已过期（24 小时）或已使用过。', 'en': 'Your reset link may have expired (24 hours) or already been used.' },
      'sp.backToLoginRequest':{ 'zh-TW': '回登入頁重新請求 →', 'zh-CN': '回登录页重新请求 →', 'en': 'Back to login to request again →' },
      'sp.invalidVerifyFail':{ 'zh-TW': '無法驗證連結：{msg}', 'zh-CN': '无法验证链接：{msg}', 'en': "Couldn't verify the link: {msg}" },
      'sp.unknownError':    { 'zh-TW': '未知錯誤', 'zh-CN': '未知错误', 'en': 'Unknown error' },
      'sp.errPwShort':      { 'zh-TW': '密碼至少 8 個字元', 'zh-CN': '密码至少 8 个字符', 'en': 'Password must be at least 8 characters.' },
      'sp.errPwMismatch':   { 'zh-TW': '兩次輸入的密碼不一致', 'zh-CN': '两次输入的密码不一致', 'en': "The passwords don't match." },
      'sp.errGeneric':      { 'zh-TW': '設定失敗，請稍後再試', 'zh-CN': '设置失败，请稍后再试', 'en': "Couldn't set your password. Please try again later." },
      'sp.errSameAsOld':    { 'zh-TW': '新密碼不能與舊密碼相同', 'zh-CN': '新密码不能与旧密码相同', 'en': "Your new password can't be the same as the old one." },
      'sp.errWeak':         { 'zh-TW': '密碼強度不足', 'zh-CN': '密码强度不足', 'en': 'Password is too weak.' }
    });
  </script>

  <style>
    .sp-page {
      --gold: #b8945c;
      --gold-soft: #d4b888;
      min-height: calc(100vh - 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--bg-primary);
      position: relative;
    }
    .sp-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(184, 148, 92, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(21, 54, 58, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .sp-card {
      background: var(--bg-card);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      position: relative;
      box-shadow: 0 4px 24px rgba(21, 54, 58, 0.06);
      z-index: 1;
    }
    .sp-card::before {
      content: '';
      position: absolute;
      top: 24px; right: 24px;
      width: 32px; height: 32px;
      border-top: 1px solid var(--gold-soft);
      border-right: 1px solid var(--gold-soft);
    }
    .sp-card::after {
      content: '';
      position: absolute;
      bottom: 24px; left: 24px;
      width: 32px; height: 32px;
      border-bottom: 1px solid var(--gold-soft);
      border-left: 1px solid var(--gold-soft);
    }

    .sp-eyebrow {
      font-family: var(--font-serif-en);
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 12px;
    }
    .sp-title {
      font-family: var(--font-serif-zh);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-align: center;
      color: var(--ink-darkest);
      margin-bottom: 8px;
    }
    .sp-sub {
      font-family: var(--font-serif-zh);
      font-size: 13px;
      color: var(--ink-mid);
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .sp-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 20px 0 36px;
    }
    .sp-divider::before, .sp-divider::after {
      content: '';
      width: 32px; height: 1px;
      background: var(--gold-soft);
    }
    .sp-divider span {
      font-family: var(--font-serif-en);
      font-style: italic;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--gold);
    }

    .sp-message {
      display: none;
      padding: 12px 14px;
      margin-bottom: 20px;
      border-radius: 2px;
      font-size: 13px;
      font-family: var(--font-serif-zh);
      line-height: 1.6;
    }
    .sp-message.error { background: #fdecea; border: 1px solid #f5c2be; color: #c0392b; }
    .sp-message.success { background: var(--t-lu-bg); border: 1px solid var(--t-lu); color: var(--t-lu); }
    .sp-message.active { display: block; }

    .sp-field { display: flex; flex-direction: column; margin-bottom: 22px; }
    .sp-field label {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: 8px;
    }
    .sp-field input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--rule);
      border-radius: 2px;
      background: var(--bg-soft-2);
      font-size: 15px;
      font-family: var(--font-serif-zh);
      color: var(--ink-darkest);
      transition: all 0.2s;
    }
    .sp-field input:hover { border-color: var(--silver-deep); }
    .sp-field input:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px rgba(184, 148, 92, 0.12);
    }
    .sp-hint {
      font-family: var(--font-serif-zh);
      font-size: 11px;
      color: var(--ink-light);
      letter-spacing: 0.05em;
      margin-top: 6px;
      line-height: 1.6;
    }

    .sp-btn {
      width: 100%;
      height: 50px;
      background: var(--ink-darkest);
      color: var(--bg-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .sp-btn:hover:not(:disabled) { background: var(--accent-soft); }
    .sp-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sp-altcta {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px dashed var(--rule);
      text-align: center;
      font-family: var(--font-serif-zh);
      font-size: 13px;
      color: var(--ink-mid);
      line-height: 1.8;
    }
    .sp-altcta a {
      color: var(--ink-darkest);
      border-bottom: 1px solid var(--gold);
      padding-bottom: 1px;
    }

    /* Loading state */
    .sp-loading {
      text-align: center;
      padding: 40px 0;
    }
    .sp-loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .sp-loading-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold-soft);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .sp-loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .sp-loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
    .sp-loading-text {
      font-family: var(--font-serif-zh);
      font-size: 14px;
      color: var(--ink-mid);
      letter-spacing: 0.05em;
    }

    /* ── 頁內 UI 語言切換(header 已移除,固定右上)── */
    .sp-lang {
      position: fixed; top: 20px; right: 24px; z-index: 20;
      display: inline-flex; align-items: center;
      border: 1px solid var(--rule); border-radius: 2px; overflow: hidden;
      background: var(--bg-primary);
    }
    .sp-lang-opt {
      font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.08em;
      color: var(--ink-light); padding: 6px 10px; line-height: 1;
      background: transparent; border: none; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .sp-lang-opt + .sp-lang-opt { border-left: 1px solid var(--rule); }
    .sp-lang-opt:hover { color: var(--accent-deep); }
    .sp-lang-opt.active { background: var(--accent-deep); color: var(--bg-primary); }
    @media (max-width: 560px) {
      .sp-lang { top: 14px; right: 14px; }
      .sp-lang-opt { padding: 5px 8px; font-size: 10px; }
    }
  </style>
</head>
<body>

<!-- header 已移除;以頁內語言切換取代 -->
<div class="sp-lang" id="sp-lang">
  <button type="button" class="sp-lang-opt" data-lang="zh-TW">繁中</button>
  <button type="button" class="sp-lang-opt" data-lang="zh-CN">简中</button>
  <button type="button" class="sp-lang-opt" data-lang="en">EN</button>
</div>

<div class="fs-page sp-page">

  <div class="sp-card">

    <!-- View: Loading(驗證 recovery token)-->
    <div id="view-loading" class="sp-view">
      <div class="sp-loading">
        <div class="sp-loading-dots"><span></span><span></span><span></span></div>
        <div class="sp-loading-text" data-i18n="sp.verifying">正在驗證連結…</div>
      </div>
    </div>

    <!-- View: Form(設定新密碼)-->
    <div id="view-form" class="sp-view" style="display:none;">
      <div class="sp-eyebrow">Set Your Password</div>
      <h1 class="sp-title" data-i18n="sp.formTitle">設定密碼</h1>
      <!-- 含動態 email → 由 JS 以 {email} 模板組(不用 data-i18n) -->
      <p class="sp-sub" id="sp-sub-text">為您的帳戶設定一組新密碼</p>
      <div class="sp-divider"><span>✦</span></div>

      <div id="sp-error" class="sp-message error"></div>

      <form id="sp-form" novalidate>
        <div class="sp-field">
          <label for="password" data-i18n="sp.newPassword">新密碼</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
          <div class="sp-hint" data-i18n="sp.hint8">至少 8 個字元</div>
        </div>

        <div class="sp-field">
          <label for="password2" data-i18n="sp.confirmPassword">確認新密碼</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8" />
        </div>

        <button type="submit" id="sp-btn" class="sp-btn">
          <span id="sp-btn-text" data-i18n="sp.submit">確認設定</span>
        </button>
      </form>
    </div>

    <!-- View: Success -->
    <div id="view-success" class="sp-view" style="display:none;">
      <div class="sp-eyebrow">All Set</div>
      <h1 class="sp-title" data-i18n="sp.successTitle">密碼已更新</h1>
      <p class="sp-sub" data-i18n="sp.successSub">您現在可以使用新密碼登入。</p>
      <div class="sp-divider"><span>✦</span></div>

      <button id="goto-dashboard-btn" class="sp-btn" data-i18n="sp.gotoDashboard">前往儀表板</button>

      <div class="sp-altcta">
        <span data-i18n="sp.orText">或</span> <a href="login.html" data-i18n="sp.backToLogin">回登入頁</a>
      </div>
    </div>

    <!-- View: Invalid link -->
    <div id="view-invalid" class="sp-view" style="display:none;">
      <div class="sp-eyebrow">Link Issue</div>
      <h1 class="sp-title" data-i18n="sp.invalidTitle">連結無效或已過期</h1>
      <p class="sp-sub" id="invalid-detail" data-i18n="sp.invalidDefault">您的重設密碼連結可能已過期(24 小時)或已使用過。</p>
      <div class="sp-divider"><span>✦</span></div>

      <div class="sp-altcta">
        <a href="login.html" data-i18n="sp.backToLoginRequest">回登入頁重新請求 →</a>
      </div>
    </div>

  </div>

</div>

<div id="site-footer"></div>

<script type="module">
  import { supabase } from './components.js';

  const F = window.FSI18N;

  let userEmail = null;      // 有值 → form 副標顯示 email 版
  let verifyFailRaw;         // undefined=正常;string/null=驗證失敗(附原始訊息)

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showView(id) {
    document.querySelectorAll('.sp-view').forEach(v => v.style.display = 'none');
    document.getElementById(id).style.display = '';
  }
  function showError(msg) {
    const box = document.getElementById('sp-error');
    box.textContent = msg;
    box.classList.add('active');
  }
  function clearError() {
    document.getElementById('sp-error').classList.remove('active');
  }
  function setLoading(loading) {
    const btn = document.getElementById('sp-btn');
    const txt = document.getElementById('sp-btn-text');
    btn.disabled = loading;
    txt.textContent = loading ? F.t('sp.submitting') : F.t('sp.submit');
  }

  // 動態文字(隨語言重繪):form 的 email 副標、invalid 的驗證失敗訊息
  function renderDynamic() {
    const sub = document.getElementById('sp-sub-text');
    if (userEmail) {
      sub.innerHTML = F.t('sp.formSubEmail')
        .replace('{email}', '<strong style="color: var(--ink-darkest);">' + escapeHtml(userEmail) + '</strong>');
    } else {
      sub.textContent = F.t('sp.formSubGeneric');
    }
    if (verifyFailRaw !== undefined) {
      const el = document.getElementById('invalid-detail');
      el.removeAttribute('data-i18n');  // 不讓 applyI18n 蓋回預設
      el.textContent = F.t('sp.invalidVerifyFail').replace('{msg}', verifyFailRaw || F.t('sp.unknownError'));
    }
  }

  // ─── 頁內 UI 語言切換 ─────────────────────────────
  const langBox = document.getElementById('sp-lang');
  function applyLangUi() {
    const cur = F.getUILang();
    langBox.querySelectorAll('.sp-lang-opt').forEach((b) =>
      b.classList.toggle('active', b.getAttribute('data-lang') === cur));
    document.title = F.t('sp.docTitle');
    renderDynamic();
  }
  langBox.querySelectorAll('.sp-lang-opt').forEach((b) =>
    b.addEventListener('click', () => F.setUILang(b.getAttribute('data-lang'))));
  applyLangUi();
  window.addEventListener('i18n:changed', applyLangUi);

  // ─── 初始化:檢查 recovery session ──────────────────
  async function init() {
    // Supabase 會自動處理 URL 裡的 access_token,給它一點時間
    await new Promise(r => setTimeout(r, 600));

    const { data: { session }, error } = await supabase.auth.getSession();

    if (error) {
      console.error('Session error:', error);
      verifyFailRaw = error.message || null;
      renderDynamic();
      showView('view-invalid');
      return;
    }

    if (!session) {
      // 沒 session → 連結無效
      showView('view-invalid');
      return;
    }

    // 顯示給使用者看是哪個 email
    userEmail = session.user?.email || null;
    renderDynamic();

    // 清掉 URL hash
    if (window.location.hash) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    showView('view-form');
  }

  // ─── Form submit ─────────────────────────────────
  document.getElementById('sp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password.length < 8) { showError(F.t('sp.errPwShort')); return; }
    if (password !== password2) { showError(F.t('sp.errPwMismatch')); return; }

    setLoading(true);

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      console.error('Update password error:', error);
      let msg = F.t('sp.errGeneric');
      if (error.message?.toLowerCase().includes('same as')) {
        msg = F.t('sp.errSameAsOld');
      } else if (error.message?.toLowerCase().includes('weak')) {
        msg = F.t('sp.errWeak');
      }
      showError(msg);
      setLoading(false);
      return;
    }

    showView('view-success');
  });

  // ─── Success → dashboard ─────────────────────────
  document.getElementById('goto-dashboard-btn').addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });

  init();
</script>

<script type="module" src="components.js"></script>

</body>
</html>
