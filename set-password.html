<!DOCTYPE html>

<head>

  <script src="i18n.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定密碼 - FuSang Vision</title>
  <script>

      'sp.formSubGeneric':  { 'zh-TW': '為您的帳戶設定一組新密碼', 'zh-CN': '为您的账户设置一组新密码', 'en': 'Set a new password for your account', 'ja': 'アカウントの新しいパスワードを設定してください', 'ko': '계정에 사용할 새 비밀번호를 설정하세요' },
      'sp.formSubEmail':    { 'zh-TW': '為 {email} 設定新密碼', 'zh-CN': '为 {email} 设置新密码', 'en': 'Set a new password for {email}', 'ja': '{email} の新しいパスワードを設定してください', 'ko': '{email}의 새 비밀번호를 설정하세요' },
      'sp.newPassword':     { 'zh-TW': '新密碼', 'zh-CN': '新密码', 'en': 'New Password', 'ja': '新しいパスワード', 'ko': '새 비밀번호' },
      'sp.hint8':           { 'zh-TW': '至少 8 個字元', 'zh-CN': '至少 8 个字符', 'en': 'At least 8 characters', 'ja': '8文字以上', 'ko': '8자 이상' },

      'sp.submitting':      { 'zh-TW': '設定中…', 'zh-CN': '设置中…', 'en': 'Setting…', 'ja': '設定中…', 'ko': '설정 중…' },
      'sp.successTitle':    { 'zh-TW': '密碼已更新', 'zh-CN': '密码已更新', 'en': 'Password Updated', 'ja': 'パスワードを更新しました', 'ko': '비밀번호가 변경되었어요' },
      'sp.successSub':      { 'zh-TW': '您現在可以使用新密碼登入。', 'zh-CN': '您现在可以使用新密码登录。', 'en': 'You can now sign in with your new password.', 'ja': '新しいパスワードでログインできるようになりました。', 'ko': '이제 새 비밀번호로 로그인할 수 있어요.' },
      'sp.gotoDashboard':   { 'zh-TW': '前往儀表板', 'zh-CN': '前往仪表板', 'en': 'Go to Dashboard', 'ja': 'ダッシュボードへ', 'ko': '대시보드로 가기' },
      'sp.orText':          { 'zh-TW': '或', 'zh-CN': '或', 'en': 'or', 'ja': 'または', 'ko': '또는' },
      'sp.backToLogin':     { 'zh-TW': '回登入頁', 'zh-CN': '回登录页', 'en': 'back to login', 'ja': 'ログインページに戻る', 'ko': '로그인 페이지로 돌아가기' },
      'sp.invalidTitle':    { 'zh-TW': '連結無效或已過期', 'zh-CN': '链接无效或已过期', 'en': 'Link Invalid or Expired', 'ja': 'リンクが無効か、有効期限が切れています', 'ko': '링크가 유효하지 않거나 만료되었어요' },
      'sp.invalidDefault':  { 'zh-TW': '您的重設密碼連結可能已過期（24 小時）或已使用過。', 'zh-CN': '您的重置密码链接可能已过期（24 小时）或已使用过。', 'en': 'Your reset link may have expired (24 hours) or already been used.', 'ja': 'パスワード再設定用のリンクは、有効期限（24時間）が切れているか、すでに使用済みの可能性があります。', 'ko': '비밀번호 재설정 링크가 만료되었거나(24시간) 이미 사용되었을 수 있어요.' },
      'sp.backToLoginRequest':{ 'zh-TW': '回登入頁重新請求 →', 'zh-CN': '回登录页重新请求 →', 'en': 'Back to login to request again →', 'ja': 'ログインページで再度リクエストする →', 'ko': '로그인 페이지에서 다시 요청하기 →' },
      'sp.invalidVerifyFail':{ 'zh-TW': '無法驗證連結：{msg}', 'zh-CN': '无法验证链接：{msg}', 'en': "Couldn't verify the link: {msg}", 'ja': 'リンクを確認できませんでした：{msg}', 'ko': '링크를 확인할 수 없어요: {msg}' },
      'sp.unknownError':    { 'zh-TW': '未知錯誤', 'zh-CN': '未知错误', 'en': 'Unknown error', 'ja': '不明なエラー', 'ko': '알 수 없는 오류' },
      'sp.errPwShort':      { 'zh-TW': '密碼至少 8 個字元', 'zh-CN': '密码至少 8 个字符', 'en': 'Password must be at least 8 characters.', 'ja': 'パスワードは8文字以上で入力してください。', 'ko': '비밀번호는 8자 이상이어야 해요' },
      'sp.errPwMismatch':   { 'zh-TW': '兩次輸入的密碼不一致', 'zh-CN': '两次输入的密码不一致', 'en': "The passwords don't match.", 'ja': '入力したパスワードが一致しません。', 'ko': '두 비밀번호가 일치하지 않아요' },
      'sp.errGeneric':      { 'zh-TW': '設定失敗，請稍後再試', 'zh-CN': '设置失败，请稍后再试', 'en': "Couldn't set your password. Please try again later.", 'ja': '設定に失敗しました。しばらくしてから再度お試しください。', 'ko': '설정에 실패했어요. 잠시 후 다시 시도해 주세요' },
      'sp.errSameAsOld':    { 'zh-TW': '新密碼不能與舊密碼相同', 'zh-CN': '新密码不能与旧密码相同', 'en': "Your new password can't be the same as the old one.", 'ja': '新しいパスワードは、以前のパスワードとは異なるものにしてください。', 'ko': '새 비밀번호는 이전 비밀번호와 달라야 해요' },
      'sp.errWeak':         { 'zh-TW': '密碼強度不足', 'zh-CN': '密码强度不足', 'en': 'Password is too weak.', 'ja': 'パスワードの強度が不十分です。', 'ko': '비밀번호 보안 수준이 낮아요' },
      // v2 版型：左側品牌語
      'sp.craft':           { 'zh-TW': '紫微斗數', 'zh-CN': '紫微斗数', 'en': 'Zi Wei Dou Shu', 'ja': '紫微斗数', 'ko': '자미두수' },
      'sp.introTitle':      { 'zh-TW': '回到你的命盤', 'zh-CN': '回到你的命盘', 'en': 'Back to your chart', 'ja': 'あなたの命盤へ戻る', 'ko': '내 명반으로 돌아가기' },
      'sp.introLead':       { 'zh-TW': '設定完成後，就能隨時登入，繼續閱讀你的本命、大限、流年與流月。', 'zh-CN': '设置完成后，就能随时登录，继续阅读你的本命、大限、流年与流月。', 'en': 'Once your password is set, you can sign in anytime to keep reading your natal, decade, annual and monthly charts.', 'ja': '設定が完了すれば、いつでもログインして、本命・大限・流年・流月を読み進められます。', 'ko': '설정을 마치면 언제든 로그인해 본명, 대한, 유년, 유월 해석을 이어서 읽을 수 있어요.' }
    });
  </script>

  <!-- v2 視覺（共用版型 §10 公開頁：品牌列 / 主視覺 / 右側卡片）-->
  <link rel="stylesheet" href="fs-v2.css" />
  <style>
    /* set-password 專屬：驗證中動畫、欄位提示；版型全在 fs-v2.css §10 */
    .fs-v2 .sp-loading { padding: 32px 0; text-align: center; }
    .fs-v2 .sp-loading-dots { display: flex; justify-content: center; gap: 8px; margin: 0 0 20px; }
    .fs-v2 .sp-loading-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--v2-blue); animation: spPulse 1.4s ease-in-out infinite; }
    .fs-v2 .sp-loading-dots span:nth-child(2) { animation-delay: .2s; }
    .fs-v2 .sp-loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes spPulse { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.2); } }
    .fs-v2 .sp-loading-text { font-size: 14px; line-height: 24px; color: var(--v2-muted); }
    .fs-v2 a.v2-auth-submit { text-decoration: none; }
  </style>
</head>
<body class="sp-body fs-v2">

<!-- 品牌列（公開頁不放主選單）＋ 語言切換 -->
<header class="v2-auth-bar">
  <a class="v2-auth-brand" href="https://fusang-vision.com/" aria-label="FuSang Vision">
    <img src="assets/fusangvision_trans_graph_only_0706.png" alt="" />
    <span class="v2-auth-brand-name">FuSang Vision</span>
  </a>
  <div class="v2-auth-lang sp-lang" id="sp-lang" role="group" aria-label="Language">
    <button type="button" class="sp-lang-opt" data-lang="zh-TW" lang="zh-TW">繁中</button>
    <button type="button" class="sp-lang-opt" data-lang="zh-CN" lang="zh-CN">简中</button>
    <button type="button" class="sp-lang-opt" data-lang="en" lang="en">EN</button>
    <button type="button" class="sp-lang-opt" data-lang="ja" lang="ja">日本語</button>
    <button type="button" class="sp-lang-opt" data-lang="ko" lang="ko">한국어</button>
  </div>
</header>

<main class="fs-page v2-auth-stage sp-page" id="fs-main" tabindex="-1">

  <!-- 左：品牌語 -->
  <div class="v2-auth-intro">
    <p class="v2-auth-eyebrow"><span data-i18n="sp.craft">紫微斗數</span> · FuSang Vision</p>
    <h2 class="v2-auth-headline" data-i18n="sp.introTitle">回到你的命盤</h2>
    <p class="v2-auth-lead" data-i18n="sp.introLead">設定完成後，就能隨時登入，繼續閱讀你的本命、大限、流年與流月。</p>
  </div>

  <!-- 右：卡片（四種狀態）-->
  <div class="v2-auth-card sp-card">

    <!-- View: Loading(驗證 recovery token)-->
    <div id="view-loading" class="sp-view">
      <div class="sp-loading" role="status">
        <div class="sp-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="sp-loading-text" data-i18n="sp.verifying">正在驗證連結…</div>
      </div>
    </div>

    <!-- View: Form(設定新密碼)-->
    <div id="view-form" class="sp-view" style="display:none;">
      <p class="v2-auth-card-eyebrow">Set Your Password</p>
      <h1 class="v2-auth-title" data-i18n="sp.formTitle">設定密碼</h1>
      <!-- 含動態 email → 由 JS 以 {email} 模板組(不用 data-i18n) -->
      <p class="v2-auth-sub" id="sp-sub-text">為您的帳戶設定一組新密碼</p>

      <div id="sp-error" class="v2-auth-msg v2-auth-msg--error sp-message error" role="alert"></div>

      <form id="sp-form" novalidate>
        <div class="v2-field">
          <label for="password" data-i18n="sp.newPassword">新密碼</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" aria-describedby="sp-hint" />
          <div class="v2-field-hint" id="sp-hint" data-i18n="sp.hint8">至少 8 個字元</div>
        </div>
        <div class="v2-field">
          <label for="password2" data-i18n="sp.confirmPassword">確認新密碼</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8" />
        </div>
        <button type="submit" id="sp-btn" class="v2-auth-submit sp-btn">
          <span id="sp-btn-text" data-i18n="sp.submit">確認設定</span>
        </button>
      </form>
    </div>

    <!-- View: Success -->
    <div id="view-success" class="sp-view" style="display:none;">
      <p class="v2-auth-card-eyebrow">All Set</p>
      <h1 class="v2-auth-title" data-i18n="sp.successTitle">密碼已更新</h1>
      <p class="v2-auth-sub" data-i18n="sp.successSub">您現在可以使用新密碼登入。</p>
      <button id="goto-dashboard-btn" class="v2-auth-submit sp-btn" data-i18n="sp.gotoDashboard">前往儀表板</button>
      <div class="v2-auth-alt">
        <span data-i18n="sp.orText">或</span> <a href="login.html" data-i18n="sp.backToLogin">回登入頁</a>
      </div>
    </div>

    <!-- View: Invalid link -->
    <div id="view-invalid" class="sp-view" style="display:none;">
      <p class="v2-auth-card-eyebrow">Link Issue</p>
      <h1 class="v2-auth-title" data-i18n="sp.invalidTitle">連結無效或已過期</h1>
      <p class="v2-auth-sub" id="invalid-detail" data-i18n="sp.invalidDefault">您的重設密碼連結可能已過期（24 小時）或已使用過。</p>
      <a href="login.html" class="v2-auth-submit" data-i18n="sp.backToLoginRequest">回登入頁重新請求 →</a>
    </div>

  </div>

</main>

<div id="site-footer"></div>

<script type="module">
  import { supabase } from './components.js';

  const F = window.FSI18N;

  let userEmail = null;      // 有值 → form 副標顯示 email 版
  let verifyFailRaw;         // undefined=正常;string/null=驗證失敗(附原始訊息)

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showView(id) {
    document.querySelectorAll('.sp-view').forEach(v => v.style.display = 'none');
    document.getElementById(id).style.display = '';
  }
  function showError(msg) {
    const box = document.getElementById('sp-error');
    box.textContent = msg;
    box.classList.add('active');
  }
  function clearError() {
    document.getElementById('sp-error').classList.remove('active');
  }
  function setLoading(loading) {
    const btn = document.getElementById('sp-btn');
    const txt = document.getElementById('sp-btn-text');
    btn.disabled = loading;
    txt.textContent = loading ? F.t('sp.submitting') : F.t('sp.submit');
  }

  // 動態文字(隨語言重繪):form 的 email 副標、invalid 的驗證失敗訊息
  function renderDynamic() {
    const sub = document.getElementById('sp-sub-text');
    if (userEmail) {
      sub.innerHTML = F.t('sp.formSubEmail')
        .replace('{email}', '<strong style="color: var(--v2-ink); font-weight: 600;">' + escapeHtml(userEmail) + '</strong>');
    } else {
      sub.textContent = F.t('sp.formSubGeneric');
    }
    if (verifyFailRaw !== undefined) {
      const el = document.getElementById('invalid-detail');
      el.removeAttribute('data-i18n');  // 不讓 applyI18n 蓋回預設
      el.textContent = F.t('sp.invalidVerifyFail').replace('{msg}', verifyFailRaw || F.t('sp.unknownError'));
    }
  }

  // ─── 頁內 UI 語言切換 ─────────────────────────────
  const langBox = document.getElementById('sp-lang');
  function applyLangUi() {
    const cur = F.getUILang();
    langBox.querySelectorAll('.sp-lang-opt').forEach((b) =>
      b.classList.toggle('active', b.getAttribute('data-lang') === cur));
    document.title = F.t('sp.docTitle');
    renderDynamic();
  }
  langBox.querySelectorAll('.sp-lang-opt').forEach((b) =>
    b.addEventListener('click', () => F.setUILang(b.getAttribute('data-lang'))));
  applyLangUi();
  window.addEventListener('i18n:changed', applyLangUi);

  // ─── 初始化:檢查 recovery session ──────────────────
  async function init() {
    // Supabase 會自動處理 URL 裡的 access_token,給它一點時間
    await new Promise(r => setTimeout(r, 600));

    const { data: { session }, error } = await supabase.auth.getSession();

    if (error) {
      console.error('Session error:', error);
      verifyFailRaw = error.message || null;
      renderDynamic();
      showView('view-invalid');
      return;
    }

    if (!session) {
      // 沒 session → 連結無效
      showView('view-invalid');
      return;
    }

    // 顯示給使用者看是哪個 email
    userEmail = session.user?.email || null;
    renderDynamic();

    // 清掉 URL hash
    if (window.location.hash) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    showView('view-form');
  }

  // ─── Form submit ─────────────────────────────────
  document.getElementById('sp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password.length < 8) { showError(F.t('sp.errPwShort')); return; }
    if (password !== password2) { showError(F.t('sp.errPwMismatch')); return; }

    setLoading(true);

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      console.error('Update password error:', error);
      let msg = F.t('sp.errGeneric');
      if (error.message?.toLowerCase().includes('same as')) {
        msg = F.t('sp.errSameAsOld');
      } else if (error.message?.toLowerCase().includes('weak')) {
        msg = F.t('sp.errWeak');
      }
      showError(msg);
      setLoading(false);
      return;
    }

    showView('view-success');
  });

  // ─── Success → dashboard ─────────────────────────
  document.getElementById('goto-dashboard-btn').addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });

  init();
</script>

<script type="module" src="components.js"></script>

</body>
</html>
