<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建立帳號 · FuSang Vision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- 設定來源:須先於下方頁面邏輯 script 載入(classic,設定 window.CFG) -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script>
    // ── account-create 專屬 UI 字典(策略 B)──────────────────────
    //   注意:此頁有兩種語言。以下是「介面 UI」字串(右上切換鈕控制)。
    //   表單內的「報告語言」單選(繁體中文/简体中文/English)是另一回事、註冊即鎖定,不在此。
    window.FSI18N.addUI({
      'ac.docTitle':        { 'zh-TW': '建立帳號 · FuSang Vision', 'zh-CN': '建立账号 · FuSang Vision', 'en': 'Create Account · FuSang Vision' },
      'ac.title':           { 'zh-TW': '建立帳號', 'zh-CN': '建立账号', 'en': 'Create Account' },
      'ac.subtitle':        { 'zh-TW': '選擇的語言將鎖定，往後報告皆以此語言生成', 'zh-CN': '选择的语言将锁定，往后报告皆以此语言生成', 'en': 'Your chosen language is locked; all future reports are generated in it.' },
      'ac.reportLangLabel': { 'zh-TW': '報告語言 · Report Language', 'zh-CN': '报告语言 · Report Language', 'en': 'Report Language' },
      'ac.reportLangNote':  { 'zh-TW': '註冊後鎖定，不可更換。需要其他語言請以另一個 email 註冊。', 'zh-CN': '注册后锁定，不可更换。需要其他语言请以另一个 email 注册。', 'en': 'Locked after registration and cannot be changed. For another language, register with a different email.' },
      'ac.name':            { 'zh-TW': '姓名', 'zh-CN': '姓名', 'en': 'Name' },
      'ac.namePh':          { 'zh-TW': '你的全名', 'zh-CN': '你的全名', 'en': 'Your full name' },
      'ac.email':           { 'zh-TW': '電子郵件', 'zh-CN': '电子邮件', 'en': 'Email' },
      'ac.password':        { 'zh-TW': '密碼', 'zh-CN': '密码', 'en': 'Password' },
      'ac.passwordPh':      { 'zh-TW': '至少 8 個字元', 'zh-CN': '至少 8 个字符', 'en': 'At least 8 characters' },
      'ac.passwordConfirm': { 'zh-TW': '確認密碼', 'zh-CN': '确认密码', 'en': 'Confirm Password' },
      'ac.passwordConfirmPh':{ 'zh-TW': '再次輸入密碼', 'zh-CN': '再次输入密码', 'en': 'Re-enter your password' },
      'ac.dob':             { 'zh-TW': '出生日期（陽曆）', 'zh-CN': '出生日期（阳历）', 'en': 'Date of Birth (Solar Calendar)' },
      'ac.year':            { 'zh-TW': '年', 'zh-CN': '年', 'en': 'Year' },
      'ac.month':           { 'zh-TW': '月', 'zh-CN': '月', 'en': 'Month' },
      'ac.day':             { 'zh-TW': '日', 'zh-CN': '日', 'en': 'Day' },

      // ── 出生時間(改:時+分,24 小時制)───────────────────────────
      'ac.birthTimeLabel':  { 'zh-TW': '出生時間（24 小時制）', 'zh-CN': '出生时间（24 小时制）', 'en': 'Birth Time (24-hour)' },
      'ac.hourPh':          { 'zh-TW': '時', 'zh-CN': '时', 'en': 'Hour' },
      'ac.minutePh':        { 'zh-TW': '分', 'zh-CN': '分', 'en': 'Minute' },

      // ── 三段文字(PM 拍板)──────────────────────────────────────
      //   (a) 精確時間重要性告知 —— zh-TW 為 PM 逐字版；zh-CN/en 為草擬「待 PM 批准」

        'zh-TW': '出生時間越精確，命盤越準確。真太陽時計算依你填寫的時、分推算，些微時間差可能影響時辰判定。',
        'zh-CN': '出生时间越精确，命盘越准确。真太阳时计算依你填写的时、分推算，些微时间差可能影响时辰判定。', /* 草擬待批准 */
        'en': 'The more precise your birth time, the more accurate your chart. True solar time is derived from the hour and minute you enter — even a small difference can shift which shichen (two-hour period) applies.' /* 草擬待批准 */
      },
      //   (b) 填最接近時間的風險告知 —— zh-TW 為 PM 逐字版；zh-CN/en 為草擬「待 PM 批准」
      'ac.noticeApprox': {
        'zh-TW': '若不確定精確出生分鐘，請填最接近的時間。請注意：概略時間可能導致時辰判定落在相鄰時辰，進而影響命盤結果。',
        'zh-CN': '若不确定精确出生分钟，请填最接近的时间。请注意：概略时间可能导致时辰判定落在相邻时辰，进而影响命盘结果。', /* 草擬待批准 */
        'en': "If you're unsure of the exact minute, enter the closest time you know. Please note: an approximate time may place the shichen in an adjacent period, which can change your chart." /* 草擬待批准 */
      },
      //   (c) 送出前必勾同意聲明 —— PM 三語逐字版
      'ac.subjectConsent': {
        'zh-TW': '我了解命盤涉及個人隱私，並確認當事人為本人，或我已取得當事人同意，進行此命盤解讀。',
        'zh-CN': '我了解命盘涉及个人隐私，并确认当事人为本人，或我已取得当事人同意，进行此命盘解读。',
        'en': "I understand that a natal chart involves personal privacy, and I confirm that I am the subject, or have obtained the subject's consent, to proceed with this chart reading."
      },

      // ── 出生地點 ──────────────────────────────────────────────
      'ac.birthPlaceLabel': { 'zh-TW': '出生地點（非現居地）', 'zh-CN': '出生地点（非现居地）', 'en': 'Birthplace (not your current residence)' },
      'ac.birthPlacePh':    { 'zh-TW': '輸入出生城市', 'zh-CN': '输入出生城市', 'en': 'Enter your birth city' },
      'ac.placeLoadFail':   { 'zh-TW': '地點輸入載入失敗，請重新整理頁面再試。', 'zh-CN': '地点输入加载失败，请刷新页面再试。', 'en': 'The place input failed to load. Please refresh the page and try again.' },

      'ac.gender':          { 'zh-TW': '性別', 'zh-CN': '性别', 'en': 'Gender' },
      'ac.female':          { 'zh-TW': '女', 'zh-CN': '女', 'en': 'Female' },
      'ac.male':            { 'zh-TW': '男', 'zh-CN': '男', 'en': 'Male' },
      'ac.consent':         { 'zh-TW': '我同意 FuSang Vision 以電子郵件寄送洞察與更新', 'zh-CN': '我同意 FuSang Vision 以电子邮件发送洞察与更新', 'en': 'I agree to receive insights and updates from FuSang Vision via email' },
      'ac.consentSub':      { 'zh-TW': '為寄送你的個人化報告所需', 'zh-CN': '为发送你的个人化报告所需', 'en': 'Required to receive your personalized report' },
      'ac.submit':          { 'zh-TW': '生成我的命盤', 'zh-CN': '生成我的命盘', 'en': 'Generate My Chart' },
      'ac.submitting':      { 'zh-TW': '提交中…', 'zh-CN': '提交中…', 'en': 'Submitting…' },

      'ac.errName':         { 'zh-TW': '請輸入你的姓名。', 'zh-CN': '请输入你的姓名。', 'en': 'Please enter your name.' },
      'ac.errEmail':        { 'zh-TW': '請輸入你的電子郵件。', 'zh-CN': '请输入你的电子邮件。', 'en': 'Please enter your email.' },
      'ac.errEmailInvalid': { 'zh-TW': '請輸入有效的電子郵件。', 'zh-CN': '请输入有效的电子邮件。', 'en': 'Please enter a valid email.' },
      'ac.errPwEmpty':      { 'zh-TW': '請建立密碼。', 'zh-CN': '请建立密码。', 'en': 'Please create a password.' },
      'ac.errPwShort':      { 'zh-TW': '密碼至少需 8 個字元。', 'zh-CN': '密码至少需 8 个字符。', 'en': 'Password must be at least 8 characters.' },
      'ac.errYear':         { 'zh-TW': '請選擇出生年份。', 'zh-CN': '请选择出生年份。', 'en': 'Please select your birth year.' },
      'ac.errMonth':        { 'zh-TW': '請選擇出生月份。', 'zh-CN': '请选择出生月份。', 'en': 'Please select your birth month.' },
      'ac.errDay':          { 'zh-TW': '請選擇出生日。', 'zh-CN': '请选择出生日。', 'en': 'Please select your birth day.' },
      'ac.errHour':         { 'zh-TW': '請選擇出生小時。', 'zh-CN': '请选择出生小时。', 'en': 'Please select your birth hour.' },
      'ac.errMinute':       { 'zh-TW': '請選擇出生分鐘。', 'zh-CN': '请选择出生分钟。', 'en': 'Please select your birth minute.' },
      'ac.errPlace':        { 'zh-TW': '請從建議清單選擇出生地點。', 'zh-CN': '请从建议清单选择出生地点。', 'en': 'Please select your birthplace from the suggestions.' },
      'ac.errGender':       { 'zh-TW': '請選擇性別。', 'zh-CN': '请选择性别。', 'en': 'Please select your gender.' },
      'ac.errLang':         { 'zh-TW': '請選擇語言。', 'zh-CN': '请选择语言。', 'en': 'Please select a language.' },
      'ac.errDate':         { 'zh-TW': '請輸入有效的日期。', 'zh-CN': '请输入有效的日期。', 'en': 'Please enter a valid date.' },
      'ac.errPwMismatch':   { 'zh-TW': '兩次輸入的密碼不一致。', 'zh-CN': '两次输入的密码不一致。', 'en': 'Passwords do not match.' },
      'ac.errConsent':      { 'zh-TW': '請確認你同意接收電子郵件。', 'zh-CN': '请确认你同意接收电子邮件。', 'en': 'Please confirm you agree to receive emails.' },
      'ac.errSubjectConsent':{ 'zh-TW': '請勾選同意聲明後再送出。', 'zh-CN': '请勾选同意声明后再送出。', 'en': 'Please check the consent statement before submitting.' },
      'ac.errTimezone':     { 'zh-TW': '無法取得該地點的時區資訊。請稍後再試，或確認出生地點是否正確；未取得前無法生成命盤。', 'zh-CN': '无法取得该地点的时区信息。请稍后再试，或确认出生地点是否正确；未取得前无法生成命盘。', 'en': "We couldn't resolve the time zone for this location. Please try again shortly or check that the birthplace is correct — the chart can't be generated until this succeeds." },
      'ac.errGeneric':      { 'zh-TW': '發生錯誤，請再試一次。', 'zh-CN': '发生错误，请再试一次。', 'en': 'Something went wrong. Please try again.' }
    });
  </script>

  <!-- ── Google Maps JS(Places 新版元件)bootstrap loader ──────────────
       key 為前端「瀏覽器 key」,以 HTTP referrer 限制保護(非藏 key)。
       實際 import 在首次 importLibrary('places') 時才觸發。 -->
  <script>
    (g => {
      var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary",
          q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {});
      var d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(),
          u = () => h || (h = new Promise(async (f, n) => {
            await (a = m.createElement("script"));
            e.set("libraries", [...r] + "");
            for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]);
            e.set("callback", c + ".maps." + q);
            a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
            d[q] = f; a.onerror = () => h = n(Error(p + " could not load."));
            a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a);
          }));
      d[l] ? console.warn(p + " only loads once. Ignoring:", g) :
        d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n));
    })({
      key: (window.CFG && window.CFG.GOOGLE_MAPS_BROWSER_KEY) || "",
      v: "weekly",
      // 顯示語言改由元件的 requestedLanguage 控制(可隨 UI 語言即時切換),故此處不鎖 language
    });
  </script>

  <style>
    :root {
      --ink-darkest: #15363a;
      --accent-deep: #1d4a4f;
      --accent-soft: #3a6b70;
      --gold: #b8945c;
      --bg-primary: #faf7f1;
      --bg-card: #ffffff;
      --bg-soft: #f4efe6;
      --rule: #e3dccf;
      --ink-dark: #2b3d3f;
      --ink-mid: #5e6f70;
      --ink-light: #97a3a3;
      --error: #a8453a;
      --font-serif-zh: 'Noto Serif TC', serif;
      --font-serif-en: 'Cormorant Garamond', serif;
      --font-sans: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-primary); color: var(--ink-dark); font-family: var(--font-sans); line-height: 1.6; padding: 48px 20px 80px; }
    .container { max-width: 480px; margin: 0 auto; }

    .brand-mark { font-family: var(--font-serif-en); font-size: 22px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-darkest); text-align: center; margin-bottom: 24px; }
    .title { font-family: var(--font-serif-zh); font-size: 28px; font-weight: 500; letter-spacing: 0.06em; color: var(--ink-darkest); text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; font-size: 14px; color: var(--ink-mid); margin-bottom: 24px; }
    .divider { height: 1px; background: var(--rule); margin: 24px 0 28px; }

    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-dark); margin-bottom: 7px; letter-spacing: 0.02em; }
    input, select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg-card);
      font-family: var(--font-sans); font-size: 14px; color: var(--ink-dark); transition: border-color 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent-soft); }
    .row-three { display: grid; grid-template-columns: 1.1fr 1fr 0.8fr; gap: 10px; }
    /* 新增:時+分兩欄,比照 .row-three 的既有樣式語言 */
    .row-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* 新增:欄位下方告知文字(沿用既有 ink-mid,非視覺改版)*/
    .field-note { font-size: 12px; color: var(--ink-mid); margin-top: 8px; line-height: 1.55; }

    /* 新增:地點輸入容器。Google 元件有 shadow DOM、可調樣式有限,
       這裡讓它撐滿寬度並繼承字體,盡量貼近既有 input 外觀;
       像素級對齊可再用 Google 提供的 CSS parts 微調。 */
    .place-wrap { width: 100%; }
    .place-wrap gmp-place-autocomplete { width: 100%; font-family: var(--font-sans); }
    .place-fallback { font-size: 13px; color: var(--error); padding: 10px 14px; background: #f9e8e5; border-radius: 4px; }

    /* 語言選擇 */
    .lang-field { padding: 18px; background: var(--bg-soft); border-radius: 4px; border-left: 3px solid var(--gold); margin-bottom: 24px; }
    .lang-field label { font-size: 14px; color: var(--ink-darkest); margin-bottom: 4px; }
    .lang-field .lang-note { font-size: 12px; color: var(--ink-mid); margin-bottom: 12px; line-height: 1.5; }
    .lang-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .lang-btn {
      padding: 12px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg-card); cursor: pointer;
      font-family: var(--font-sans); font-size: 13px; color: var(--ink-mid); transition: all 0.2s; text-align: center;
    }
    .lang-btn:hover { border-color: var(--accent-soft); }
    .lang-btn.active { background: var(--accent-deep); color: #fff; border-color: var(--accent-deep); }

    .toggle-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toggle-btn {
      padding: 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg-card); cursor: pointer;
      font-family: var(--font-sans); font-size: 14px; color: var(--ink-mid); transition: all 0.2s;
    }
    .toggle-btn:hover { border-color: var(--accent-soft); }
    .toggle-btn.active { background: var(--accent-deep); color: #fff; border-color: var(--accent-deep); }

    .consent-box { display: flex; gap: 10px; align-items: flex-start; margin: 24px 0; padding: 14px; background: var(--bg-soft); border-radius: 4px; }
    .consent-box input { width: auto; margin-top: 3px; }
    .consent-box label { margin: 0; font-weight: 400; font-size: 13px; }
    .consent-sub { display: block; font-size: 11px; color: var(--ink-light); margin-top: 3px; }
    .required-mark { color: var(--error); }

    .error-message { display: none; color: var(--error); font-size: 13px; margin: 12px 0; padding: 10px 14px; background: #f9e8e5; border-radius: 4px; }

    .btn-primary {
      width: 100%; padding: 16px; background: var(--ink-darkest); color: #fff; border: none; border-radius: 4px;
      font-family: var(--font-sans); font-size: 13px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-deep); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .footnote { text-align: center; font-size: 12px; color: var(--ink-light); margin-top: 16px; line-height: 1.6; }

    /* ── 頁內 UI 語言切換(此頁無 header,固定右上)── */
    .ac-lang {
      position: fixed; top: 16px; right: 18px; z-index: 20;
      display: inline-flex; align-items: center;
      border: 1px solid var(--rule); border-radius: 4px; overflow: hidden;
      background: var(--bg-primary);
    }
    .ac-lang-opt {
      font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.06em;
      color: var(--ink-light); padding: 6px 10px; line-height: 1;
      background: transparent; border: none; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .ac-lang-opt + .ac-lang-opt { border-left: 1px solid var(--rule); }
    .ac-lang-opt:hover { color: var(--accent-deep); }
    .ac-lang-opt.active { background: var(--accent-deep); color: #fff; }
    @media (max-width: 560px) {
      .ac-lang { top: 12px; right: 12px; }
      .ac-lang-opt { padding: 5px 8px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <!-- 頁內 UI 語言切換(此頁無 header)。與表單內「報告語言」單選各自獨立。 -->
  <div class="ac-lang" id="ac-lang">
    <button type="button" class="ac-lang-opt" data-lang="zh-TW">繁中</button>
    <button type="button" class="ac-lang-opt" data-lang="zh-CN">简中</button>
    <button type="button" class="ac-lang-opt" data-lang="en">EN</button>
  </div>

  <main class="container">
    <div class="brand-mark">FuSang Vision</div>
    <h1 class="title" data-i18n="ac.title">建立帳號</h1>
    <p class="subtitle" data-i18n="ac.subtitle">選擇語言將鎖定，之後報告皆以此語言生成</p>

    <div class="divider"></div>

    <form id="chart-form" novalidate>

      <!-- 報告語言選擇(註冊即鎖定;與右上 UI 語言切換各自獨立)-->
      <div class="lang-field">
        <label data-i18n="ac.reportLangLabel">報告語言 · Report Language</label>
        <div class="lang-note" data-i18n="ac.reportLangNote">註冊後鎖定，不可更換。需要其他語言請用另一個 email 註冊。</div>
        <div class="lang-options" id="lang-options" role="radiogroup" aria-label="Report Language">
          <button type="button" class="lang-btn active" data-value="zh-TW">繁體中文</button>
          <button type="button" class="lang-btn" data-value="zh-CN">简体中文</button>
          <button type="button" class="lang-btn" data-value="en">English</button>
        </div>
        <input type="hidden" id="language" name="language" value="zh-TW" />
      </div>

      <div class="field">
        <label for="display_name" data-i18n="ac.name">Name</label>
        <input type="text" id="display_name" name="display_name" placeholder="Your full name" data-i18n-placeholder="ac.namePh" required autocomplete="name" />
      </div>

      <div class="field">
        <label for="email" data-i18n="ac.email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="password" data-i18n="ac.password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" data-i18n-placeholder="ac.passwordPh" required minlength="8" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="password_confirm" data-i18n="ac.passwordConfirm">Confirm Password</label>
        <input type="password" id="password_confirm" name="password_confirm" placeholder="Re-enter your password" data-i18n-placeholder="ac.passwordConfirmPh" required minlength="8" autocomplete="new-password" />
      </div>

      <div class="field">
        <label data-i18n="ac.dob">Date of Birth (Solar Calendar)</label>
        <div class="row-three">
          <select id="birth_year" name="birth_year" required><option value="" data-i18n="ac.year">Year</option></select>
          <select id="birth_month" name="birth_month" required><option value="" data-i18n="ac.month">Month</option></select>
          <select id="birth_day" name="birth_day" required><option value="" data-i18n="ac.day">Day</option></select>
        </div>
      </div>

      <!-- 出生時間:改收「時:分」,24 小時制。真太陽時計算需精確時刻。 -->
      <div class="field">
        <label data-i18n="ac.birthTimeLabel">Birth Time (24-hour)</label>
        <div class="row-two">
          <select id="birth_hour" name="birth_hour" required><option value="" data-i18n="ac.hourPh">Hour</option></select>
          <select id="birth_minute" name="birth_minute" required><option value="" data-i18n="ac.minutePh">Minute</option></select>
        </div>
        <!-- (a) 精確時間重要性告知 -->
        <p class="field-note" data-i18n="ac.noticePrecision">The more precise your birth time, the more accurate your chart.</p>
        <!-- (b) 填最接近時間的風險告知 -->
        <p class="field-note" data-i18n="ac.noticeApprox">If you're unsure of the exact minute, enter the closest time you know.</p>
      </div>

      <!-- 出生地點:Google Places Autocomplete(城市級)。明確標示「非現居地」。 -->
      <div class="field">
        <label data-i18n="ac.birthPlaceLabel">Birthplace (not your current residence)</label>
        <div id="place-container" class="place-wrap"></div>
      </div>

      <div class="field">
        <label data-i18n="ac.gender">Gender</label>
        <div class="toggle-group" role="radiogroup" aria-label="Gender">
          <button type="button" class="toggle-btn" data-name="gender" data-value="female" data-i18n="ac.female">Female</button>
          <button type="button" class="toggle-btn" data-name="gender" data-value="male" data-i18n="ac.male">Male</button>
        </div>
        <input type="hidden" id="gender" name="gender" required />
      </div>

      <!-- (c) 同意聲明:新增必勾項,與下方 newsletter 各自獨立判斷 -->
      <div class="consent-box">
        <input type="checkbox" id="subject_consent" name="subject_consent" required />
        <label for="subject_consent">
          <span data-i18n="ac.subjectConsent">I understand that a natal chart involves personal privacy…</span> <span class="required-mark">*</span>
        </label>
      </div>

      <!-- newsletter 同意:既有必勾項,與上方同意聲明各自獨立判斷 -->
      <div class="consent-box">
        <input type="checkbox" id="newsletter_consent" name="newsletter_consent" required />
        <label for="newsletter_consent">
          <span data-i18n="ac.consent">I agree to receive insights and updates from FuSang Vision via email</span> <span class="required-mark">*</span>
          <span class="consent-sub" data-i18n="ac.consentSub">Required to receive your personalized report</span>
        </label>
      </div>

      <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

      <button type="submit" id="submit-btn" class="btn-primary" disabled>
        <span class="btn-text" data-i18n="ac.submit">Generate My Chart</span>
        <span class="btn-arrow">→</span>
      </button>

    </form>
  </main>

  <script>
    // ============================================================
    // 建帳號頁邏輯 — 真太陽時版
    //   流程:地點選定 → resolve-timezone EF 取 offset → 前端算真太陽時
    //        → 產出「真太陽時日期 + 時辰編碼(0,1,3…23)」+ original_input
    //        → POST submit_birth_data → 跳轉 submitted.html
    //   三段分工:前端算真太陽時 → process_chart 直傳日期/轉編碼 → 引擎做晚子+1
    //            前端只做「真太陽時實際換日」,不對晚子做 ±1(避免雙重位移)。
    //
    //   v7 變更(註冊原子性票 / 決策 5-A):submit_birth_data 回傳的 job_id 可能為
    //     null(該 EF 的 Step 4 已降為 best-effort)。跳轉時改為「僅在有值時才帶入
    //     job_id 參數」,避免 URLSearchParams 把 null 字串化成 "null" 而繞過
    //     submitted.html 的 falsy 守衛。此為顯示層調整,不影響任何流程判斷。
    // ============================================================
    const SUPABASE_URL = window.CFG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = window.CFG.SUPABASE_ANON_KEY;
    const EF_SUBMIT_URL = `${SUPABASE_URL}/functions/v1/submit_birth_data`;
    const EF_RESOLVE_TZ_URL = `${SUPABASE_URL}/functions/v1/resolve-timezone`;
    const GOOGLE_KEY = (window.CFG && window.CFG.GOOGLE_MAPS_BROWSER_KEY) || "";
    const F = window.FSI18N;

    // 已選定地點(未選 → 送出鈕 disabled)。{ place_id, lat, lng, name_display }
    let selectedPlace = null;
    let placeEl = null;
    let submitting = false;

    document.addEventListener('DOMContentLoaded', () => {
      bindUiLang();
      initYearOptions();
      initMonthOptions();
      initDayOptions();
      initHourOptions();
      initMinuteOptions();
      bindLangOptions();
      bindToggleGroups();
      bindForm();
      initPlaceAutocomplete();
      refreshReadiness();
    });

    // 頁內 UI 語言切換(只動介面文字;不碰表單裡「報告語言」單選)
    function bindUiLang() {
      const box = document.getElementById('ac-lang');
      const mark = () => {
        const cur = F.getUILang();
        box.querySelectorAll('.ac-lang-opt').forEach((b) =>
          b.classList.toggle('active', b.getAttribute('data-lang') === cur));
        document.title = F.t('ac.docTitle');
      };
      box.querySelectorAll('.ac-lang-opt').forEach((b) =>
        b.addEventListener('click', () => F.setUILang(b.getAttribute('data-lang'))));
      mark();
      window.addEventListener('i18n:changed', mark);
    }

    function initYearOptions() {
      const yearSelect = document.getElementById('birth_year');
      const currentYear = new Date().getFullYear();
      for (let y = currentYear; y >= 1920; y--) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        yearSelect.appendChild(opt);
      }
    }
    function initMonthOptions() {
      const monthSelect = document.getElementById('birth_month');
      const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = `${m} — ${names[m-1]}`;
        monthSelect.appendChild(opt);
      }
    }
    function initDayOptions() {
      const daySelect = document.getElementById('birth_day');
      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        daySelect.appendChild(opt);
      }
    }
    // 時(00–23,24 小時制)
    function initHourOptions() {
      const s = document.getElementById('birth_hour');
      for (let h = 0; h <= 23; h++) {
        const opt = document.createElement('option');
        opt.value = h; opt.textContent = String(h).padStart(2, '0');
        s.appendChild(opt);
      }
    }
    // 分(00–59)
    function initMinuteOptions() {
      const s = document.getElementById('birth_minute');
      for (let mi = 0; mi <= 59; mi++) {
        const opt = document.createElement('option');
        opt.value = mi; opt.textContent = String(mi).padStart(2, '0');
        s.appendChild(opt);
      }
    }

    // 語言選擇（單選按鈕組 → 寫進 hidden input）
    function bindLangOptions() {
      const group = document.getElementById('lang-options');
      const hidden = document.getElementById('language');
      group.addEventListener('click', (e) => {
        const btn = e.target.closest('.lang-btn');
        if (!btn) return;
        group.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        hidden.value = btn.dataset.value;
      });
    }

    function bindToggleGroups() {
      document.querySelectorAll('.toggle-group').forEach((group) => {
        group.addEventListener('click', (e) => {
          const btn = e.target.closest('.toggle-btn');
          if (!btn) return;
          group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const hidden = document.getElementById(btn.dataset.name);
          if (hidden) hidden.value = btn.dataset.value;
        });
      });
    }

    // ────────────────────────────────────────────────────────────
    // Google Places 地點輸入(新版 PlaceAutocompleteElement)
    //   ⚠ Places API(New)近年有 API 變動,以下事件名/欄位名(gmp-select /
    //     placePrediction / toPlace / fetchFields 欄位)請對照當前官方文件並在瀏覽器實測。
    // ────────────────────────────────────────────────────────────
    async function initPlaceAutocomplete() {
      const container = document.getElementById('place-container');
      if (!GOOGLE_KEY) {
        console.error('[places] GOOGLE_MAPS_BROWSER_KEY 未設定(config.js)');
        container.innerHTML = `<div class="place-fallback">${F.t('ac.placeLoadFail')}</div>`;
        return;
      }
      try {
        const { PlaceAutocompleteElement } = await google.maps.importLibrary('places');
        placeEl = new PlaceAutocompleteElement({
          includedPrimaryTypes: ['(cities)'], // 城市級
        });
        placeEl.requestedLanguage = F.getUILang(); // 顯示語言 = 當前 UI 語言(與報告 preferred_language 無關)
        placeEl.style.width = '100%';
        try { placeEl.placeholder = F.t('ac.birthPlacePh'); } catch (_) {}
        container.appendChild(placeEl);

        // 選定地點 → 取 place_id + 經緯度 + 顯示名
        placeEl.addEventListener('gmp-select', async (ev) => {
          try {
            const prediction = ev.placePrediction;
            const place = prediction.toPlace();
            await place.fetchFields({ fields: ['location', 'displayName', 'id'] });
            const lat = numFrom(place.location && place.location.lat);
            const lng = numFrom(place.location && place.location.lng);
            if (typeof lat !== 'number' || typeof lng !== 'number' || Number.isNaN(lat) || Number.isNaN(lng)) {
              throw new Error('no location on selected place');
            }
            selectedPlace = {
              place_id: place.id,
              lat, lng,
              name_display: (typeof place.displayName === 'string' ? place.displayName : '') || '',
            };
            clearError();
          } catch (e) {
            console.error('[places] select error', e);
            selectedPlace = null;
          }
          refreshReadiness();
        });

        // 使用者重新編輯 → 作廢已選地點(避免用舊座標送出)
        placeEl.addEventListener('input', () => { selectedPlace = null; refreshReadiness(); });

        // UI 語言切換 → 同步 widget 顯示語言
        window.addEventListener('i18n:changed', () => {
          if (placeEl) {
            try { placeEl.requestedLanguage = F.getUILang(); } catch (_) {}
            try { placeEl.placeholder = F.t('ac.birthPlacePh'); } catch (_) {}
          }
        });
      } catch (e) {
        console.error('[places] load failed', e);
        container.innerHTML = `<div class="place-fallback">${F.t('ac.placeLoadFail')}</div>`;
      }
      refreshReadiness();
    }

    function numFrom(v) { return typeof v === 'function' ? v() : v; }

    // 取英文標準地名(language=en);前端 Places Details(New),用瀏覽器 key。
    //   best-effort:失敗不擋提交(名稱僅供顯示/稽核,不進排盤);回退用顯示名。
    async function fetchEnglishPlace(placeId) {
      const url = `https://places.googleapis.com/v1/places/${encodeURIComponent(placeId)}?languageCode=en`;
      const res = await fetch(url, {
        headers: {
          'X-Goog-Api-Key': GOOGLE_KEY,
          'X-Goog-FieldMask': 'displayName,formattedAddress,addressComponents',
        },
      });
      if (!res.ok) throw new Error(`places details ${res.status}`);
      const data = await res.json();
      const nameEn = (data.displayName && data.displayName.text) || data.formattedAddress || '';
      const country = (data.addressComponents || [])
        .find(c => (c.types || []).includes('country'));
      return {
        nameEn,
        country: (country && country.longText) || '',
        formattedEn: data.formattedAddress || '',
      };
    }

    // ────────────────────────────────────────────────────────────
    // 真太陽時計算(純函式,可單測)
    //   local(當地牆鐘) --offset--> UTC --經度--> 地方平時 LMT --均時差--> 真太陽時
    //   輸出:真太陽時的「日期 + 時辰編碼」。編碼與現行 birth_hour 一致(早子=0、晚子=23)。
    //   E2E 四案(吉隆坡1982 / Taipei基準 / 午夜邊界 / 經度正負號)可在 console 用
    //   window.__trueSolar 直接驗。
    // ────────────────────────────────────────────────────────────
    function localToTrueSolar(local, lng, totalOffsetSeconds) {
      // 1) 當地牆鐘 → UTC。把當地時間當成 UTC 秒數,再扣掉 offset(含 DST)。
      const localAsUTC = Date.UTC(local.year, local.month - 1, local.day, local.hour, local.minute);
      const utcMs = localAsUTC - totalOffsetSeconds * 1000;
      // 2) 經度修正 → 地方平時(東經正,每 1° = 4 分 = 240 秒)。
      //    走 UTC + lng/15,標準經線已被 offset 吸收,不再減標準經線(避免 DST 重複計)。
      const lmtMs = utcMs + lng * 240 * 1000;
      // 3) 均時差(NOAA)→ 真太陽時。
      const lmt = new Date(lmtMs);
      const eotMin = equationOfTimeMinutes(lmt.getUTCFullYear(), lmt.getUTCMonth() + 1, lmt.getUTCDate(), lmt.getUTCHours());
      const trueMs = lmtMs + eotMin * 60 * 1000;
      const t = new Date(trueMs);
      const H = t.getUTCHours();
      return {
        year: t.getUTCFullYear(),
        month: t.getUTCMonth() + 1,
        day: t.getUTCDate(),          // 真太陽時實際日期(如實換日)
        hour: H,
        minute: t.getUTCMinutes(),
        code: hourToShichenCode(H),   // 時辰編碼(送 birth_hour)
      };
    }

    // 真太陽時「時」→ 時辰編碼(0,1,3,…,21,23)。晚子=23、早子=0、其餘取時辰起始時。
    function hourToShichenCode(H) {
      if (H === 23) return 23; // 晚子(23:00–23:59)→ 引擎會做 +1
      if (H === 0) return 0;   // 早子(00:00–00:59)→ 引擎維持當日
      return (H % 2 === 1) ? H : H - 1;
    }

    function dayOfYear(y, m, d) {
      const isLeap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
      const days = [31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let n = d;
      for (let i = 0; i < m - 1; i++) n += days[i];
      return n;
    }

    // NOAA 均時差(分鐘)。標準 NOAA solar 公式。
    function equationOfTimeMinutes(y, m, d, hour) {
      const doy = dayOfYear(y, m, d);
      const gamma = (2 * Math.PI / 365) * (doy - 1 + (hour - 12) / 24);
      const eot = 229.18 * (
        0.000075
        + 0.001868 * Math.cos(gamma)
        - 0.032077 * Math.sin(gamma)
        - 0.014615 * Math.cos(2 * gamma)
        - 0.040849 * Math.sin(2 * gamma)
      );
      return eot; // 分鐘
    }

    // 暴露純函式供 E2E 手動驗證
    window.__trueSolar = { localToTrueSolar, equationOfTimeMinutes, hourToShichenCode, dayOfYear };

    // ────────────────────────────────────────────────────────────
    // 送出流程
    // ────────────────────────────────────────────────────────────
    function bindForm() {
      const form = document.getElementById('chart-form');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const local = {
          year:   parseInt(document.getElementById('birth_year').value, 10),
          month:  parseInt(document.getElementById('birth_month').value, 10),
          day:    parseInt(document.getElementById('birth_day').value, 10),
          hour:   parseInt(document.getElementById('birth_hour').value, 10),
          minute: parseInt(document.getElementById('birth_minute').value, 10),
        };
        const base = {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          display_name: document.getElementById('display_name').value.trim(),
          gender: document.getElementById('gender').value,
          language: document.getElementById('language').value,
        };

        // 基本驗證
        const error = validateInputs(base, local);
        if (error) { showError(error); return; }
        if (base.password !== document.getElementById('password_confirm').value) {
          showError(F.t('ac.errPwMismatch')); return;
        }
        // (c) 同意聲明 與 newsletter 各自獨立判斷
        if (!document.getElementById('subject_consent').checked) {
          showError(F.t('ac.errSubjectConsent')); return;
        }
        if (!document.getElementById('newsletter_consent').checked) {
          showError(F.t('ac.errConsent')); return;
        }
        // 地點必須已選定(理論上未選時鈕已 disabled,這是雙保險)
        if (!selectedPlace) { showError(F.t('ac.errPlace')); return; }

        setSubmitting(true);
        try {
          // 1) 取時區 offset(fail-closed)
          const tz = await resolveTimezone(selectedPlace.lat, selectedPlace.lng, local);

          // 2) 算真太陽時 → 時辰編碼 + 真太陽時日期
          const ts = localToTrueSolar(local, selectedPlace.lng, tz.totalOffsetSeconds);

          // 3) 英文標準地名(best-effort,失敗不擋)
          let nameEn = selectedPlace.name_display, country = '';
          try {
            const en = await fetchEnglishPlace(selectedPlace.place_id);
            nameEn = en.nameEn || nameEn;
            country = en.country || '';
          } catch (enErr) {
            console.warn('[places] english name fallback:', enErr);
          }

          // 4) original_input(完整原始輸入 + 換算稽核)
          const original_input = {
            local: { year: local.year, month: local.month, day: local.day, hour: local.hour, minute: local.minute },
            place: {
              place_id: selectedPlace.place_id,
              lat: selectedPlace.lat,
              lng: selectedPlace.lng,
              name_en: nameEn,
              name_display: selectedPlace.name_display,
            },
            iana_timezone: tz.timeZoneId,
            utc_offset_minutes: Math.round(tz.totalOffsetSeconds / 60),
            true_solar: {
              year: ts.year, month: ts.month, day: ts.day,
              hour: ts.hour, minute: ts.minute,
              birth_hour_code: ts.code,
            },
          };

          // 5) payload:排盤三欄 = 真太陽時日期;birth_hour = 時辰編碼
          const payload = {
            email: base.email,
            password: base.password,
            display_name: base.display_name,
            birth_year: ts.year,
            birth_month: ts.month,
            birth_day: ts.day,
            birth_hour: ts.code,
            birth_minute: local.minute,          // 原始輸入分鐘(引擎不讀,存查)
            birth_country: country || nameEn || 'Unknown',
            birth_city: nameEn || selectedPlace.name_display || 'Unknown',
            birth_timezone: tz.timeZoneId,
            gender: base.gender,
            language: base.language,
            original_input,
          };

          const res = await fetch(EF_SUBMIT_URL, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

          // v7(決策 5-A)：submit_birth_data 的 Step 4(撈 job) 已降為 best-effort,
          //   撈不到時回 job_id: null。URLSearchParams 會把 null 字串化成 "null"
          //   (truthy) → 繞過 submitted.html 的 falsy 守衛 → 參考編號欄顯示 "null"。
          //   故僅在確實有值時才帶入此參數;缺參數時 submitted.html 自然略過參考編號,
          //   其餘流程(信箱提示、完成通知信、命盤)不受影響。
          const params = new URLSearchParams({ email: base.email });
          if (data.job_id) params.set('job_id', data.job_id);
          window.location.href = `submitted.html?${params.toString()}`;
        } catch (err) {
          console.error('Submit error:', err);
          // fail-closed:時區解析失敗 → 明確「怎麼辦」訊息
          const msg = err && err.__timezone ? F.t('ac.errTimezone') : (err.message || F.t('ac.errGeneric'));
          showError(msg);
          setSubmitting(false);
        }
      });
    }

    // 時區解析(fail-closed:失敗一律拋錯、標記 __timezone,不猜 offset)
    async function resolveTimezone(lat, lng, local) {
      let res;
      try {
        res = await fetch(EF_RESOLVE_TZ_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            lat, lng,
            year: local.year, month: local.month, day: local.day,
            hour: local.hour, minute: local.minute,
          }),
        });
      } catch (netErr) {
        const e = new Error('timezone network error'); e.__timezone = true; throw e;
      }
      if (!res.ok) {
        const e = new Error('timezone resolution failed'); e.__timezone = true; throw e;
      }
      const data = await res.json();
      if (typeof data.totalOffsetSeconds !== 'number') {
        const e = new Error('timezone bad response'); e.__timezone = true; throw e;
      }
      return data;
    }

    function validateInputs(base, local) {
      if (!base.display_name) return F.t('ac.errName');
      if (!base.email) return F.t('ac.errEmail');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(base.email)) return F.t('ac.errEmailInvalid');
      if (!base.password) return F.t('ac.errPwEmpty');
      if (base.password.length < 8) return F.t('ac.errPwShort');
      if (!local.year) return F.t('ac.errYear');
      if (!local.month) return F.t('ac.errMonth');
      if (!local.day) return F.t('ac.errDay');
      if (Number.isNaN(local.hour)) return F.t('ac.errHour');
      if (Number.isNaN(local.minute)) return F.t('ac.errMinute');
      if (!base.gender) return F.t('ac.errGender');
      if (!['zh-TW','zh-CN','en'].includes(base.language)) return F.t('ac.errLang');
      const date = new Date(local.year, local.month - 1, local.day);
      if (date.getFullYear() !== local.year || date.getMonth() !== local.month - 1 || date.getDate() !== local.day) {
        return F.t('ac.errDate');
      }
      return null;
    }

    // 送出鈕就緒判斷:必須已選定地點、且非提交中(fail-closed:未就緒 disabled)
    function refreshReadiness() {
      const btn = document.getElementById('submit-btn');
      if (!btn) return;
      btn.disabled = submitting || !selectedPlace;
    }

    function setSubmitting(on) {
      submitting = on;
      const btn = document.getElementById('submit-btn');
      if (on) {
        btn.querySelector('.btn-text').textContent = F.t('ac.submitting');
        btn.querySelector('.btn-arrow').textContent = '...';
      } else {
        btn.querySelector('.btn-text').textContent = F.t('ac.submit');
        btn.querySelector('.btn-arrow').textContent = '→';
      }
      refreshReadiness();
    }

    function showError(msg) {
      const box = document.getElementById('error-message');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function clearError() {
      document.getElementById('error-message').style.display = 'none';
    }
  </script>
</body>
</html>
