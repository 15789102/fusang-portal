<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的問事紀錄 - FuSang Vision</title>
<link rel="stylesheet" href="fs-v2.css" />
<style>
  /* 我的問事紀錄 — 卡片清單（共用樣式由 consultation-common.js 注入、已冷藍）*/
  .rec-card { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 26px; background: #ffffff; border: 1px solid var(--rule); border-radius: 14px; cursor: pointer; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; }
  .rec-card:hover { transform: translateY(-2px); border-color: var(--accent-soft); box-shadow: 0 10px 30px -14px rgba(41, 98, 131, 0.18); }
  .rec-card + .rec-card { margin-top: 14px; }
  .rec-main { min-width: 0; }
  .rec-subj { font-family: var(--font-serif-zh); font-size: 18px; font-weight: 600; color: var(--ink-darkest); letter-spacing: 0.02em; }
  .rec-ref { font-family: var(--font-sans); font-size: 11px; color: var(--ink-faint); margin-left: 8px; }
  .rec-date { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-light); margin-top: 6px; letter-spacing: 0.04em; }
  .rec-right { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .rec-pill { font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.06em; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
  .rec-pill.active { color: var(--accent-deep); background: var(--accent-pale); }
  .rec-pill.feedback { color: var(--gold); background: rgba(184, 148, 92, 0.12); }
  .rec-pill.done { color: var(--ink-mid); background: var(--bg-soft-2); }
  .rec-arrow { color: var(--ink-faint); transition: transform 0.3s, color 0.3s; font-size: 16px; }
  .rec-card:hover .rec-arrow { transform: translateX(3px); color: var(--accent-soft); }

  /* ════════ v2 視覺層（問事紀錄）— 限定 .fs-v2；與流月清單同一套列表語彙 ════════ */
  body.consult-page.fs-v2 { background: #ffffff; }
  .fs-v2 .rec-card {
    gap: 24px; padding: 24px 16px; margin: 0; background: transparent; border: 0; border-top: 1px solid var(--v2-line); border-radius: 0;
    box-shadow: none; transform: none; transition: background-color .2s;
  }
  .fs-v2 .rec-card + .rec-card { margin-top: 0; }
  .fs-v2 #cons-body > .rec-card:last-of-type { border-bottom: 1px solid var(--v2-line); }
  .fs-v2 .rec-card:hover { background: var(--v2-tint-soft); transform: none; box-shadow: none; }
  .fs-v2 .rec-card:focus-visible { outline: 2px solid var(--v2-blue); outline-offset: -2px; }
  .fs-v2 .rec-subj { font-family: var(--v2-font-cjk); font-size: 18px; line-height: 28px; font-weight: 500; letter-spacing: 0; color: var(--v2-ink); }
  .fs-v2 .rec-ref { font-family: var(--v2-font-latin); font-size: 12px; color: var(--v2-faint); }
  .fs-v2 .rec-date { margin-top: 2px; font-family: var(--v2-font-cjk); font-size: 13px; letter-spacing: 0; color: var(--v2-muted); }
  .fs-v2 .rec-pill { padding: 2px 10px; border-radius: 0; font-family: var(--v2-font-cjk); font-size: 13px; line-height: 22px; font-weight: 600; letter-spacing: 0; }
  .fs-v2 .rec-pill.active { color: var(--v2-blue); background: var(--v2-tint); border: 1px solid var(--v2-blue-line); }
  .fs-v2 .rec-pill.feedback { color: var(--v2-ink); background: #ffffff; border: 1px solid var(--v2-ink); }
  .fs-v2 .rec-pill.done { color: var(--v2-muted); background: #f7f7f7; border: 1px solid var(--v2-line); }
  .fs-v2 .rec-arrow { color: var(--v2-muted); }
  .fs-v2 .rec-card:hover .rec-arrow { color: var(--v2-blue); }
  .fs-v2 #cons-body > div:not(.rec-card):not(.cons-card) { margin-top: 32px !important; }
  .fs-v2 #new-btn { width: auto; min-width: 200px; }
  @media (max-width: 599px) {
    .fs-v2 .rec-card { flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px 4px; }
    .fs-v2 .rec-right { flex-wrap: wrap; }
    .fs-v2 .rec-arrow { display: none; }
    .fs-v2 #new-btn { width: 100%; }
  }
</style>
</head>
<body class="consult-page fs-v2">

<div id="site-header"></div>
<div id="consult-nav"></div>

<div class="fs-page">
  <div class="cons-wrap">
    <div class="cons-hero">
      <div class="cons-eyebrow" id="hero-eyebrow">My Consultations</div>
      <h1 class="cons-title" id="hero-title">我的問事紀錄</h1>
      <div class="cons-rule"></div>
    </div>
    <div id="cons-loading" class="cons-loading">載入中…</div>
    <div id="cons-body"></div>
  </div>
</div>

<div id="site-footer"></div>

<script type="module">
  window.FS_ACTIVE_PAGE = 'consultation';
  import {
    initConsult,
    pick, getMyTickets,
    subjLabel, STATUS_LABEL, fmtDate, refCode, statusText,
    isActive, isPendingDraft, needsFeedback,
    el, esc,
  } from './consultation-common.js';

  function applyStaticText() {
    document.title = pick('我的問事紀錄 - FuSang Vision', '我的问事纪录 - FuSang Vision', 'My Consultations - FuSang Vision');
    document.getElementById('hero-eyebrow').textContent = pick('我的問事紀錄', '我的问事纪录', 'My Consultations');
    document.getElementById('hero-title').textContent   = pick('我的問事紀錄', '我的问事纪录', 'My Consultations');
  }

  let lastTickets = null;
  function renderBody(tickets) {
    lastTickets = tickets;
    document.getElementById('cons-loading').style.display = 'none';
    const body = document.getElementById('cons-body');
    body.innerHTML = '';

    // 只列已付款的（pending 未付款草稿不列入正式紀錄）
    const rows = tickets.filter((t) => !isPendingDraft(t));

    if (!rows.length) {
      body.appendChild(cardEmpty());
      return;
    }

    // 進行中置頂，其餘依時間
    rows.sort((a, b) => {
      const ai = isActive(a) ? 0 : 1;
      const bi = isActive(b) ? 0 : 1;
      if (ai !== bi) return ai - bi;
      return new Date(b.created_at) - new Date(a.created_at);
    });

    rows.forEach((t) => body.appendChild(rowItem(t)));

    // 底部：新問事入口（無進行中才顯示）
    if (!rows.some(isActive)) {
      const cta = el('div');
      cta.style.marginTop = '20px';
      cta.innerHTML = `<button class="cons-btn" id="new-btn">${pick('提交新的問事', '提交新的问事', 'New consultation')}</button>`;
      cta.querySelector('#new-btn').addEventListener('click', () => { window.location.href = 'consultation-form.html'; });
      body.appendChild(cta);
    }
  }

  applyStaticText();

  (async () => {
    const session = await initConsult('list');
    if (!session) return;
    const tickets = await getMyTickets();
    renderBody(tickets);
  })();

  // 即時語言切換：重套標題 + 以快取票券重繪清單
  window.addEventListener('i18n:changed', () => {
    applyStaticText();
    if (lastTickets) renderBody(lastTickets);
  });

  function rowItem(t) {
    const row = el('div', 'rec-card');
    const active = isActive(t);
    const fb = needsFeedback(t);
    const st = active ? (STATUS_LABEL[t.status] || t.status) : statusText(t);

    row.innerHTML =
      `<div class="rec-main">` +
        `<div class="rec-subj">${subjLabel(t.subject)}<span class="rec-ref">#${refCode(t.id)}</span></div>` +
        `<div class="rec-date">${fmtDate(t.created_at)}</div>` +
      `</div>` +
      `<div class="rec-right">` +
        `<span class="rec-pill ${active ? 'active' : 'done'}">${esc(st)}</span>` +
        (fb ? `<span class="rec-pill feedback">${pick('可回饋', '可反馈', 'Feedback')}</span>` : '') +
        `<span class="rec-arrow">→</span>` +
      `</div>`;

    row.setAttribute('role', 'link');
    row.setAttribute('tabindex', '0');
    row.addEventListener('click', () => { window.location.href = `consultation-detail.html?id=${t.id}`; });
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter') row.click(); });
    return row;
  }

  function cardEmpty() {
    const c = el('div', 'cons-card soft');
    c.innerHTML =
      `<div class="card-kicker">${pick('尚無紀錄', '尚无纪录', 'No consultations yet')}</div>` +
      `<div class="empty-note">${pick(
        '你還沒有任何問事紀錄。',
        '你还没有任何问事纪录。',
        'You have not made any consultations yet.'
      )}<br><br><span class="link-inline" id="go-form">${pick('提交第一則問事 →', '提交第一则问事 →', 'Submit your first consultation →')}</span></div>`;
    c.querySelector('#go-form').addEventListener('click', () => { window.location.href = 'consultation-form.html'; });
    return c;
  }
</script>

</body>
</html>
