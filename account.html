<style>
  :root { --gold: #b8945c; --gold-soft: #c9ab7d; }

  .acc-wrap { max-width: 720px; margin: 0 auto; padding: 64px 32px 80px; }
  @media (max-width: 600px) { .acc-wrap { padding: 44px 22px 64px; } }

  /* hero */
  .acc-hero { margin-bottom: 44px; }
  .acc-eyebrow {
    font-family: var(--font-sans);
    font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px;
  }
  .acc-title {
    font-family: var(--font-serif-zh);
    font-weight: 500; font-size: clamp(28px, 5vw, 40px);
    color: var(--ink-darkest); letter-spacing: 0.04em;
  }
  .acc-title-en {
    font-family: var(--font-serif-en); font-style: italic;
    font-size: 16px; color: var(--ink-light); margin-top: 6px; letter-spacing: 0.04em;
  }
  .acc-rule { margin-top: 24px; width: 56px; height: 1px; background: var(--gold); opacity: 0.6; }

  /* card */
  .acc-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px 32px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .acc-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 36px; height: 36px;
    border-top: 1px solid var(--gold); border-right: 1px solid var(--gold);
    opacity: 0.4; border-top-right-radius: 4px;
  }
  .acc-card-label {
    font-family: var(--font-sans); font-size: 10px;
    letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-light);
    padding: 22px 0 6px;
  }

  .acc-row {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--rule-soft-2);
  }
  .acc-row:last-child { border-bottom: none; }
  .acc-row-key {
    font-family: var(--font-serif-zh); font-size: 14px;
    color: var(--ink-mid); letter-spacing: 0.05em; flex-shrink: 0;
  }
  .acc-row-val {
    font-family: var(--font-serif-zh); font-size: 15.5px;
    color: var(--ink-darkest); letter-spacing: 0.04em; text-align: right;
    word-break: break-all;
  }
  .acc-row-val.muted { color: var(--ink-light); font-style: italic; }
  .acc-row-val code { font-family: 'Courier New', monospace; font-size: 13px; color: var(--ink-dark); }

  /* 購買狀況徽章 */
  .acc-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.06em;
    padding: 4px 12px; border-radius: 100px; white-space: nowrap;
  }
  .acc-badge.on { color: var(--t-lu); background: rgba(122,138,57,0.1); }
  .acc-badge.off { color: var(--ink-light); background: var(--rule-soft-2); }
  .acc-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  

  /* security */
  .acc-sec-desc {
    font-family: var(--font-serif-zh); font-size: 14px; line-height: 1.8;
    color: var(--ink-mid); padding: 20px 0 18px; letter-spacing: 0.02em;
  }
  .acc-btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-serif-zh); font-size: 15px; letter-spacing: 0.06em;
    color: var(--bg-card); background: var(--accent-deep);
    padding: 13px 28px; border-radius: 3px; cursor: pointer;
    transition: background 0.25s, transform 0.25s; margin-bottom: 24px;
  }
  .acc-btn:hover:not(:disabled) { background: #1d4448; transform: translateY(-1px); }
  .acc-btn:disabled { opacity: 0.55; cursor: default; }
  .acc-msg {
    font-family: var(--font-sans); font-size: 13px; line-height: 1.7;
    letter-spacing: 0.03em; padding: 0 0 24px; display: none;
  }
  .acc-msg.show { display: block; }
  .acc-msg.ok { color: var(--t-lu); }
  .acc-msg.err { color: var(--t-ji); }

  .acc-loading {
    text-align: center; padding: 90px 20px;
    font-family: var(--font-serif-zh); color: var(--ink-light);
    font-size: 15px; letter-spacing: 0.08em;
  }

  /* ── 顯示稱呼編輯（沿用月報設定卡的視覺語言）── */
  .nm-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .nm-edit-box { display: none; padding: 0 0 18px; }
  .nm-edit-box.show { display: block; }
  .nm-edit-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .nm-input {
    flex: 1 1 220px; min-width: 0;
    font-family: var(--font-serif-zh); font-size: 15px; color: var(--ink-darkest);
    padding: 9px 13px; border: 1px solid var(--rule); border-radius: 2px; background: var(--bg-primary);
    letter-spacing: 0.04em;
  }
  .nm-input:focus { outline: none; border-color: var(--accent-soft); }
  .nm-save-btn {
    font-family: var(--font-serif-zh); font-size: 14px; letter-spacing: 0.06em;
    color: var(--bg-card); background: var(--accent-deep); padding: 9px 20px; border-radius: 3px;
    cursor: pointer; border: none; transition: background 0.2s; flex-shrink: 0;
  }
  .nm-save-btn:hover:not(:disabled) { background: #1d4448; }
  .nm-save-btn:disabled { opacity: 0.5; cursor: default; }
  .nm-msg { margin-top: 12px; font-family: var(--font-serif-zh); font-size: 13px; line-height: 1.7; letter-spacing: 0.03em; display: none; }
  .nm-msg.show { display: block; }
  .nm-msg.ok { color: var(--t-lu); }
  .nm-msg.err { color: var(--t-ji); }
  .nm-hint { margin-top: 12px; font-family: var(--font-serif-zh); font-size: 12px; color: var(--ink-light); line-height: 1.6; letter-spacing: 0.02em; }

  /* ── 月報寄送設定卡（月報統一每月 1 號）── */
  .rd-current { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rd-current-day { font-family: var(--font-serif-zh); font-size: 16px; color: var(--ink-darkest); font-weight: 500; letter-spacing: 0.04em; }
  .rd-current-day.off { color: var(--ink-light); font-weight: 400; }
  /* 「更改」連結樣式（顯示名稱卡共用）*/
  .rd-edit-link {
    font-family: var(--font-serif-zh); font-size: 13px; letter-spacing: 0.06em; color: var(--accent-deep);
    cursor: pointer; border-bottom: 1px solid var(--accent-soft); transition: color 0.2s;
  }
  .rd-edit-link:hover { color: #1d4448; }
  a.rd-edit-link { text-decoration: none; }

  /* 取消月報 */
  .rd-cancel-row { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule-soft-2); }
  .rd-cancel-link {
    font-family: var(--font-serif-zh); font-size: 13px; letter-spacing: 0.05em; color: var(--ink-light);
    cursor: pointer; transition: color 0.2s;
  }
  .rd-cancel-link:hover { color: var(--t-ji); }
  .rd-cancel-msg { margin-top: 12px; font-family: var(--font-serif-zh); font-size: 13px; line-height: 1.7; letter-spacing: 0.02em; display: none; }
  .rd-cancel-msg.show { display: block; }
  .rd-cancel-msg.err { color: var(--t-ji); }
  .rd-cancel-msg.ok { color: var(--ink-mid); }

  /* ════════════════════════════════════════════════════════════════
     ▼ v2 視覺層（設計師 v1.0 語彙）— 以下全部限定 .fs-v2，疊在原有規則之上
     版型：頁首橫幅 ＋ 分區列（左：區段名稱 ｜ 右：欄位列），不再用浮框卡片
     ════════════════════════════════════════════════════════════════ */
  body.account-page.fs-v2 { background: #ffffff; }
  .fs-v2 .acc-wrap { width: calc(100% - 2 * var(--v2-gutter)); max-width: var(--v2-max); margin: 0 auto; padding: 32px 0 96px; }

  /* 頁首橫幅 */
  .fs-v2 .acc-hero {
    position: relative; min-height: 179px; margin: 0 0 16px; padding: 32px; overflow: hidden;
    background: #ffffff url('assets/v2/banner.webp') center / cover no-repeat;
  }
  .fs-v2 .acc-eyebrow { margin: 0 0 8px; font-family: var(--v2-font-latin); font-size: 12px; line-height: 20px; letter-spacing: 0; text-transform: uppercase; color: var(--v2-muted); }
  .fs-v2 .acc-title { margin: 0 0 8px; font-family: var(--v2-font-cjk); font-size: 36px; line-height: 50px; font-weight: 500; letter-spacing: 0; color: var(--v2-ink); }
  .fs-v2 .acc-title-en { margin: 0; font-family: var(--v2-font-latin); font-style: normal; font-size: 16px; line-height: 29px; letter-spacing: 0; color: var(--v2-muted); }
  .fs-v2 .acc-rule { display: none; }

  /* 分區列 */
  .fs-v2 .acc-card {
    display: grid; grid-template-columns: 240px minmax(0, 1fr); column-gap: 48px; align-items: start;
    margin: 0; padding: 32px 0; background: transparent; border: 0; border-top: 1px solid var(--v2-line); border-radius: 0; overflow: visible;
  }
  .fs-v2 .acc-card:last-child { border-bottom: 1px solid var(--v2-line); }
  .fs-v2 .acc-card::before { content: none; }
  .fs-v2 .acc-card > * { grid-column: 2; }
  .fs-v2 .acc-card > .acc-card-label { grid-column: 1; grid-row: 1 / span 20; padding: 0; font-family: var(--v2-font-cjk); font-size: 18px; line-height: 28px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--v2-ink); }

  .fs-v2 .acc-row { align-items: center; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--v2-line-soft); }
  .fs-v2 .acc-card-label + .acc-row { padding-top: 0; }
  /* JS 以 style.display='block' 顯示寄送 / 訂閱卡 → v2 下維持分區格線 */
  .fs-v2 .acc-card[style*="display: block"],
  .fs-v2 .acc-card[style*="display:block"] { display: grid !important; }
  /* 顯示名稱列：原本內嵌去掉分隔線（為了貼齊編輯框），v2 補回一致的分隔 */
  .fs-v2 .acc-row:has(#acc-name) { padding-bottom: 14px !important; border-bottom: 1px solid var(--v2-line-soft) !important; }
  .fs-v2 .acc-row:has(#acc-name) + .nm-edit-box.show { padding-top: 16px; }
  .fs-v2 .acc-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .fs-v2 .acc-row-key { font-family: var(--v2-font-cjk); font-size: 14px; line-height: 24px; letter-spacing: 0; color: var(--v2-muted); }
  .fs-v2 .acc-row-val { font-family: var(--v2-font-cjk); font-size: 15px; line-height: 24px; letter-spacing: 0; color: var(--v2-ink); overflow-wrap: anywhere; word-break: normal; }
  .fs-v2 .acc-row-val.muted { color: var(--v2-faint); font-style: normal; }
  .fs-v2 .acc-row-val code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; color: var(--v2-muted); }

  /* 狀態徽章 */
  .fs-v2 .acc-badge { gap: 6px; padding: 2px 10px; border-radius: 0; font-family: var(--v2-font-cjk); font-size: 13px; line-height: 22px; font-weight: 600; letter-spacing: 0; }
  .fs-v2 .acc-badge.on { color: var(--v2-blue); background: var(--v2-tint); border: 1px solid var(--v2-blue-line); }
  .fs-v2 .acc-badge.off { color: var(--v2-muted); background: #f7f7f7; border: 1px solid var(--v2-line); }
  .fs-v2 .acc-plan-line { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }

  /* 連結型操作（更改 / 前往流月頁 / 查看方案）*/
  .fs-v2 .rd-edit-link { font-family: var(--v2-font-cjk); font-size: 14px; line-height: 22px; letter-spacing: 0; color: var(--v2-ink); border-bottom: 1px solid var(--v2-ink); cursor: pointer; transition: color .15s, border-color .15s; }
  .fs-v2 .rd-edit-link:hover { color: var(--v2-blue); border-bottom-color: var(--v2-blue); }
  .fs-v2 .rd-current-day { font-family: var(--v2-font-cjk); font-size: 15px; line-height: 24px; font-weight: 500; letter-spacing: 0; color: var(--v2-ink); }
  .fs-v2 .rd-current-day.off { color: var(--v2-muted); font-weight: 400; }
  .fs-v2 .rd-cancel-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--v2-line-soft); }
  .fs-v2 .rd-cancel-link { font-family: var(--v2-font-cjk); font-size: 14px; line-height: 22px; letter-spacing: 0; color: var(--v2-muted); border-bottom: 1px solid transparent; }
  .fs-v2 .rd-cancel-link:hover { color: #a8505c; border-bottom-color: #a8505c; }

  /* 顯示名稱編輯（設計師 form 語彙）*/
  .fs-v2 .nm-edit-box { padding: 4px 0 16px; }
  .fs-v2 .nm-edit-row { gap: 12px; }
  .fs-v2 .nm-input { height: 48px; padding: 0 16px; background: #ffffff; border: 1px solid var(--v2-line); border-radius: 0; font-family: var(--v2-font-cjk); font-size: 15px; letter-spacing: 0; color: var(--v2-ink); }
  .fs-v2 .nm-input:focus { outline: none; border-color: var(--v2-blue); box-shadow: 0 0 0 3px var(--v2-tint); }
  .fs-v2 .nm-save-btn { min-height: 48px; padding: 0 24px; background: var(--v2-ink); color: #ffffff; border: 1px solid var(--v2-ink); border-radius: 0; font-family: var(--v2-font-cjk); font-size: 14px; font-weight: 600; letter-spacing: 0; }
  .fs-v2 .nm-save-btn:hover:not(:disabled) { background: var(--v2-ink-hover); }
  .fs-v2 .nm-hint { font-family: var(--v2-font-cjk); font-size: 12px; line-height: 20px; letter-spacing: 0; color: var(--v2-faint); }

  /* 說明文字 + 按鈕 */
  .fs-v2 .acc-sec-desc { padding: 0 0 16px; font-family: var(--v2-font-cjk); font-size: 14px; line-height: 24px; letter-spacing: 0; color: var(--v2-muted); }
  .fs-v2 .acc-btn {
    justify-self: start; display: inline-flex; align-items: center; justify-content: center; min-width: 180px; min-height: 48px; margin: 0; padding: 12px 28px;
    background: #ffffff; color: var(--v2-ink); border: 1px solid var(--v2-ink); border-radius: 0; transform: none;
    font-family: var(--v2-font-cjk); font-size: 14px; font-weight: 600; line-height: 22px; letter-spacing: 0; transition: background .15s, color .15s, border-color .15s;
  }
  .fs-v2 .acc-btn:hover:not(:disabled) { background: var(--v2-tint); border-color: var(--v2-blue); color: var(--v2-blue); transform: none; }
  .fs-v2 .acc-btn:focus-visible,
  .fs-v2 .rd-edit-link:focus-visible,
  .fs-v2 .rd-cancel-link:focus-visible { outline: 2px solid var(--v2-blue); outline-offset: 2px; }

  /* 訊息 */
  .fs-v2 .acc-msg,
  .fs-v2 .nm-msg,
  .fs-v2 .rd-cancel-msg { padding: 0; margin: 12px 0 0; font-family: var(--v2-font-cjk); font-size: 13px; line-height: 22px; letter-spacing: 0; }
  .fs-v2 .acc-msg.ok, .fs-v2 .nm-msg.ok { color: var(--v2-blue); }
  .fs-v2 .rd-cancel-msg.ok { color: var(--v2-muted); }
  .fs-v2 .acc-msg.err, .fs-v2 .nm-msg.err, .fs-v2 .rd-cancel-msg.err { color: #a8505c; }

  .fs-v2 .acc-loading { padding: 120px 0; font-family: var(--v2-font-cjk); font-size: 14px; letter-spacing: 0; color: var(--v2-muted); }

  @media (max-width: 799px) {
    .fs-v2 .acc-wrap { padding-top: 16px; }
    .fs-v2 .acc-hero { padding: 24px; min-height: 169px; background-position: 60% center; }
    .fs-v2 .acc-title { font-size: 28px; line-height: 42px; }
    .fs-v2 .acc-title-en { font-size: 14px; line-height: 24px; }
    .fs-v2 .acc-card { grid-template-columns: minmax(0, 1fr); padding: 24px 0; }
    .fs-v2 .acc-card > * { grid-column: 1; }
    .fs-v2 .acc-card > .acc-card-label { grid-row: auto; margin: 0 0 12px; font-size: 16px; line-height: 26px; }
    .fs-v2 .acc-row { flex-wrap: wrap; gap: 4px 16px; }
    .fs-v2 .acc-btn { width: 100%; }
  }
</style>
</head>
<body class="account-page fs-v2">

<div id="site-header"></div>

<div class="fs-page">
  <div class="acc-wrap">

    <div id="acc-loading" class="acc-loading" data-i18n="acc.loading">載入中…</div>

    <div id="acc-content" style="display:none;">
      <div class="acc-hero">
        <div class="acc-eyebrow" data-i18n="acc.heroEyebrow">帳戶</div>
        <h1 class="acc-title" data-i18n="acc.title">我的帳戶</h1>
        <div class="acc-title-en">Your profile &amp; settings</div>
        <div class="acc-rule"></div>
      </div>

      <!-- 個人資料 -->
      <div class="acc-card">
        <div class="acc-card-label" data-i18n="acc.lblProfile">基本資料</div>
        <div class="acc-row" style="border-bottom:none; padding-bottom:8px;">
          <span class="acc-row-key" data-i18n="acc.kName">顯示名稱</span>
          <span class="acc-row-val">
            <span class="nm-line">
              <span id="acc-name">—</span>
              <span class="rd-edit-link" id="nm-edit-link" role="button" tabindex="0" aria-controls="nm-edit-box" data-i18n="acc.nmChange">更改</span>
            </span>
          </span>
        </div>
        <div class="nm-edit-box" id="nm-edit-box">
          <div class="nm-edit-row">
            <input type="text" id="nm-input" class="nm-input" maxlength="50"
                   autocomplete="nickname" placeholder="想被怎麼稱呼？" data-i18n-placeholder="acc.nmPh" />
            <button class="nm-save-btn" id="nm-save-btn" data-i18n="acc.save">儲存</button>
          </div>
          <div class="nm-msg" id="nm-msg"></div>
          <div class="nm-hint" data-i18n="acc.nmHint">此稱呼僅用於畫面顯示，最多 50 字。命盤與報告內容不受影響。</div>
        </div>
        <div class="acc-row">
          <span class="acc-row-key" data-i18n="acc.kEmail">電子郵件</span>
          <span class="acc-row-val" id="acc-email">—</span>
        </div>
        <div class="acc-row">
          <span class="acc-row-key" data-i18n="acc.kGender">性別</span>

      <!-- 出生資料 -->
      <div class="acc-card">

          <span class="acc-row-key" data-i18n="acc.kBdate">出生日期</span>

        </div>
        <div class="acc-row">
          <span class="acc-row-key" data-i18n="acc.kBtime">出生時間</span>
          <span class="acc-row-val" id="acc-btime">—</span>
        </div>
        <div class="acc-row">
          <span class="acc-row-key" data-i18n="acc.kBplace">出生地</span>
          <span class="acc-row-val" id="acc-bplace">—</span>
        </div>
        <div class="acc-row">
          <span class="acc-row-key">Chart Session</span>

<!-- 購買狀況 -->
      <div class="acc-card">
        <div class="acc-card-label" data-i18n="acc.lblPlan">購買狀況</div>
        <div class="acc-row">
          <span class="acc-row-key" data-i18n="acc.kSihua">四化解鎖（全部四層）</span>
          <span class="acc-row-val" id="acc-sihua-status">—</span>
        </div>
        <!-- 2026-09：月訂閱／年方案停售，「付費月報訂閱」列移除（流月四化併入四化解鎖）-->
      </div>

      <!-- 月報寄送設定（月報統一每月 1 號；開關 = user_profiles.monthly_enabled）-->
      <div class="acc-card" id="acc-delivery-card" style="display:none;">

<script type="module">
  import { supabase, requireAuth } from './components.js';

  const F = window.FSI18N;

  // 存下資料,供語言切換重繪(只讀顯示);監聽只綁一次
  const S = {
    email: '', name: '—', userId: '',
    hasName: false,          // true=display_name 有值; false=name 目前是 email 前綴 fallback
    birth: undefined,        // undefined=未載入, null=無資料, object=有
    sessionId: undefined,    // undefined=未載入, null=尚未生成, string=有
    billing: undefined,      // undefined=未載入, null/object
    deliveryCanceled: false, // 本 session 剛取消月報
  };

  function setMuted(el, on) { if (el) el.classList.toggle('muted', on); }
  function fmtDate(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  // ── 只讀顯示:隨語言重繪(不綁監聽)──
  function renderStatic() {
    document.title = F.t('acc.docTitle');
    const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    set('acc-name', S.name || '—');
    set('acc-email', S.email || '—');

    // 稱呼儲存訊息是動態文案,換語言後會殘留舊語言 → 一律清掉(不重譯,語意為「本次操作結果」)
    const nmMsg = document.getElementById('nm-msg');
    if (nmMsg) { nmMsg.className = 'nm-msg'; nmMsg.textContent = ''; }

    const gEl = document.getElementById('acc-gender');
    const bdEl = document.getElementById('acc-bdate');
    const btEl = document.getElementById('acc-btime');
    const bpEl = document.getElementById('acc-bplace');
    if (S.birth) {
      const b = S.birth, g = String(b.gender);
      gEl.textContent = (g === 'male' || g === '1') ? F.t('acc.male')
        : (g === 'female' || g === '0') ? F.t('acc.female')
        : (b.gender || '—');
      bdEl.textContent = F.t('acc.birthDate')
        .replace('{y}', b.birth_year).replace('{m}', b.birth_month).replace('{d}', b.birth_day);
      const hh = String(b.birth_hour).padStart(2, '0');
      const mm = String(b.birth_minute ?? 0).padStart(2, '0');
      btEl.textContent = `${hh}:${mm}`;
      const place = [b.birth_city, b.birth_country].filter(Boolean).join(F.t('acc.placeSep'));
      bpEl.textContent = place || '—';
      [gEl, bdEl, btEl].forEach(el => setMuted(el, false));
      setMuted(bpEl, !place);
    } else if (S.birth === null) {
      [gEl, bdEl, btEl, bpEl].forEach(el => { el.textContent = F.t('acc.notProvided'); setMuted(el, true); });
    }

    if (S.sessionId !== undefined) set('acc-session', S.sessionId || F.t('acc.notGenerated'));

    if (S.billing !== undefined) { renderPlanStatus(S.billing); renderDelivery(); }
  }

  function renderPlanStatus(p) {
    const sihuaEl = document.getElementById('acc-sihua-status');
    if (!sihuaEl) return;
    const badge = (cls, txt) => `<span class="acc-badge ${cls}"><span class="dot"></span>${txt}</span>`;

    // 四化為一次性買斷、無到期概念 → 讀 user_profiles 欄位即為終值。
    // 2026-09 四化統一買斷：sihua_unlocked 解鎖全部四層（含流月）；月訂閱／年方案停售，不再顯示月報訂閱徽章。
    sihuaEl.innerHTML = (p && p.sihua_unlocked === true)
      ? badge('on', F.t('acc.sihuaOn'))
      : `<span class="acc-plan-line">${badge('off', F.t('acc.sihuaOff'))}<a class="rd-edit-link" href="pricing.html">${F.t('acc.viewPlans')}</a></span>`;
  }

  // 月報寄送設定：開關 = monthly_enabled。
  //   開啟 → 只能從流月頁（RPC monthly_generate_request 與閘門同交易寫入）或付款；本頁只提供連結。
  //   取消 → 本頁直接寫 monthly_enabled = false（RLS update_own，只能改自己的列）。
  function renderDelivery() {
    const p = S.billing;
    const card = document.getElementById('acc-delivery-card');
    if (!card) return;
    if (!p) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    const on = (p.monthly_enabled === true) && !S.deliveryCanceled;
    const st = document.getElementById('deliv-status');
    st.textContent = F.t(on ? 'acc.delivOn' : 'acc.delivOff');
    st.classList.toggle('off', !on);
    document.getElementById('deliv-enable-link').style.display = on ? 'none' : 'inline';
    // 取消區塊：開啟中才顯示；剛取消時保留，讓「已取消」訊息留在畫面上
    document.getElementById('deliv-cancel-row').style.display = (on || S.deliveryCanceled) ? 'block' : 'none';
    document.getElementById('rd-cancel-link').style.display = on ? 'inline' : 'none';
  }

  // 語言切換 → 重繪只讀顯示 + 標題(靜態 data-i18n 由 header 切換的 applyI18n 處理)
  document.title = F.t('acc.docTitle');
  window.addEventListener('i18n:changed', renderStatic);

  // ── 綁定(只綁一次)──

  // v2：span 型按鈕可用鍵盤觸發（Enter / 空白鍵 = 點擊）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target;
    if (t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName === 'SPAN') { e.preventDefault(); t.click(); }
  });

  // 顯示稱呼編輯
  //   display_name 是純顯示欄位:實查確認全 repo 與 6 個 DB 函數皆只用於呈現,
  //   歸屬鍵一律走 id / email,故使用者可自由修改而不影響任何判定。
  //   歸屬由 RLS 強制:user_profiles_update_own 的 using/with_check 皆為 auth.uid() = id,
  //   前端 .eq('id', userId) 只是讓 PostgREST 定位到列,不是安全邊界。
  //   長度/空白同時在 DB 層以 CHECK constraint 把關(user_profiles_display_name_len),
  //   前端驗證只為即時回饋 —— 使用者可繞過頁面直打 PostgREST,故不可只靠前端。
  const NAME_MAX = 50;
  function bindDisplayName(userId) {
    const link = document.getElementById('nm-edit-link');
    const box = document.getElementById('nm-edit-box');
    const input = document.getElementById('nm-input');
    const btn = document.getElementById('nm-save-btn');
    const msg = document.getElementById('nm-msg');
    if (!link || !box || !input || !btn || !msg) return;

    const show = (cls, txt) => { msg.className = 'nm-msg show ' + cls; msg.textContent = txt; };

    link.addEventListener('click', () => {
      const opening = !box.classList.contains('show');
      box.classList.toggle('show');
      if (opening) {
        // 以目前顯示值開場;S.name 在無 display_name 時是 email 前綴的 fallback,
        // 那不是使用者設定的值 → 不預填,讓輸入框留白。
        input.value = (S.hasName ? S.name : '');
        msg.className = 'nm-msg'; msg.textContent = '';
        input.focus();
      }
    });

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });

    btn.addEventListener('click', async () => {
      const val = input.value.trim();
      // 前端驗證:空白擋下、長度以碼點計(與 PG char_length 一致;JS .length 會把 emoji 算成 2)
      if (!val) { show('err', F.t('acc.nmErrEmpty')); return; }
      if ([...val].length > NAME_MAX) { show('err', F.t('acc.nmErrLong')); return; }

      btn.disabled = true;
      const { error } = await supabase
        .from('user_profiles')
        .update({ display_name: val })
        .eq('id', userId);
      btn.disabled = false;

      // supabase-js v2 不 throw DB 錯誤,回 { data, error } → 必須顯式檢查;
      // 依錯誤碼分支,不靜默吞:
      //   23514 = CHECK 違反(空白/超長,前端漏接時的最後一道)
      //   42501 = RLS 擋下(理論上只在改到他人列或凍結欄時發生)
      if (error) {
        const code = error.code || '';
        if (code === '23514') show('err', F.t('acc.nmErrLong'));
        else if (code === '42501') show('err', F.t('acc.nmErrDenied'));
        else show('err', F.t('acc.nmErrFail').replace('{msg}', error.message || F.t('acc.tryLater')));
        return;
      }

      // 寫入成功 → 更新 S 並重繪(renderStatic 以 textContent 填值,使用者輸入不會被當 HTML 解析)
      S.name = val;
      S.hasName = true;
      renderStatic();
      show('ok', F.t('acc.nmSaved'));
      box.classList.remove('show');
    });
  }

  function bindDelivery(userId) {
    const p = S.billing;
    if (!p) return;

    const cancelLink = document.getElementById('rd-cancel-link');
    const cancelMsg = document.getElementById('rd-cancel-msg');
    cancelLink.addEventListener('click', async () => {
      let st = p.subscription_status;
      try {
        const { data: fresh } = await supabase.from('user_profiles').select('subscription_status').eq('id', userId).maybeSingle();
        if (fresh) st = fresh.subscription_status;
      } catch (_) {}
      if (st === 'active' || st === 'trialing') { cancelMsg.className = 'rd-cancel-msg show err'; cancelMsg.textContent = F.t('acc.cancelBlockedSub'); return; }
      const expiresAt = p.monthly_access_expires_at ? new Date(p.monthly_access_expires_at) : null;
      const isPrepaidActive = expiresAt && expiresAt.getTime() > Date.now();
      const confirmMsg = isPrepaidActive
        ? F.t('acc.cancelConfirmPrepaid').replace('{date}', fmtDate(expiresAt))
        : F.t('acc.cancelConfirm');
      if (!confirm(confirmMsg)) return;
      cancelLink.style.pointerEvents = 'none';
      const { error } = await supabase.from('user_profiles').update({ monthly_enabled: false }).eq('id', userId);
      if (error) { cancelLink.style.pointerEvents = 'auto'; cancelMsg.className = 'rd-cancel-msg show err'; cancelMsg.textContent = F.t('acc.cancelFail').replace('{msg}', error.message); return; }
      cancelMsg.className = 'rd-cancel-msg show ok'; cancelMsg.textContent = F.t('acc.cancelDone');
      S.deliveryCanceled = true;
      renderDelivery();
    });
  }

  async function openPortal() {
    const btn = document.getElementById('acc-portal');
    const msg = document.getElementById('acc-portal-msg');
    btn.disabled = true; btn.textContent = F.t('acc.opening'); msg.className = 'acc-msg';
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch(`${window.CFG.SUPABASE_URL}/functions/v1/create-portal-session`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.error || F.t('acc.portalErr'));
      window.location.href = data.url;
    } catch (err) {
      msg.textContent = F.t('acc.portalFail').replace('{msg}', err.message || F.t('acc.tryLater'));
      msg.classList.add('show', 'err'); btn.disabled = false; btn.textContent = F.t('acc.manageSub');
    }
  }

  async function sendReset(email) {
    const btn = document.getElementById('acc-reset');
    const msg = document.getElementById('acc-reset-msg');
    btn.disabled = true; btn.textContent = F.t('acc.sending'); msg.className = 'acc-msg';
    try {
      const redirectTo = window.location.origin + window.location.pathname.replace(/account\.html$/, 'set-password.html');
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      msg.textContent = F.t('acc.resetSent').replace('{email}', email); msg.classList.add('show', 'ok'); btn.textContent = F.t('acc.resetSentBtn');
    } catch (err) {
      msg.textContent = F.t('acc.resetFail').replace('{msg}', err.message || F.t('acc.tryLater')); msg.classList.add('show', 'err'); btn.disabled = false; btn.textContent = F.t('acc.resetPw');
    }
  }

  // ── init ──
  (async () => {
    const session = await requireAuth();
    if (!session) return;
    S.email = session.user.email || '';
    S.userId = session.user.id;
    S.name = (S.email.split('@')[0]) || '—';

    try {
      const { data: profile } = await supabase.from('user_profiles').select('display_name').eq('id', S.userId).maybeSingle();
      // hasName 區分「使用者設定過的稱呼」與「email 前綴 fallback」:
      //   編輯框開場時只預填前者,避免把 fallback 誤存成真正的 display_name。
      if (profile && profile.display_name) { S.name = profile.display_name; S.hasName = true; }
    } catch (_) {}

    try {
      const { data: birth } = await supabase.from('user_birth_data')
        .select('birth_year, birth_month, birth_day, birth_hour, birth_minute, gender, birth_city, birth_country')
        .eq('user_id', S.userId).order('created_at', { ascending: false }).limit(1).maybeSingle();
      S.birth = birth || null;
    } catch (_) { S.birth = null; }

    try {
      const { data: job } = await supabase.from('chart_generation_jobs')
        .select('chart_session_id').eq('user_email', S.email).eq('status', 'done')
        .order('completed_at', { ascending: false, nullsFirst: false }).limit(1).maybeSingle();
      S.sessionId = job?.chart_session_id || null;
    } catch (_) { S.sessionId = null; }

    // billing 欄位
    //   2026-09：不再查 monthly_subscribed_live()（月訂閱／年方案停售，購買狀況只顯示四化解鎖）。
    //   subscription_status / monthly_access_expires_at 仍讀：取消寄送的舊訂閱防呆、訂閱管理卡顯示條件需要。
    const [billingRes] = await Promise.allSettled([
      supabase.from('user_profiles')
        .select('sihua_unlocked, subscription_status, current_period_end, monthly_access_expires_at, stripe_customer_id, monthly_enabled')
        .eq('id', S.userId).maybeSingle(),
    ]);
    // supabase-js v2 不 throw DB 錯誤，回 { data, error } → 必須顯式檢查 error
    S.billing = (billingRes.status === 'fulfilled' && !billingRes.value.error)
      ? (billingRes.value.data || null) : null;

    renderStatic();

    // 綁定(只一次)
    // 訂閱管理卡：僅仍有進行中舊月訂閱者顯示（四化解鎖為一次性付款，無需管理）
    const legacySub = S.billing && S.billing.stripe_customer_id &&
      (S.billing.subscription_status === 'active' || S.billing.subscription_status === 'trialing');
    if (legacySub) {
      document.getElementById('acc-billing-card').style.display = 'block';
      document.getElementById('acc-portal').addEventListener('click', openPortal);
    }
    bindDisplayName(S.userId);
    bindDelivery(S.userId);
    document.getElementById('acc-reset').addEventListener('click', () => sendReset(S.email));

    document.getElementById('acc-loading').style.display = 'none';
    document.getElementById('acc-content').style.display = 'block';
  })();
</script>

</body>
